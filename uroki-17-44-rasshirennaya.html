.btn:focus-visible { outline: 3px solid #A5B4FC; outline-offset: 2px; }

/* Зебра */
.list-item:nth-child(even) { background: #F8FAFC; }

/* Последний без отступа */
.list-item:last-child { margin-bottom: 0; }

/* Исключение */
.nav li:not(:last-child) { margin-right: 24px; }

/* Иконка-галочка */
.checklist li::before { content: "✓"; color: var(--color-accent); margin-right: 8px; }

/* Подчёркивание, растущее при наведении */
.link { position: relative; text-decoration: none; }
.link::after {
  content: ""; position: absolute; left: 0; bottom: -2px;
  width: 100%; height: 2px; background: var(--color-accent);
  transform: scaleX(0); transform-origin: left;
  transition: transform .25s ease;
}
.link:hover::after { transform: scaleX(1); }</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Убрали outline у :focus «чтобы красиво»</strong> — сломали навигацию с клавиатуры. <strong>content забыт у ::before</strong> — элемент не отрисуется. <strong>Анимация width вместо transform</strong> — тормозит. <strong>transform-origin не указан</strong> — линия растёт из центра, а не слева.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Добавить состояния всем интерактивным элементам</div>
<div class="task-why">Зачем: сайт без hover и focus ощущается мёртвым.</div>
<ol class="steps">
<li>Добавь :hover и :focus-visible всем кнопкам.</li>
<li>Сделай «зебру» в списке через nth-child(even).</li>
<li>Сделай подчёркивание, растущее при наведении.</li>
<li>Добавь иконки к чек-листу через ::before.</li>
<li>Проверь всё с клавиатуры — виден ли фокус?</li>
</ol>
<div class="task-r">Результат: интерфейс, который реагирует на действия.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Убрали outline.</strong> Сломали клавиатуру.</li>
<li><strong>content забыт.</strong> Не отрисуется.</li>
<li><strong>Анимация width.</strong> Тормозит.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем псевдокласс отличается от псевдоэлемента?</li>
<li>Зачем :focus-visible?</li>
<li>Что будет без content у ::before?</li>
<li>Почему анимируют transform?</li></ol></div>
`},

{t:"Адаптив: media queries и mobile-first",g:"Заставить макет работать на всех экранах.",c:`
<h3>Зачем этот урок</h3>
<p><strong>Медиазапрос</strong> — условие: «если экран такой-то, примени такие-то стили». <strong>Mobile-first</strong> — сначала базовые стили для телефона, потом дополняем для больших экранов через min-width.</p>

<h3>Простым языком</h3>
<p>Стили <strong>накапливаются</strong>, а не заменяются. min-width: 768px = «начиная с 768 и шире» → дополняет базовые. max-width = «до 768 включительно» → переопределяет, нужны «отменяющие» правила.</p>
<p>Ширины для проверки: 320, 390, 768, 1024, 1440.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Медиазапрос</dt><dd>Условие применения стилей по параметрам экрана.</dd>
<dt>Брейкпоинт</dt><dd>Ширина, на которой происходит перестроение.</dd>
<dt>Min-width</dt><dd>Применять от указанной ширины и шире.</dd>
<dt>Max-width</dt><dd>Применять до указанной ширины.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему mobile-first даёт меньше кода? Базовые стили пишутся для самого частого случая, а для десктопа добавляются исключения. При десктоп-first наоборот. Почему брейкпоинты по контенту, а не по устройствам? Устройств много, а контент один — ломается он в предсказуемых местах.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Медиазапрос — как правила поведения в разных помещениях: «в библиотеке тихо», «на концерте громко». Не нужны отдельные люди для каждого места, нужны правила. min-width — «с 18 лет можно»: чем старше, тем больше прав добавляется, старые не отменяются.</p></div>

<h3>Пример кода</h3>
<pre>/* 1. База: телефон */
.container { width: 100%; padding: 0 16px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

/* 2. Планшет: от 768px */
@media (min-width: 768px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
  .container { padding: 0 32px; }
}

/* 3. Десктоп: от 1024px */
@media (min-width: 1024px) {
  .grid { grid-template-columns: repeat(4, 1fr); gap: 32px; }
  .container { max-width: 1280px; margin: 0 auto; }
}</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>max-width вместо min-width</strong> — код растёт и конфликтует. <strong>Брейкпоинты по устройствам</strong> — ломается на нестандартных экранах. <strong>Забыли 320 px</strong> — дешёвые Android. <strong>Блок ломается на 375 px</strong> — не проверили реальные ширины.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Сверстать адаптив по методу mobile-first</div>
<div class="task-why">Зачем: получить навык, применяемый в каждом проекте.</div>
<ol class="steps">
<li>Напиши базовые стили для 390 px без медиазапросов.</li>
<li>Добавь @media (min-width: 768px) — две колонки.</li>
<li>Добавь @media (min-width: 1024px) — четыре.</li>
<li>Открой DevTools, проверь 320, 390, 768, 1024, 1440.</li>
<li>Убедись: нет горизонтальной прокрутки ни на одной ширине.</li>
<li>Посчитай: сколько медиазапросов понадобилось?</li>
</ol>
<div class="task-r">Результат: адаптивная страница на всех экранах.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>max-width вместо min-width.</strong> Код растёт.</li>
<li><strong>Брейкпоинты по устройствам.</strong> Ломается.</li>
<li><strong>Забыли 320 px.</strong> Дешёвые Android.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Почему mobile-first лучше?</li>
<li>Чем min-width отличается от max-width?</li>
<li>Какие ширины проверять?</li>
<li>Что делать, если блок ломается на 375?</li></ol></div>
`},

{t:"Современные адаптивные приёмы",g:"Писать меньше медиазапросов.",c:`
<h3>Зачем этот урок</h3>
<p>Современный CSS умеет адаптироваться сам. Чем меньше медиазапросов — тем меньше кода и меньше мест, где что-то ломается.</p>
<p><code>clamp()</code> заменяет 3–4 медиазапроса одной строкой. Контейнерные запросы — будущее.</p>

<h3>Простым языком</h3>
<p><code>clamp(32px, 5vw, 64px)</code> — размер плавно меняется, но остаётся в пределах 32–64 px. <code>min()</code>, <code>max()</code> — когда нужен только один предел.</p>
<p><code>@container</code> реагирует на ширину родителя, а не экрана. Нужен <code>container-type: inline-size</code>.</p>
<p><code>@media (prefers-reduced-motion: reduce)</code> — отключить анимации для пользователей, которым они вредят.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Clamp</dt><dd>Функция ограничения значения между мин и макс.</dd>
<dt>Min / max</dt><dd>Функции выбора минимального или максимального значения.</dd>
<dt>Container query</dt><dd>Условие по размеру родителя.</dd>
<dt>Prefers-reduced-motion</dt><dd>Настройка уменьшения анимаций.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему clamp? Он даёт плавный переход без разрывов на брейкпоинтах. Почему @container? Один компонент работает и в сайдбаре, и в широком блоке, без отдельных классов. Почему prefers-reduced-motion? У некоторых людей анимации вызывают головокружение и тошноту — это медицинская необходимость.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Clamp — как термостат: температура плавно держится между минимумом и максимумом, без резких переключений. Контейнерный запрос — как человек, который одевается по погоде на улице, а не по сезону в календаре. Prefers-reduced-motion — как отказ от американских горок: человеку физически плохо, и его просьбу нужно уважать.</p></div>

<h3>Пример кода</h3>
<pre>/* Плавный размер */
h1 { font-size: clamp(32px, 5vw, 64px); }

/* Минимум и максимум */
.card    { width: min(100%, 320px); }
.sidebar { width: max(200px, 20%); }

/* Контейнерный запрос */
.card-wrapper { container-type: inline-size; }
@container (max-width: 400px) {
  .card { flex-direction: column; }
}

/* Уважение к настройкам пользователя */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>clamp без единицы vw</strong> — среднее значение фиксировано, нет плавности. <strong>container-type не поставлен</strong> — @container не сработает. <strong>Забыли prefers-reduced-motion</strong> — часть пользователей физически не может смотреть сайт.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Сократить медиазапросы</div>
<div class="task-why">Зачем: меньше кода — меньше багов.</div>
<ol class="steps">
<li>Переведи размеры заголовков на clamp().</li>
<li>Ширины карточек — на min(100%, Npx).</li>
<li>Сделай компонент с @container.</li>
<li>Добавь prefers-reduced-motion.</li>
<li>Посчитай: сколько медиазапросов удалось убрать?</li>
</ol>
<div class="task-r">Результат: код стал короче и устойчивее.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>clamp без vw.</strong> Нет плавности.</li>
<li><strong>container-type не стоит.</strong> Не сработает.</li>
<li><strong>Забыли reduced-motion.</strong> Тошнота.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Что делает clamp(32px, 5vw, 64px)?</li>
<li>Чем @container отличается от @media?</li>
<li>Зачем prefers-reduced-motion?</li>
<li>Когда min() полезнее clamp()?</li></ol></div>
`},

{t:"Анимации: transitions",g:"Делать плавные, «дорогие» интерфейсы.",c:`
<h3>Зачем этот урок</h3>
<p><code>transition</code> — плавный переход при изменении состояния. Сайт без переходов кажется сломанным: навёл курсор — ничего не произошло, кликнул — мгновенно прыгнуло.</p>
<div class="note">Золотое правило: <strong>анимируй только <code>transform</code> и <code>opacity</code></strong>. Они не заставляют браузер пересчитывать layout. Анимация width, height, margin визуально «дешёвая» и тормозит.</div>

<h3>Простым языком</h3>
<p>Оптимальная длительность hover: 0.15–0.3 с. Нажатие делают быстрее наведения — отклик должен быть мгновенным.</p>
<p>Функции плавности: <code>ease</code> и <code>ease-out</code> — рабочие лошадки. <code>linear</code> выглядит механически.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Transition</dt><dd>Плавный переход между двумя состояниями.</dd>
<dt>Easing</dt><dd>Функция плавности анимации.</dd>
<dt>Duration</dt><dd>Длительность перехода.</dd>
<dt>Transform</dt><dd>Трансформация элемента: сдвиг, масштаб, поворот.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему только transform и opacity? Они обрабатываются на GPU и не вызывают пересчёт layout, поэтому работают плавно. Почему не transition: all? Оно анимирует лишнее, создавая неожиданные эффекты и тормоза. Почему duration 0.2s, а не 0.5s? Слишком долгий переход кажется вязким и раздражает.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Transition — как доводчик двери: дверь не хлопает, а плавно закрывается. Без него дверь захлопывается — резко и неприятно. Transform — как выдвижной ящик: двигается сам ящик, а не вся тумба перестраивается вокруг него.</p></div>

<h3>Пример кода</h3>
<pre>.btn {
  background: var(--color-accent);
  transform: translateY(0);
  box-shadow: 0 4px 12px rgba(79,70,229,.2);
  transition:
    background-color .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}
.btn:hover {
  background: #4338CA;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(79,70,229,.35);
}
.btn:active {
  transform: translateY(0);
  transition-duration: .05s;
}</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>transition: all</strong> — анимирует лишнее и тормозит. <strong>Анимация width/height/margin</strong> — пересчитывает layout, подвисает. <strong>Длительность 0.5s+</strong> — интерфейс кажется вязким. <strong>Нет transition у активного состояния</strong> — обратный переход резкий.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Добавить переходы всем интерактивным элементам</div>
<div class="task-why">Зачем: превратить «сломанный» интерфейс в живой.</div>
<ol class="steps">
<li>Добавь transition к кнопкам, ссылкам, карточкам.</li>
<li>Карточка должна приподниматься при наведении.</li>
<li>Поле ввода — «растущая» рамка при фокусе.</li>
<li>Кнопка — нажатие быстрое (.05s), наведение медленное (.2s).</li>
<li>Проверь в DevTools → Performance: 60 fps?</li>
</ol>
<div class="task-r">Результат: интерфейс, который приятно трогать.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>transition: all.</strong> Тормозит.</li>
<li><strong>Анимация layout.</strong> Подвисает.</li>
<li><strong>Долгий duration.</strong> Вязкий интерфейс.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Какие свойства безопасно анимировать?</li>
<li>Почему transition: all — плохо?</li>
<li>Какая оптимальная длительность?</li>
<li>Зачем нажатие быстрее наведения?</li></ol></div>
`},

{t:"Анимации: keyframes и transform",g:"Создавать сложные многошаговые анимации.",c:`
<h3>Зачем этот урок</h3>
<p><code>@keyframes</code> — сценарий анимации: «на 0% такой, на 50% сякой, на 100% другой». Браузер проигрывает его. Нужен, когда переходов между двумя состояниями недостаточно.</p>

<h3>Простым языком</h3>
<p><code>animation-fill-mode: both</code> — держать первый и последний кадр, иначе элемент мигает.</p>
<p>Каскад появления: разные <code>animation-delay</code>. Элементы появляются один за другим.</p>
<p>Shimmer-скелетон — анимированная заглушка во время загрузки.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Keyframes</dt><dd>Сценарий анимации с ключевыми кадрами.</dd>
<dt>Fill-mode</dt><dd>Поведение анимации до и после проигрывания.</dd>
<dt>Stagger</dt><dd>Задержка между анимациями однотипных элементов.</dd>
<dt>Shimmer</dt><dd>Эффект бегущего блеска для заглушек.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему fill-mode: both? Без него элемент возвращается в исходное состояние до и после анимации, что выглядит как мигание. Почему задержки по 0.1s? Создают ощущение «сборки» страницы — приём, который сразу делает сайт дороже. Почему infinite осторожно? Бесконечная анимация отвлекает от контента.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Keyframes — как хореография танца: указано, где танцор в начале, в середине и в конце. Fill-mode — как свет в театре: остаётся включённым, пока сцена не закончится. Stagger — как зал оваций: люди встают не одновременно, а волной с задних рядов.</p></div>

<h3>Пример кода</h3>
<pre>@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.hero-title { animation: fadeInUp .6s ease-out both; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}
.btn-pulse { animation: pulse 2s ease-in-out infinite; }

@keyframes shimmer {
  0%   { background-position: -1000px 0; }
  100% { background-position: 1000px 0; }
}
.skeleton {
  background: linear-gradient(90deg,#EEF1F6 25%,#F8FAFC 50%,#EEF1F6 75%);
  background-size: 1000px 100%;
  animation: shimmer 1.5s infinite;
}

/* Каскад */
.hero-title   { animation: fadeInUp .6s ease-out .1s both; }
.hero-text    { animation: fadeInUp .6s ease-out .2s both; }
.hero-btn     { animation: fadeInUp .6s ease-out .3s both; }
.hero-image   { animation: fadeInUp .6s ease-out .4s both; }</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Забыли fill-mode: both</strong> — элемент мигает в начальном положении. <strong>infinite там, где не нужно</strong> — отвлекает от контента. <strong>Анимация layout-свойств</strong> — тормозит. <strong>Слишком долгий duration</strong> — посетитель ждёт.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Собрать три анимации</div>
<div class="task-why">Зачем: три типовых случая, покрывающие большинство задач.</div>
<ol class="steps">
<li>Каскад появления героя с тремя задержками.</li>
<li>Shimmer-скелетон для карточки товара.</li>
<li>Мягкая пульсация CTA-кнопки.</li>
<li>Добавь prefers-reduced-motion для отключения.</li>
<li>Проверь: fill-mode: both, иначе элементы мигают.</li>
</ol>
<div class="task-r">Результат: три рабочие анимации в арсенале.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Забыли fill-mode.</strong> Мигает.</li>
<li><strong>infinite зря.</strong> Отвлекает.</li>
<li><strong>Анимация layout.</strong> Тормозит.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем @keyframes отличается от transition?</li>
<li>Зачем fill-mode: both?</li>
<li>Как сделать каскад?</li>
<li>Что такое shimmer?</li></ol></div>
`},

{t:"CSS-переменные, БЭМ, организация файлов",g:"Писать CSS, который не превратится в свалку через месяц.",c:`
<h3>Зачем этот урок</h3>
<p><strong>CSS-переменные</strong> — константы: задал один раз, используешь везде. <strong>БЭМ</strong> — система имён: Блок, Элемент, Модификатор. Вместе они избавляют от главной боли CSS — «войны специфичностей».</p>

<h3>Простым языком</h3>
<p>Имя по БЭМ: <code>.card</code> (блок), <code>.card__title</code> (элемент, два подчёркивания), <code>.card--featured</code> (модификатор, два дефиса).</p>
<p>Структура файлов (7-1): <code>base/</code> (сброс, переменные, типографика), <code>layout/</code> (контейнер, шапка, подвал), <code>components/</code> (кнопка, карточка, форма), <code>utilities.css</code>.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>БЭМ</dt><dd>Методология именования: Блок, Элемент, Модификатор.</dd>
<dt>CSS-переменная</dt><dd>Пользовательское свойство в :root.</dd>
<dt>Война специфичности</dt><dd>Ситуация, когда стили конфликтуют из-за высокой специфичности.</dd>
<dt>Слои</dt><dd>Разделение CSS по функциональному назначению.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему нельзя стилизовать .card h3? Это создаёт войну специфичности и ломает переиспользуемость. Почему токены называются по роли? «red-block» через месяц станет синим, а имя останется. Почему слои? Чтобы общие правила шли первыми, а точечные могли их переопределить.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>БЭМ — как адресная система: «дом 5, квартал 3, комната 2». Понятно, что где, и если переставишь мебель в комнате, это не заделет другие квартиры. CSS-переменные — как стандартные размеры в строительстве: высота потолка 2.7 м забита в проект, и все дома получаются одинаковыми.</p></div>

<h3>Пример кода</h3>
<pre>.card                { border: 1px solid #E4E8F0; border-radius: 12px; padding: 24px; }
.card--featured      { border-color: var(--color-accent); }
.card__title         { font-family: var(--font-head); font-size: 20px; }
.card__btn           { background: var(--color-accent); color: #fff; }

&lt;article class="card card--featured"&gt;
  &lt;h3 class="card__title"&gt;Стрижка&lt;/h3&gt;
  &lt;p class="card__text"&gt;40 минут&lt;/p&gt;
  &lt;button class="card__btn"&gt;Записаться&lt;/button&gt;
&lt;/article&gt;</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Вложенные селекторы .a .b .c</strong> — война специфичности. <strong>!important чтобы починить</strong> — чинит одно, ломает десять. <strong>Имена вида .red-block</strong> — через месяц цвет станет синим. <strong>Всё в одном файле</strong> — через месяц не найдёшь нужное правило.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Перевести проект на переменные и БЭМ</div>
<div class="task-why">Зачем: получить CSS, который не развалится через месяц.</div>
<ol class="steps">
<li>Вынеси все цвета, отступы, шрифты в :root.</li>
<li>Замени хардкод на var() во всех правилах.</li>
<li>Переименуй классы по БЭМ.</li>
<li>Убери вложенные селекторы вида .card h3.</li>
<li>Разбей CSS на 4 файла по слоям.</li>
<li>Проверка: удали компонент из HTML — CSS не должен глобально сломаться.</li>
</ol>
<div class="task-r">Результат: масштабируемый CSS. Это разница между «помидорами» и профессионалом.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Вложенные селекторы.</strong> Война специфичности.</li>
<li><strong>!important чтобы починить.</strong> Ломает десять.</li>
<li><strong>Имена .red-block.</strong> Цвет станет другим.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Из чего состоит имя по БЭМ?</li>
<li>Почему нельзя стилизовать .card h3?</li>
<li>Что хранят в :root?</li>
<li>Назови четыре слоя файлов CSS.</li></ol></div>
`},

{t:"Sass/SCSS",g:"Ускорить написание CSS и избавиться от повторов.",c:`
<h3>Зачем этот урок</h3>
<p>SCSS — «CSS с суперспособностями»: переменные, вложенность, миксины, циклы. Браузер не понимает SCSS — он компилируется в обычный CSS. Для больших проектов и WordPress-тем экономит часы.</p>

<h3>Простым языком</h3>
<p>Символ <code>&</code> ссылается на родительский селектор. Миксин — переиспользуемый блок свойств. Цикл <code>@for</code> — генерация утилит.</p>
<p>Когда SCSS избыточен: маленькие проекты (хватит CSS-переменных) и проекты на Tailwind.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>SCSS</dt><dd>Препроцессорный язык, компилируется в CSS.</dd>
<dt>Миксин</dt><dd>Переиспользуемый блок CSS-свойств.</dd>
<dt>Вложенность</dt><dd>Возможность вкладывать селекторы друг в друга.</dd>
<dt>Компиляция</dt><dd>Преобразование SCSS в CSS.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему браузер не понимает SCSS? Это язык разработчика, а не браузера; в продакшен всегда идёт обычный CSS. Почему & полезен? Избавляет от повторения имени родителя. Почему не глубокая вложенность? Компилируется в длинные селекторы, ломает специфичность.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>SCSS — как шаблон документа с автозаполнением: ввёл одну переменную — подставилась везде. Миксин — как стандартный блок в договоре: вставил в пять договоров, при изменении шаблона поменялось везде. Компилятор — как переводчик: говоришь на своём языке, а партнёр получает понятный ему.</p></div>

<h3>Пример кода</h3>
<pre>$color-accent: #4F46E5;
$space: 8px;
$gap: $space * 3;               // 24px

.card {
  padding: $space * 3;
  border-radius: 8px;

  &__title { font-size: 20px; }   // → .card__title
  &:hover  { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
}

@mixin button($bg, $color: #fff) {
  background: $bg;
  color: $color;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
}
.btn-primary   { @include button($color-accent); }
.btn-secondary { @include button(#E4E8F0, #101828); }

@for $i from 1 through 8 {
  .mt-#{$i} { margin-top: $space * $i; }
}</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Глубокая вложенность (4+ уровня)</strong> — компилируется в длинные селекторы. <strong>Миксин вместо простого правила</strong> — избыточно. <strong>Забыл скомпилировать</strong> — сайт показывает старый CSS.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Перевести проект на SCSS</div>
<div class="task-why">Зачем: освоить инструмент, ускоряющий работу на 20–30%.</div>
<ol class="steps">
<li>Установи Sass глобально.</li>
<li>Переименуй style.css в style.scss.</li>
<li>Вынеси цвета и отступы в переменные.</li>
<li>Сделай миксин button($bg), примени к двум кнопкам.</li>
<li>Сгенерируй утилиты .mt-1 … .mt-8 через @for.</li>
<li>Скомпилируй и проверь в браузере.</li>
</ol>
<div class="task-r">Результат: работающая сборка SCSS и три приёма в арсенале.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Глубокая вложенность.</strong> Ломает специфичность.</li>
<li><strong>Миксин вместо правила.</strong> Избыточно.</li>
<li><strong>Забыл скомпилировать.</strong> Старый CSS.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>

<h3>Зачем этот урок</h3>
<p><strong>Vite</strong> — сборщик: берёт проект с SCSS, ES-модулями и кучей файлов, выдаёт оптимизированный <code>dist/</code> для заливки. <strong>Pixel perfect</strong> — когда свёрстанный сайт совпадает с макетом, и проверяется это инструментами, а не «на глаз».</p>

<h3>Простым языком</h3>
<p>WebP — на 25–35% легче JPEG при том же качестве. AVIF — ещё легче, но поддержка чуть хуже. SVG — для иконок и логотипов.</p>
<p><code>npm run build</code> собирает оптимизированный проект в <code>dist/</code>.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Сборщик</dt><dd>Инструмент, подготавливающий проект к продакшену.</dd>
<dt>Vite</dt><dd>Современный сборщик фронтенда.</dd>
<dt>Pixel perfect</dt><dd>Точное соответствие свёрстанного сайта макету.</dd>
<dt>WebP / AVIF</dt><dd>Современные форматы изображений.</dd>
<dt>CLS</dt><dd>Метрика стабильности макета.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему WebP лучше JPEG? Меньший размер при том же качестве = быстрее загрузка = лучше конверсия и SEO. Почему width и height у картинок? Без них браузер не резервирует место, и макет прыгает при загрузке — это CLS. Почему проверять в Safari? Там чаще всего ломается вёрстка из-за особенностей движка.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Сборщик — как упаковка товара перед отправкой: всё аккуратно сложено, лишнее убрано, размеры оптимальны. Pixel perfect — как примерка костюма: сидит идеально, ни одна складка не торчит. CLS — как полка, на которой книги падают, когда добавляешь новую: покупатель уходит, не дождавшись порядка.</p></div>

<h3>Чек-лист приёмки</h3>
<ul>
<li>Lighthouse Performance &gt; 90</li>
<li>Lighthouse Accessibility = 100</li>
<li>Нет ошибок в консоли</li>
<li>Работает в Chrome, Safari, Firefox, iOS, Android</li>
<li>Нет горизонтальной прокрутки на 320px</li>
<li>Все картинки сжаты, с width/height</li>
<li>Шрифты с кириллицей, loading="lazy" ниже первого экрана</li>
<li>Favicon, Title и description заполнены</li>
</ul>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>JPEG вместо WebP</strong> — теряете 25–35% веса бесплатно. <strong>Нет width/height у картинок</strong> — макет прыгает (CLS). <strong>Не проверяли в Safari</strong> — часто ломается именно там. <strong>Не сжали картинки</strong> — сайт грузится дольше.</p></div>

<li>Проверь на 320 px — нет горизонтальной прокрутки?</li>

</ol>
<div class="task-r">Результат: сайт, который проходит объективную проверку.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
