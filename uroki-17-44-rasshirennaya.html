<h3>Зачем этот урок</h3>
<p>Компонент — элемент, который рисуешь один раз, а используешь сто раз. Заменил цвет в компоненте «Кнопка» — поменялись все 40 кнопок на всех макетах. Это не «удобство», а <strong>экономия часов</strong>: без компонентов правка кнопки в магазине на 15 экранов занимает день.</p>
<p>Второй момент: компоненты заставляют думать <strong>состояниями</strong>. У кнопки их четыре, и новички обычно рисуют только первое. Потом оказывается, что на наведении ничего не происходит, и сайт ощущается мёртвым.</p>

<h3>Простым языком</h3>
<p>Четыре состояния кнопки: <strong>default</strong> (обычное), <strong>hover</strong> (курсор наведён — темнее), <strong>active</strong> (нажата — ещё темнее и ниже), <strong>disabled</strong> (недоступна — серая).</p>
<p>Карточка товара: фото, название, цена, кнопка. Поле ввода: подпись <strong>над</strong> полем, не внутри.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Компонент</dt><dd>Переиспользуемый элемент интерфейса.</dd>
<dt>Экземпляр</dt><dd>Копия компонента на макете.</dd>
<dt>Состояние</dt><dd>Вариант внешнего вида элемента: default, hover, active, disabled.</dd>
<dt>Дизайн-система</dt><dd>Набор компонентов и правил их использования.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему четыре состояния, а не одно? Без hover пользователь не понимает, что элемент интерактивный. Почему подпись над полем, а не placeholder? Placeholder исчезает при вводе, и пользователь забывает, что заполнял. Почему компоненты, а не копирование слоёв? При копировании правка одного не задевает другие, и через день они расходятся.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Компонент — как форма для выпечки печенья. Один раз сделал форму — печёшь сколько хочешь, все изделия одинаковые. Захотел другой размер — поменял форму, все новые печенья другого размера. Если лепить каждое руками — разбег в 2 мм, и набор выглядит неряшливо.</p></div>

{t:"Auto-layout и компоненты",g:"Делать макеты, которые легко менять и легко отдать в вёрстку.",c:`
<h3>Зачем этот урок</h3>
<p>Auto-layout — «умный» контейнер в Figma. Ты говоришь: «этот блок идёт сверху вниз, отступ между детьми 16 px, внутренние поля 24 px». Добавляешь элемент — блок сам вырастает. Убираешь — сам сжимается. Текст стал в две строки вместо трёх — всё ниже сдвинулось автоматически.</p>
<p>Главный секрет: auto-layout — <strong>прямой аналог CSS Flexbox</strong>. Поймёшь одно — поймёшь другое. Поэтому этот урок экономит время дважды.</p>

<h3>Простым языком</h3>
<p>Режимы размера: <strong>Fixed</strong> (размер не меняется), <strong>Hug Contents</strong> (блок по контенту), <strong>Fill Container</strong> (растянуть на доступное).</p>
<p>Когда отдаёшь макет в вёрстку, auto-layout работает как документация: разработчик смотрит на настройки и сразу пишет CSS. Без него он угадывает отступы, и почти всегда угадывает неточно.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Auto-layout</dt><dd>Умный контейнер, перестраивающий содержимое автоматически.</dd>
<dt>Direction</dt><dd>Направление: Vertical или Horizontal.</dd>
<dt>Gap</dt><dd>Отступ между дочерними элементами.</dd>
<dt>Padding</dt><dd>Внутренние поля контейнера.</dd>
<dt>Hug / Fill</dt><dd>Режимы определения размера.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему настройки совпадают с Flexbox один к одному? Потому что Figma изначально проектировался как инструмент, результат которого можно перенести в код. Direction Vertical = flex-direction: column, Gap = gap, Fill = flex: 1. Почему Gap лучше ручных отступов? Gap удаляется одним движением, а ручные отступы — нет.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Auto-layout — как полка-стеллаж с регулируемыми перегородками. Положил книги — перегородки встали по размеру. Добавил книгу — соседние сдвинулись сами. А без него ты вручную расставляешь каждую книгу линейкой и переделываешь всю полку при любой замене.</p></div>

{t:"Адаптивный дизайн и mobile-first",g:"Проектировать сначала для телефона, потом для монитора.",c:`
<h3>Зачем этот урок</h3>
<p>70–80% трафика многих сайтов — телефоны. Но новички рисуют макет на 1440 px, вкладываются в него, а потом «ужимают» под телефон в панике за день до сдачи. В результате мобильная версия скомканная: текст мелкий, кнопки неудобные, блоки не влезают.</p>
<p><strong>Mobile-first</strong> переворачивает порядок: рисуешь сначала 390 px — только главное, крупно, по вертикали. Потом расширяешь: на планшете блоки встают в две колонки, на десктопе — в три-четыре. Мобильная версия перестаёт быть «ужатой» и становится продуманной.</p>

<h3>Простым языком</h3>
<p>Что происходит с блоками при сжатии: 4 колонки преимуществ → одна колонка списком. 3 тарифа рядом → вертикальный стек, средний выделен. «Текст + фото» → текст сверху, фото снизу. Меню → бургер.</p>
<p>Почему <code>min-width</code> лучше <code>max-width</code>: стили <strong>накапливаются</strong>, а не переопределяют друг друга.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Адаптив</dt><dd>Вёрстка, перестраивающаяся под размер экрана.</dd>
<dt>Mobile-first</dt><dd>Подход: базовые стили для телефона, потом дополнения.</dd>
<dt>Брейкпоинт</dt><dd>Ширина, на которой происходит перестроение.</dd>
<dt>Медиазапрос</dt><dd>Условие применения стилей по параметрам экрана.</dd>
<dt>Responsive</dt><dd>Отзывчивая вёрстка.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему mobile-first лучше? Базовые стили пишутся для самого частого случая (телефон), а для десктопа добавляются исключения. При десктоп-first наоборот — приходится писать «отменяющие» правила, код растёт и конфликтует. Почему брейкпоинты по контенту, а не по устройствам? Устройств много и экраны разные, а контент один — ломается он в предсказуемых местах.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Mobile-first — как собирать чемодан. Сначала кладёшь необходимое (телефон, документы, зарядка), а потом, если осталось место, добавляешь удобства. А если начать с большого чемодана и пытаться запихнуть всё в ручную кладь — половину придётся выбросить. Мобильный экран — та самая ручная кладь: влезает только главное.</p></div>

<h3>Пример кода</h3>
<pre>/* 1. База: телефон */
.container { width: 100%; padding: 0 16px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

/* 2. Планшет: от 768px */
@media (min-width: 768px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
}

/* 3. Десктоп: от 1024px */
@media (min-width: 1024px) {
  .grid { grid-template-columns: repeat(4, 1fr); gap: 32px; }
  .container { max-width: 1280px; margin: 0 auto; }
}</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Рисовать только десктоп</strong> — мобильная версия скомканная. <strong>max-width вместо min-width</strong> — приходится писать отменяющие правила. <strong>Прятать контент на телефоне</strong> — иногда нужно, но чаще перестроить. <strong>Забыть 320 px</strong> — дешёвые Android ещё живы.</p></div>

<li>3 тарифа рядом → вертикальный стек.</li>
<li>«Текст + фото» → текст сверху, фото снизу.</li>
<li>Меню → бургер, нарисуй открытое состояние.</li>
<li>Отступы по бокам — минимум 16 px.</li>
<li>Проверь: нет горизонтальной прокрутки?</li>
</ol>
<div class="task-r">Результат: мобильный макет с принятыми решениями.</div></div>

<li><strong>max-width вместо min-width.</strong> Код растёт и конфликтует.</li>
<li><strong>Прятать контент.</strong> Чаще перестроить, а не удалять.</li>
<li><strong>Забыть 320 px.</strong> Дешёвые Android живы.</li>

{t:"Дизайн-система и передача в вёрстку",g:"Оформить макет так, чтобы верстальщик не догадывался.",c:`
<h3>Зачем этот урок</h3>
<p>Дизайн-система — набор правил и компонентов, которые делают сайт единым. Для одного лендинга это одна страница с цветами, шрифтами и 10 компонентами. Для большого проекта — библиотека на сто элементов.</p>
<p>Главная польза не в «красоте», а в <strong>скорости и предсказуемости</strong>. Когда есть токены, каждое решение занимает секунды: нужен отступ — берёшь <code>--space-4</code>. Нет системы — каждый раз выбираешь «на глаз», и через 20 блоков макет становится неровным.</p>
<p>Второй смысл: <strong>токены — язык общения с разработчиком</strong>. Цвет называется не «индиго-синий», а <code>color-accent</code>. Верстальщик пишет <code>var(--color-accent)</code>, и разночтений не возникает.</p>

<h3>Простым языком</h3>
<p>Токен — переменная, используемая и в макете, и в коде. Цвета, отступы, шрифты, радиусы, тени.</p>
<p>Чек-лист «макет готов к вёрстке»: отступы кратны 4 или 8, цвета через стили, шрифты с кириллицей, состояния hover/active у всех кликабельных, версия под 390 px, картинки в SVG или 2x WebP, компоненты названы понятно.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Токен</dt><dd>Переменная дизайна: цвет, отступ, размер.</dd>
<dt>Дизайн-система</dt><dd>Набор компонентов и правил.</dd>
<dt>Шпаргалка</dt><dd>Страница со всеми стилями проекта.</dd>
<dt>Передача в вёрстку</dt><dd>Процесс передачи макета разработчику.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему токены называются по роли, а не по виду? «red-block» через месяц станет синим, а имя останется. Почему слои называют по смыслу? Верстальщик должен понимать, что за элемент, иначе будет спрашивать. Почему состояния hover обязательны? Верстальщик их не придумает — сайт получится статичным.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Дизайн-система — как поваренная книга ресторана. Есть список стандартных ингредиентов с замерами: «соль — 5 г», «мука — 200 г». Повар не отмеряет на глаз каждый раз, он берёт готовую меру. Без книги каждый повар сделает блюдо по-своему, и сеть развалится.</p></div>

<figure><svg viewBox="0 0 840 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Токены дизайн-системы">

<text x="70" y="71" fill="#101828" font-size="10" font-family="monospace">--color-bg</text>

{t:"Структура HTML-документа",g:"Написать правильный каркас страницы.",c:`
<h3>Зачем этот урок</h3>
<p>HTML — не язык программирования, а <strong>разметка</strong>. Ты не программируешь страницу, ты расставляешь ярлыки: «это заголовок», «это абзац», «это картинка». Браузер читает эти ярлыки и понимает, что показать и в каком порядке.</p>
<p>Важность правильного каркаса трудно переоценить. Три строки в <code>&lt;head&gt;</code> отличают сайт, который работает, от сайта, который показывает кракозябры, выглядит на телефоне как почтовая марка и не попадает в поиск.</p>

<h3>Простым языком</h3>
<p>Каждый тег открывается <code>&lt;тег&gt;</code> и закрывается <code>&lt;/тег&gt;</code>. Как скобки: открыл — закрыл. Незакрытый тег — самая частая ошибка новичка, и она ломает всю страницу ниже.</p>
<p>Дерево документа: <code>html</code> → <code>head</code> (мозги, не видно) + <code>body</code> (тело, всё видимое).</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Тег</dt><dd>Элемент разметки в угловых скобках.</dd>
<dt>Атрибут</dt><dd>Дополнительный параметр тега, например class или href.</dd>
<dt>Doctype</dt><dd>Объявление типа документа, говорит браузеру использовать HTML5.</dd>
<dt>Корневой элемент</dt><dd>Элемент html, содержащий всю страницу.</dd>
<dt>Валидность</dt><dd>Соответствие разметки стандартам.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему head отделён от body? В head — метаданные, которые браузер и поисковики читают до отрисовки, а в body — то, что увидит пользователь. Почему script в конце body? Иначе браузер остановит отрисовку, чтобы выполнить скрипт, и страница «подвиснет». Почему lang важен? Поисковик и скринридер используют его для выбора языка произношения.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>HTML-документ — как письмо. Есть конверт с адресом и маркой (head): почтальон понимает, куда нести и какого класса отправление. И есть сам лист с текстом (body): то, что прочитает получатель. Если на конверте нет адреса — письмо не дойдёт, каким бы хорошим ни был текст.</p></div>

<h3>Полный каркас</h3>
<pre>&lt;!DOCTYPE html&gt;
&lt;html lang="ru"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
  &lt;title&gt;Барбершоп «Острие» в Москве&lt;/title&gt;
  &lt;link rel="stylesheet" href="css/style.css"&gt;

  &lt;h1&gt;Стрижка и борода за 40 минут&lt;/h1&gt;

  &lt;script src="js/main.js"&gt;&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Забыли charset</strong> — русский текст станет кракозябрами. <strong>Забыли viewport</strong> — сайт на телефоне в масштабе десктопа. <strong>Незакрытый тег</strong> — половина страницы уедет внутрь. <strong>Script в head без defer</strong> — страница морозит полсекунды.</p></div>

<h3>Что делать на практике</h3>

<ol class="steps">

<li>Верни её. Убери link — проверь, что стили отключились.</li>
<li>Верни всё, проверь консоль на ошибки.</li>

{t:"Текст, списки, ссылки, изображения",g:"Разместить контент семантически правильно.",c:`
<h3>Зачем этот урок</h3>
<p>Заголовки <code>h1</code>–<code>h6</code> — это <strong>не размер шрифта</strong>, а уровень важности. Это ключевое различие, которое новички усваивают позже всего. Если выбирать заголовок «чтобы был крупнее» — получится каша, из которой поисковик и скринридер не поймут структуру.</p>
<p>Правило: <code>h1</code> — один на страницу, главная тема. <code>h2</code> — разделы. <code>h3</code> — подразделы. Порядок нельзя перескакивать: после <code>h1</code> идёт <code>h2</code>, а не <code>h4</code>. Размер — дело CSS, а не HTML.</p>

<h3>Простым языком</h3>
<p>Заголовки работают как оглавление книги. Без них скринридер не сможет навигацию по странице предложить, а поисковик не поймёт, о чём разделы.</p>
<p><code>alt</code> — текст, который увидит человек, если картинка не загрузилась, и который прочитает скринридер вслух незрячему. Плохой <code>alt="фото1.jpg"</code> не несёт информации. Хороший <code>alt="Интерьер барбершопа с тремя креслами"</code> описывает то, что важно. Для чисто декоративных картинок ставь пустой <code>alt=""</code>.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Заголовок</dt><dd>Элемент h1–h6, обозначающий уровень важности.</dd>
<dt>Семантика</dt><dd>Смысловое значение разметки, а не только внешний вид.</dd>
<dt>alt</dt><dd>Текстовое описание изображения для доступности.</dd>
<dt>Ненумерованный список</dt><dd>ul — когда порядок не важен.</dd>
<dt>Нумерованный список</dt><dd>ol — когда порядок важен.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему нельзя выбирать заголовок по размеру? Размер задаётся в CSS, а уровень заголовка — смысловая разметка. Если выбрать h4 потому что «красиво», поисковик решит, что это второстепенный блок. Почему alt обязателен? Без него незрячий пользователь не поймёт, что на картинке, а если она не загрузилась — увидит пустое место.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Заголовки — оглавление в учебнике. Глава, параграф, подпараграф. Если всё написать одним шрифтом, ты не найдёшь нужную тему. Alt — как подпись под картиной в музее: без неё ты смотришь на полотно и не понимаешь, что на нём изображено.</p></div>

{t:"Семантические теги",g:"Разметить страницу так, чтобы её понимали поисковики и скринридеры.",c:`
<h3>Зачем этот урок</h3>
<p>Раньше верстали «всё через <code>&lt;div&gt;</code>». Теперь есть теги со <strong>смыслом</strong>: header, nav, main, section, article, footer. Для обычного посетителя разницы нет. А для Google и незрячего человека — огромная: он поймёт, где меню, где основной текст, где подвал.</p>
<p>Практическая польза: семантическая разметка — <strong>бесплатные очки SEO и доступности</strong>. Lighthouse проверяет её отдельно, и страница на div теряет баллы просто потому, что структуру невозможно понять.</p>

<h3>Простым языком</h3>
<p>Шесть тегов: <code>header</code> — шапка, <code>nav</code> — меню, <code>main</code> — основной контент (ровно один), <code>section</code> — смысловой раздел, <code>article</code> — самостоятельная единица, <code>footer</code> — подвал.</p>
<p><code>div</code> — «нейтральный ящик» без смысла. Используй, когда нужен контейнер просто для группировки — например, обернуть элементы для CSS Grid. Но если у блока есть роль — бери смысловой тег.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Семантика</dt><dd>Смысловое значение элементов разметки.</dd>
<dt>Лендинг-разметка</dt><dd>Использование header, nav, main, section, article, footer.</dd>
<dt>Роль элемента</dt><dd>Назначение блока на странице.</dd>
<dt>Нейтральный контейнер</dt><dd>div — без смысловой нагрузки.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему main один? Это основной контент страницы, и скринридер предлагает «перейти к основному содержимому» — если их два, команда сломается. Почему section без заголовка — сигнал? Раздел без темы не несёт сообщения, значит, он лишний. Почему article можно вырезать и перенести? Потому что он самостоятелен: новость, отзыв, карточка товара.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Семантика — как план этажа здания. На нём подписано: «вход», «reception», «офисы», «архив». Без плана ты ходишь по коридорам и не понимаешь, куда идти. Скринридер — посетитель с этим планом: он читает подписи и сразу идёт в нужный кабинет, а не обходит всё здание.</p></div>

<h3>Пример кода</h3>

    &lt;nav class="main-nav"&gt;

        &lt;h3&gt;Стрижка&lt;/h3&gt;

      &lt;/article&gt;

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Два и более main</strong> — ошибка. <strong>Всё на div</strong> — ломает SEO и доступность. <strong>section без заголовка</strong> — сигнал лишнего блока. <strong>article для обёртки страницы</strong> — article это единица, не контейнер.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Переверстать лендинг на семантику</div>
<div class="task-why">Зачем: поднять SEO и доступность без изменения внешнего вида.</div>
<ol class="steps">
<li>Возьми свой лендинг из Урока 22.</li>

{t:"Формы: поля, типы, валидация",g:"Делать удобные формы, которые приносят заявки.",c:`
<h3>Зачем этот урок</h3>
<p>Форма — единственный способ «поговорить» с посетителем. И она же — главное место, где теряются деньги. Каждое лишнее поле снижает число заявок: три поля дают высокую конверсию, семь — среднюю, пятнадцать — низкую.</p>
<p>Правило простое и его нарушают все новички: <strong>минимум полей</strong>. Спрашивай только то, без чего нельзя выполнить заказ. Имя и телефон — обычно достаточно. Остальное можно спросить потом, по телефону.</p>

<h3>Простым языком</h3>
<p>Структура: подписи <strong>над</strong> полями, ошибка <strong>под</strong> полем, чекбокс согласия (не предзаполненный), одна явная кнопка.</p>
<p>Чекаут в 6 полей оптимален. Гостевую покупку разрешать обязательно — регистрация отсекает до 30% заказов.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Форма</dt><dd>Элемент form для сбора данных пользователя.</dd>
<dt>Поле ввода</dt><dd>input различных типов: text, tel, email.</dd>
<dt>Label</dt><dd>Подпись поля, связанная через for и id.</dd>
<dt>Валидация</dt><dd>Проверка данных на корректность.</dd>
<dt>Placeholder</dt><dd>Подсказка внутри поля, не замена label.</dd>
<dt>Чекбокс</dt><dd>Элемент для выбора варианта (да/нет).</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему минимум полей? Каждое лишнее поле — трение. Люди ленивы и уходят с длинных форм. Почему label, а не placeholder? Placeholder исчезает при вводе, пользователь забывает, что заполнял. Почему type="tel", а не text? На телефоне откроется цифровая клавиатура — быстрее и удобнее. Почему чекбокс не предзаполняют? Без активного действия согласие не считается.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Форма — анкета на reception в клинике. Если попросят паспортные данные всех родственников — половина уйдёт. Если только имя и телефон — запишутся все. Подписи над полями — как указатели на стойке: всегда видно, куда писать, а не когда уже начал.</p></div>

</svg><figcaption><b>Рис. 24.1.</b> Структура формы: подписи над полями, ошибка под полем, чекбокс согласия, одна явная кнопка.</figcaption></figure>

<h3>Пример кода</h3>
<pre>&lt;form action="/send.php" method="POST" class="booking-form"&gt;
  &lt;div class="field"&gt;
    &lt;label for="name"&gt;Как к вам обращаться?&lt;/label&gt;
    &lt;input type="text" id="name" name="name" placeholder="Иван" required minlength="2"&gt;
  &lt;/div&gt;
  &lt;div class="field"&gt;
    &lt;label for="phone"&gt;Телефон&lt;/label&gt;
    &lt;input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67"
           pattern="\+?[0-9\s\-\(\)]{10,}" required&gt;
    &lt;small&gt;Позвоним в течение 15 минут&lt;/small&gt;
  &lt;/div&gt;
  &lt;div class="field"&gt;
    &lt;label for="service"&gt;Услуга&lt;/label&gt;
    &lt;select id="service" name="service"&gt;
      &lt;option value="haircut"&gt;Стрижка&lt;/option&gt;
      &lt;option value="beard"&gt;Борода&lt;/option&gt;
    &lt;/select&gt;
  &lt;/div&gt;
  &lt;label class="checkbox"&gt;
    &lt;input type="checkbox" name="agree" required&gt;
    Согласен с &lt;a href="/privacy"&gt;политикой конфиденциальности&lt;/a&gt;
  &lt;/label&gt;
  &lt;button type="submit" class="btn"&gt;Записаться&lt;/button&gt;
&lt;/form&gt;</pre>

<table><tr><th>Атрибут</th><th>Что делает</th></tr>
<tr><td>type="tel"</td><td>цифровая клавиатура на телефоне</td></tr>
<tr><td>required</td><td>нельзя отправить пустым</td></tr>
<tr><td>minlength</td><td>минимум символов</td></tr>
<tr><td>pattern</td><td>регулярное выражение</td></tr></table>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Много полей</strong> — конверсия падает. <strong>Placeholder вместо label</strong> — ломает удобство. <strong>Нет сообщения об ошибке</strong> — пользователь не понимает, что не так. <strong>Чекбокс предзаполнен</strong> — согласие не считается. <strong>После отправки ничего</strong> — клиент не уверен, что купил.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Сверстать форму из 4 полей</div>
<div class="task-why">Зачем: получить рабочую форму с правильной структурой.</div>
<ol class="steps">
<li>Создай форму: имя, телефон, услуга (select), комментарий.</li>
<li>К каждому полю — label над ним, связанный через for/id.</li>
<li>Добавь type, required, pattern к телефону.</li>
<li>Добавь чекбокс согласия (непредзаполненный).</li>
<li>Добавь кнопку отправки.</li>
<li>Попробуй отправить пустой — посмотри сообщения браузера.</li>
<li>Замени placeholder на подсказки под полями, где нужно.</li>
</ol>
<div class="task-r">Результат: форма, которую можно отправить и которая проверяет данные.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Много полей.</strong> Каждое минус конверсия.</li>
<li><strong>Placeholder вместо label.</strong> Ломает доступность.</li>
<li><strong>Нет ошибки.</strong> Непонятно, что не так.</li>
<li><strong>Чекбокс предзаполнен.</strong> Согласие не считается.</li>
<li><strong>Нет «Спасибо».</strong> Клиент не уверен.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Сколько полей оптимально?</li>
<li>Чем placeholder отличается от label?</li>
<li>Зачем type="tel"?</li>
<li>Почему чекбокс нельзя предзаполнять?</li></ol></div>
`},

{t:"Доступность: ARIA, alt, label",g:"Сделать сайт usable для всех и улучшить SEO.",c:`
<h3>Зачем этот урок</h3>
<p><strong>Скринридер</strong> — программа, которая читает страницу вслух для незрячего человека. Она опирается только на разметку: если у кнопки нет текста, она прочитает «кнопка» и всё. Пользователь не поймёт, что произойдёт при нажатии.</p>
<p>Но доступность — не только про незрячих. Это ещё человек с телефоном в одной руке, человек в солнечный день, человек, который пользуется только клавиатурой. И это прямой фактор SEO: Lighthouse проверяет доступность отдельно.</p>

<h3>Простым языком</h3>
<p>Три правила: у каждой картинки осмысленный alt (<code>alt="Собака в кресле"</code> ✓, <code>alt="фото1.jpg"</code> ✗, <code>alt=""</code> ✓ только для декоративной). У каждого поля label, связанный через for и id. У каждой иконки-кнопки есть текст — видимый или через aria-label.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>ARIA</dt><dd>Accessible Rich Internet Applications — набор атрибутов доступности.</dd>
<dt>aria-label</dt><dd>Текстовая метка для скринридера.</dd>
<dt>aria-hidden</dt><dd>Скрыть элемент от скринридера.</dd>
<dt>aria-expanded</dt><dd>Состояние раскрытия элемента.</dd>
<dt>aria-live</dt><dd>Область с динамическими изменениями.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему alt="" для декоративной? Пустой alt говорит скринридеру пропустить картинку, а отсутствие alt заставляет его читать имя файла. Почему aria-expanded у бургера? Без него незрячий не поймёт, открылось меню или нет. Почему нельзя убирать outline у :focus? Тогда пользователь клавиатуры не видит, где находится фокус.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>ARIA — как голосовые подсказки в лифте: «двери открываются», «вы на 3 этаже». Без них незрячий не знает, что происходит. Alt — подпись под товаром в магазине: «яблоки, 1 кг» вместо «фото_1234.jpg». Label у поля — как табличка на банкомате: «вставьте карту», а не молчащая щель.</p></div>

<figure><svg viewBox="0 0 840 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Путь незрячего пользователя">
<rect width="840" height="280" fill="#f8fafc"/>
<text x="30" y="24" fill="#101828" font-size="13" font-weight="700" font-family="Arial">Что услышит незрячий при Tab по странице</text>
<rect x="30" y="34" width="380" height="180" rx="10" fill="#fff" stroke="#e4e8f0"/>
<text x="50" y="58" fill="#15a34a" font-size="11.5" font-weight="700" font-family="Arial">✓ ПРАВИЛЬНО</text>
<text x="50" y="82" fill="#101828" font-size="11" font-family="Arial">«Логотип Острие»</text>
<text x="50" y="102" fill="#101828" font-size="11" font-family="Arial">«Меню: Услуги, Цены, Контакты»</text>
<text x="50" y="122" fill="#101828" font-size="11" font-family="Arial">«Заголовок: Стрижка за 40 минут»</text>
<text x="50" y="142" fill="#101828" font-size="11" font-family="Arial">«Кнопка: Записаться»</text>
<text x="50" y="162" fill="#101828" font-size="11" font-family="Arial">«Поле: Как к вам обращаться?»</text>
<text x="50" y="192" fill="#6d7789" font-size="10" font-family="Arial">Каждый элемент озвучен понятно</text>
<rect x="430" y="34" width="380" height="180" rx="10" fill="#fff" stroke="#e4e8f0"/>
<text x="450" y="58" fill="#b42318" font-size="11.5" font-weight="700" font-family="Arial">✗ НЕПРАВИЛЬНО</text>
<text x="450" y="82" fill="#101828" font-size="11" font-family="Arial">«Изображение»</text>
<text x="450" y="102" fill="#101828" font-size="11" font-family="Arial">«Ссылка, ссылка, ссылка»</text>
<text x="450" y="122" fill="#101828" font-size="11" font-family="Arial">«Кнопка»</text>
<text x="450" y="142" fill="#101828" font-size="11" font-family="Arial">«Поле ввода»</text>
<text x="450" y="162" fill="#101828" font-size="11" font-family="Arial">«Изображение»</text>
<text x="450" y="192" fill="#6d7789" font-size="10" font-family="Arial">Ничего непонятно — сайт не используется</text>
<rect x="30" y="230" width="780" height="36" rx="8" fill="#101828"/>
<text x="50" y="252" fill="#a5b4fc" font-size="11" font-weight="700" font-family="Arial">Чек-лист: alt у картинок · label у полей · aria-label у кнопок-иконок · aria-expanded у бургера · :focus-visible</text>
</svg><figcaption><b>Рис. 25.1.</b> Разница между доступной и недоступной разметкой.</figcaption></figure>

<h3>Пример кода</h3>
<pre>&lt;!-- ✗ Плохо: скринридер прочитает «кнопка» --&gt;
&lt;button class="menu-btn"&gt;
  &lt;img src="img/menu.svg" alt=""&gt;
&lt;/button&gt;

&lt;!-- ✓ Хорошо --&gt;
&lt;button class="menu-btn" aria-label="Открыть меню" aria-expanded="false"&gt;
  &lt;img src="img/menu.svg" alt="" aria-hidden="true"&gt;
&lt;/button&gt;</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>alt="photo1.jpg"</strong> — бесполезно. <strong>Placeholder вместо label</strong> — ломает доступность. <strong>Кнопка-иконка без aria-label</strong> — скринридер молчит. <strong>Убрали подсветку фокуса</strong> — сломали навигацию с клавиатуры.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Аудит доступности своей страницы</div>
<div class="task-why">Зачем: найти конкретные дыры, а не «в целом нормально».</div>
<ol class="steps">
<li>Проверь: у всех картинок есть alt?</li>
<li>Проверь: у всех полей есть label, связанный через for/id?</li>
<li>Проверь: у иконок-кнопок есть текст или aria-label?</li>
<li>Исправь всё найденное.</li>
<li>Прогони Lighthouse → Accessibility, доведи до 100.</li>
</ol>
<div class="task-r">Результат: измеримый показатель, который можно показать клиенту.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>alt="photo1.jpg".</strong> Опиши содержание.</li>
<li><strong>Placeholder вместо label.</strong> Исчезает при вводе.</li>
<li><strong>Кнопка-иконка без aria-label.</strong> Скринридер молчит.</li>
<li><strong>Убрали outline.</strong> Сломали клавиатуру.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем alt="" отличается от отсутствия alt?</li>
<li>Зачем aria-expanded у бургера?</li>
<li>Почему нельзя убирать outline?</li>
<li>Назови три вещи, которые проверяет Lighthouse Accessibility.</li></ol></div>
`},

{t:"Meta-теги и SEO-разметка",g:"Чтобы сайт корректно выглядел в поиске и при отправке ссылки.",c:`
<h3>Зачем этот урок</h3>
<p><strong>Title</strong> — заголовок в результатах поиска и во вкладке, до 60 символов. <strong>Description</strong> — серый текст под заголовком, до 160 символов. На позицию description не влияет напрямую, но влияет на кликабельность.</p>
<p><strong>Open Graph</strong> — то, как ссылка выглядит, когда её кидают в Telegram или ВК. Без OG-тегов мессенджер подтянет случайную картинку или не покажет вовсе.</p>

<h3>Простым языком</h3>
<p>Title должен содержать главный ключ в начале + выгоду. «Барбершоп в Москве — от 1500 ₽», а не «Главная». Description — что получит посетитель + CTA.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Title</dt><dd>Заголовок страницы, до 60 символов.</dd>
<dt>Description</dt><dd>Описание страницы, до 160 символов.</dd>
<dt>Open Graph</dt><dd>Мета-теги для превью в соцсетях.</dd>
<dt>Canonical</dt><dd>Канонический адрес страницы.</dd>
<dt>Favicon</dt><dd>Иконка сайта во вкладке.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему ключ в начале title? В поиске обрезается примерно 60 символов, и если ключ в конце, его не увидят. Почему CAPS плохо? Выглядит как спам и снижает клики. Почему description важен? Он влияет на CTR — пользователь читает его и решает, заходить или нет.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Title — вывеска магазина на улице. «Хлеб свежий, с 7 утра» — понятно, зачем заходить. «Продукты» — непонятно, чем лучше соседа. Description — объявление под вывеской: «печём сами, доставка 30 минут». Open Graph — как товар выглядит на витрине Instagram, когда ты им делишься.</p></div>

<h3>Полный набор meta</h3>
<pre>&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
  &lt;title&gt;Барбершоп «Острие» в Москве — стрижка и борода от 1 500 ₽&lt;/title&gt;
  &lt;meta name="description" content="Мужские стрижки и оформление бороды в центре Москвы. Запись онлайн за 2 минуты."&gt;
  &lt;link rel="canonical" href="https://ostrie.ru/"&gt;
  &lt;meta property="og:type" content="website"&gt;
  &lt;meta property="og:title" content="Барбершоп «Острие» — стрижка за 40 минут"&gt;
  &lt;meta property="og:description" content="Запишись онлайн и приходи. Кофе включён."&gt;
  &lt;meta property="og:image" content="https://ostrie.ru/img/og-cover.jpg"&gt;
  &lt;link rel="icon" href="img/favicon.ico" sizes="any"&gt;
&lt;/head&gt;</pre>

<table><tr><th>Правило</th><th>Пример</th></tr>
<tr><td>Главный ключ в начале</td><td>Барбершоп в Москве</td></tr>
<tr><td>Плюс выгода</td><td>стрижка от 1 500 ₽</td></tr>
<tr><td>До 60 символов</td><td>иначе обрежется</td></tr>
<tr><td>Без CAPS</td><td>как спам</td></tr></table>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Одинаковые title на всех страницах</strong> — Google считает это дублями. <strong>CAPS и восклицательные знаки</strong> — выглядят как спам. <strong>Забыли og:image</strong> — ссылка в Telegram выглядит пустой. <strong>Title длиннее 60</strong> — обрежется, выгода потеряется.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Написать title и description для трёх проектов</div>
<div class="task-why">Зачем: первый элемент SEO, полностью в твоей власти.</div>
<ol class="steps">
<li>Возьми три выдуманных проекта.</li>
<li>Определи главный ключ и главную выгоду.</li>
<li>Напиши title: ключ + выгода, до 60 символов.</li>
<li>Напиши description: что получит посетитель + CTA, до 160.</li>
<li>Проверь длину счётчиком символов.</li>
<li>Добавь OG-теги и favicon на тестовую страницу.</li>
</ol>
<div class="task-r">Результат: три готовых мета-набора для реальных проектов.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Одинаковые title.</strong> Дубли.</li>
<li><strong>CAPS.</strong> Снижает клики.</li>
<li><strong>Забыли og:image.</strong> Пустая ссылка.</li>
<li><strong>Title длиннее 60.</strong> Обрежется.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Какая максимальная длина title?</li>
<li>Зачем OG-теги?</li>
<li>Что должно быть в начале title?</li>
<li>Почему нельзя CAPS?</li></ol></div>
`},

{t:"Таблицы, медиа и встраиваемый контент",g:"Встроить таблицу, видео и карту корректно.",c:`
<h3>Зачем этот урок</h3>
<p>Таблицы используй <strong>только для табличных данных</strong>: цены, сравнение, расписание. Для вёрстки макета таблицы — дурной тон, это делается Grid. Если видишь таблицу в разметке лендинга — это 2010 год.</p>
<p>Видео и карты встраиваются через iframe и video. Главная опасность: тяжёлый iframe в начале страницы тормозит отрисовку, и посетитель уходит, не дождавшись.</p>

<h3>Простым языком</h3>
<p>Три правила: iframe ниже первого экрана, <code>loading="lazy"</code>, фиксированная высота. Без последней макет «прыгает» при загрузке.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Таблица данных</dt><dd>Разметка для табличного содержимого.</dd>
<dt>Caption</dt><dd>Подпись таблицы для скринридеров.</dd>
<dt>Scope</dt><dd>Указание, что ячейка — заголовок столбца или строки.</dd>
<dt>Iframe</dt><dd>Встроенный фрейм для внешнего контента.</dd>
<dt>Lazy loading</dt><dd>Отложенная загрузка до появления в вьюпорте.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему таблицы только для данных? Табличная разметка жёсткая и плохо адаптируется, а Grid даёт гибкость. Почему loading="lazy"? Браузер загрузит iframe только когда пользователь доскроллит до него. Почему height обязателен? Без него браузер не знает размер и сдвигает контент после загрузки — это CLS.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Таблица для данных — прайс-лист на стене: строки и столбцы, всё читается. Таблица для вёрстки — как расставить мебель по клеткам шахматной доски: красиво на бумаге, но в реальной комнате ничего не встаёт. Тяжёлый iframe — как рекламный щит у входа в магазин: посетитель встаёт в пробку и уходит.</p></div>

<h3>Пример кода</h3>
<pre>&lt;table class="price-table"&gt;
  &lt;caption&gt;Прайс-лист барбершопа «Острие»&lt;/caption&gt;
  &lt;thead&gt;
    &lt;tr&gt;
      &lt;th scope="col"&gt;Услуга&lt;/th&gt;
      &lt;th scope="col"&gt;Время&lt;/th&gt;
      &lt;th scope="col"&gt;Цена&lt;/th&gt;
    &lt;/tr&gt;
  &lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr&gt;
      &lt;th scope="row"&gt;Стрижка&lt;/th&gt;
      &lt;td&gt;40 мин&lt;/td&gt;
      &lt;td&gt;1 500 ₽&lt;/td&gt;
    &lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;

&lt;video controls poster="img/cover.jpg" width="640" height="360"&gt;
  &lt;source src="video/promo.mp4" type="video/mp4"&gt;
  Ваш браузер не поддерживает видео.
&lt;/video&gt;

&lt;iframe src="https://yandex.ru/map-widget/v1/?um=..."
  width="100%" height="400" loading="lazy"
  title="Барбершоп «Острие» на карте"&gt;&lt;/iframe&gt;</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Таблица для вёрстки</strong> — ломает адаптив и доступность. <strong>iframe в начале страницы</strong> — тормозит отрисовку. <strong>Нет height у iframe</strong> — макет прыгает. <strong>iframe без title</strong> — скринридер не поймёт, что внутри.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Собрать страницу с тремя типами контента</div>
<div class="task-why">Зачем: отработать все три элемента сразу.</div>
<ol class="steps">
<li>Сделай таблицу цен на 4 строки с caption и scope.</li>
<li>Встрой видео с poster и двумя source.</li>
<li>Встрой карту с loading="lazy" и height 400.</li>
<li>Проверь в Lighthouse → Performance.</li>
<li>Убери loading="lazy" и сравни скорость.</li>
</ol>
<div class="task-r">Результат: понимание, сколько «весит» каждый тип контента.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Таблица для вёрстки.</strong> Нужен Grid.</li>
<li><strong>iframe в начале.</strong> Тормозит отрисовку.</li>
<li><strong>Нет height.</strong> Макет прыгает.</li>
<li><strong>iframe без title.</strong> Непонятно.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Когда таблица уместна?</li>
<li>Зачем loading="lazy"?</li>
<li>Что делает scope="col"?</li>
<li>Почему у iframe нужен height?</li></ol></div>
`},

{t:"Подключение CSS, каскад, специфичность",g:"Понимать, почему одни стили побеждают другие.",c:`
<h3>Зачем этот урок</h3>
<p>CSS (Cascading Style Sheets) — «каскадные таблицы стилей». Слово <strong>каскад</strong> ключевое: если к одному элементу применилось несколько правил, браузер выбирает по приоритету. Не понимаешь приоритет — будешь часами искать, почему твой цвет не применился.</p>

<h3>Простым языком</h3>
<p>Приоритет: <code>!important</code> (не используй никогда) → специфичность селектора → положение в файле.</p>
<p>Специфичность: `#id` (1,0,0) сильнее `.class` (0,1,0), `.class` сильнее `element` (0,0,1). При равной специфичности побеждает тот, что ниже в файле.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Каскад</dt><dd>Порядок применения CSS-правил.</dd>
<dt>Специфичность</dt><dd>Вес селектора, определяющий приоритет.</dd>
<dt>Селектор</dt><dd>Правило выбора элементов для стилизации.</dd>
<dt>!important</dt><dd>Принудительный приоритет, ломает каскад.</dd>
<dt>Слои файлов</dt><dd>base, layout, components, utilities.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему не стоит стилизовать по id? id настолько специфичен, что потом его не перебить без !important, а !important — начало конца. Почему файлы подключают в порядке base → layout → components → utilities? Чтобы общие правила шли первыми, а точечные могли их переопределить. Почему глубоко вложенные селекторы плохо? `.a .b .c .d` создаёт высокую специфичность и ломает переиспользуемость.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Каскад — как система приоритетов в офисе. Директор (!important) перебивает всех, но если все станут директорами — хаос. Поэтому есть уровни: конкретный сотрудник (id), отдел (class), все (тег). Приказ, подписанный позже, отменяет подписанный раньше — если уровень равный.</p></div>

<figure><svg viewBox="0 0 840 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Вес селекторов">
<rect width="840" height="300" fill="#f8fafc"/>
<text x="30" y="24" fill="#101828" font-size="13" font-weight="700" font-family="Arial">Специфичность: как считается вес</text>
<rect x="30" y="34" width="380" height="180" rx="10" fill="#fff" stroke="#e4e8f0"/>
<text x="50" y="60" fill="#101828" font-size="11.5" font-family="monospace">#id                (1,0,0)   ← самый сильный</text>
<text x="50" y="90" fill="#101828" font-size="11.5" font-family="monospace">.class .class      (0,2,0)</text>
<text x="50" y="120" fill="#101828" font-size="11.5" font-family="monospace">element.class       (0,1,1)</text>
<text x="50" y="150" fill="#101828" font-size="11.5" font-family="monospace">element             (0,0,1)</text>
<text x="50" y="180" fill="#101828" font-size="11.5" font-family="monospace">*                   (0,0,0)   ← самый слабый</text>
<text x="50" y="206" fill="#6d7789" font-size="10.5" font-family="Arial">Сравниваются слева направо: id важнее классов</text>
<rect x="430" y="34" width="380" height="180" rx="10" fill="#101828"/>
<text x="450" y="60" fill="#7dd3fc" font-size="11" font-family="monospace">p            { color: blue; }</text>
<text x="450" y="90" fill="#7dd3fc" font-size="11" font-family="monospace">.text        { color: red; }</text>
<text x="450" y="120" fill="#7dd3fc" font-size="11" font-family="monospace">#hero .text  { color: green; }</text>
<text x="450" y="152" fill="#cbd5e1" font-size="10.5" font-family="Arial">Красный побеждает синий (класс &gt; тег)</text>
<text x="450" y="172" fill="#cbd5e1" font-size="10.5" font-family="Arial">Зелёный побеждает оба (id + класс)</text>
<text x="450" y="200" fill="#a5b4fc" font-size="11" font-weight="700" font-family="Arial">Итог: текст будет ЗЕЛЁНЫМ</text>
<rect x="30" y="234" width="780" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="50" y="256" fill="#15803d" font-size="11" font-weight="700" font-family="Arial">Порядок подключения файлов</text>
<text x="50" y="276" fill="#166534" font-size="10.5" font-family="Arial">base.css (сброс, переменные) → layout.css → components.css → utilities.css</text>
</svg><figcaption><b>Рис. 28.1.</b> Вес селекторов и как он применяется на практике.</figcaption></figure>

<h3>Структура файлов</h3>
<pre>css/
├── base.css        ← сброс, переменные, типографика
├── layout.css      ← сетки, контейнер, секции
├── components.css  ← кнопки, карточки, формы
└── utilities.css   ← вспомогательные классы</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Стилизация по id</strong> — неперебиваемая специфичность. <strong>!important чтобы «починить»</strong> — чинит один случай, ломает десять. <strong>Глубоко вложенные селекторы</strong> — ломает переиспользуемость. <strong>Неправильный порядок файлов</strong> — общие правила перебивают точечные.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Эксперимент с конфликтующими правилами</div>
<div class="task-why">Зачем: понять каскад на опыте, а не заучить таблицу.</div>
<ol class="steps">
<li>Создай элемент с тегом, классом и id.</li>
<li>Напиши три правила разной специфичности.</li>
<li>Проверь в DevTools → Styles, какое применилось.</li>
<li>Поменяй порядок правил в файле — что изменилось?</li>
<li>Добавь !important к слабому — проверь эффект.</li>
<li>Убери !important и перепиши через класс.</li>
</ol>
<div class="task-r">Результат: понимание каскада на практике.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Стилизация по id.</strong> Неперебиваемая специфичность.</li>
<li><strong>!important чтобы починить.</strong> Ломает десять.</li>
<li><strong>Глубоко вложенные селекторы.</strong> Ломает переиспользуемость.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Что весит больше: .card .title или #card .title?</li>
<li>Почему не стоит стилизовать по id?</li>
<li>В каком порядке подключать файлы CSS?</li>
<li>Что будет при равной специфичности?</li></ol></div>
`},

{t:"Box Model и единицы измерения",g:"Точно управлять размерами и отступами.",c:`
<h3>Зачем этот урок</h3>
<p>Каждый элемент в браузере — <strong>коробка</strong>. Пока не поймёшь, из чего она состоит, будешь удивляться, почему «ширина 300 px» превращается в 348 px на экране.</p>
<p>Четыре слоя: <strong>content</strong> (собственно контент), <strong>padding</strong> (внутренний отступ), <strong>border</strong> (рамка), <strong>margin</strong> (внешний отступ).</p>

<h3>Простым языком</h3>
<p><code>box-sizing: border-box</code> — обязательная первая строка любого проекта. Без неё width = только контент, а padding и border ДОБАВЛЯЮТСЯ сверху. С ней width = всё вместе, и размеры предсказуемы.</p>
<p>Единицы: <code>px</code> (фиксирована), <code>%</code> (от родителя), <code>rem</code> (от html, 16 px — главная единица), <code>em</code> (от родителя), <code>vw/vh</code> (от экрана), <code>ch</code> (ширина символа 0).</p>
<p>Схлопывание margin: два блока с <code>margin: 32px</code> дают между собой 32 px, а не 64. Решение — padding или gap.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Box Model</dt><dd>Модель коробки: content, padding, border, margin.</dd>
<dt>box-sizing</dt><dd>Свойство, определяющее, как считается размер.</dd>
<dt>Border-box</dt><dd>Режим, где ширина включает padding и border.</dd>
<dt>Rem</dt><dd>Единица относительно корневого размера шрифта.</dd>
<dt>Схлопывание</dt><dd>Слияние вертикальных margin соседних блоков.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему border-box стандарт? Без него приходится вручную вычитать padding из ширины, и любая правка ломает вёрстку. Почему rem для шрифтов? rem масштабируется, если пользователь меняет размер шрифта в браузере, а px — нет. Почему gap лучше margin? gap не схлопывается и удаляется одним свойством.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Box Model — как коробка для переезда. Содержимое (content), обёртка внутри (padding), картон коробки (border), расстояние между коробками в машине (margin). Border-box — когда говоришь «коробка 50 см» и это весь размер с картоном, а не только место для вещей. Иначе вещи не влезут, хотя по расчёту влезали.</p></div>

<figure><svg viewBox="0 0 840 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Box Model">
<rect width="840" height="260" fill="#f8fafc"/>
<text x="30" y="24" fill="#101828" font-size="13" font-weight="700" font-family="Arial">Box Model — из чего состоит любой элемент</text>
<rect x="120" y="50" width="400" height="180" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="320" y="46" text-anchor="middle" fill="#c2410c" font-size="11" font-weight="700" font-family="Arial">margin (внешний отступ)</text>
<rect x="160" y="80" width="320" height="130" rx="6" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="320" y="76" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700" font-family="Arial">border (рамка)</text>
<rect x="190" y="105" width="260" height="90" rx="4" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="320" y="100" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700" font-family="Arial">padding (внутренний отступ)</text>
<rect x="215" y="120" width="210" height="60" rx="4" fill="#4f46e5"/>
<text x="320" y="155" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Arial">CONTENT</text>
<text x="320" y="175" text-anchor="middle" fill="#e0e7ff" font-size="10" font-family="Arial">собственно контент</text>
<rect x="560" y="60" width="250" height="170" rx="10" fill="#101828"/>
<text x="580" y="86" fill="#a5b4fc" font-size="11" font-weight="700" font-family="Arial">box-sizing: border-box</text>
<text x="580" y="112" fill="#cbd5e1" font-size="10.5" font-family="Arial">width: 300px = ВСЁ вместе</text>
<text x="580" y="130" fill="#cbd5e1" font-size="10.5" font-family="Arial">контент + padding + border</text>
<text x="580" y="158" fill="#7dd3fc" font-size="10.5" font-family="Arial">Без него: 300px = только контент,</text>
<text x="580" y="176" fill="#7dd3fc" font-size="10.5" font-family="Arial">а padding и border ДОБАВЛЯЮТСЯ</text>
<text x="580" y="204" fill="#a5b4fc" font-size="10.5" font-weight="700" font-family="Arial">Ставь первой строкой проекта!</text>
</svg><figcaption><b>Рис. 29.1.</b> Четыре слоя коробки. Справа — почему border-box обязателен.</figcaption></figure>

<h3>Обязательная строка</h3>
<pre>*,
*::before,
*::after {
  box-sizing: border-box;
}</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Забыли box-sizing</strong> — элементы «распухают», макет едет. <strong>Фиксированные px для шрифтов</strong> — ломает масштабирование. <strong>Margin для отступов внутри flex/grid</strong> — лучше gap. <strong>Игнорирование схлопывания</strong> — лишние или недостающие отступы.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Проверить box-sizing на опыте</div>
<div class="task-why">Зачем: увидеть разницу, иначе будешь ловить «распухание» каждый проект.</div>
<ol class="steps">
<li>Сделай блок 300×100 с padding 24 и border 1.</li>
<li>Без border-box измерь реальную ширину в DevTools (348).</li>
<li>Добавь border-box — измерь снова (300).</li>
<li>Сделай три блока разной ширины с разными padding.</li>
<li>Настрой html { font-size: 16px } и переведи размеры в rem.</li>
</ol>
<div class="task-r">Результат: понимание, почему border-box — стандарт.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Забыли box-sizing.</strong> Элементы распухают.</li>
<li><strong>Фиксированные px для шрифтов.</strong> Ломает масштабирование.</li>
<li><strong>Margin вместо gap.</strong> Схлопывается.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Назови четыре слоя Box Model.</li>
<li>Зачем box-sizing: border-box?</li>
<li>Чем rem отличается от em?</li>
<li>Почему два margin по 32px дают 32px?</li></ol></div>
`},

{t:"Цвета, фоны, градиенты",g:"Управлять фоном и создавать глубину без картинок.",c:`
<h3>Зачем этот урок</h3>
<p>Фон — не только <code>background-color</code>. Это слои: цвет, картинка, градиент, пелена. Умеешь их комбинировать — создаёшь «дорогие» фоны без единой фотографии.</p>
<p>Пелена поверх фонового фото обязательна, если сверху лежит текст — иначе он нечитаем.</p>

<h3>Простым языком</h3>
<p>Три слоя фона: цвет, картинка, градиент/пелена. <code>background-size: cover</code> заполняет область, сохраняя пропорции. Градиент оптимально из 2–3 цветов.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Пелена</dt><dd>Полупрозрачный слой поверх фонового изображения.</dd>
<dt>Градиент</dt><dd>Плавный переход между цветами.</dd>
<dt>Cover</dt><dd>Заполнение области с сохранением пропорций.</dd>
<dt>Contain</dt><dd>Вписывание изображения целиком.</dd>
<dt>Blend-mode</dt><dd>Режим смешивания фона с изображением.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему пелена? Фото имеет разную яркость по области, и белый текст на светлом участке исчезает. Почему cover, а не 100% 100%? 100% 100% искажает пропорции, cover обрезает лишнее, сохраняя форму. Почему градиент из 2–3 цветов? Пять и больше выглядят дешево и создают шум.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Пелена — как солнцезащитная плёнка на лобовом стекле: сквозь неё видно дорогу, но солнце не слепит. Градиент — закат: плавный переход от оранжевого к синему, а не резкая граница. Cover — как обои на стену: обои подгоняются под стену, обрезая лишнее, но рисунок не растягивается.</p></div>

<h3>Пример кода</h3>
<pre>.hero {
  background-color: #101828;
  background-image: url('../img/hero.jpg');
  background-size: cover;
  background-position: center;
  background-blend-mode: multiply;
}

/* Сокращённая запись */
.hero {
  background: #101828 url('../img/hero.jpg') center / cover no-repeat;
}

.btn { background: linear-gradient(135deg, #4F46E5, #7C3AED); }

.glow {
  background: radial-gradient(circle at 50% 0%, rgba(79,70,229,.25), transparent 60%);
}</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Белый текст на фото без пелены</strong> — нечитаемо. <strong>background-size: 100% 100%</strong> — искажает пропорции. <strong>Градиент из пяти цветов</strong> — выглядит дешево. <strong>Забыли position</strong> — важная часть фото обрезается.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Собрать герой с тремя слоями</div>
<div class="task-why">Зачем: получить приём, используемый в каждом втором лендинге.</div>
<ol class="steps">
<li>Сделай секцию с фоновым фото + тёмной пеленой.</li>
<li>Проверь: читается ли белый текст на фоне?</li>
<li>Добавь радиальное свечение в углу.</li>
<li>Сделай кнопку с линейным градиентом.</li>
<li>Проверь контраст текста (Урок 16).</li>
</ol>
<div class="task-r">Результат: рабочий приём фона с гарантированной читаемостью.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Белый текст без пелены.</strong> Нечитаемо.</li>
<li><strong>background-size: 100% 100%.</strong> Искажает.</li>
<li><strong>Градиент из пяти цветов.</strong> Дешево.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Зачем пелена поверх фото?</li>
<li>Чем cover отличается от contain?</li>
<li>Какие три слоя может иметь фон?</li>
<li>Что делает background-blend-mode?</li></ol></div>
`},

{t:"Типографика в CSS",g:"Реализовать шкалу из Урока 13 в коде.",c:`
<h3>Зачем этот урок</h3>
<p>CSS даёт полный контроль над текстом. Главное — не разбрасывать значения, а задать <strong>систему</strong> через переменные. Тогда изменение кегля в одном месте меняет весь сайт.</p>

<h3>Простым языком</h3>
<p>Создай переменные для шести уровней, примени к заголовкам и абзацам. Ограничь ширину абзаца через <code>max-width: 65ch</code>.</p>
<p>Интерлиньяж: заголовку 1.1–1.2, основному тексту 1.5–1.7. При <code>line-height: 1</code> строки слипаются.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>CSS-переменная</dt><dd>Пользовательское свойство, объявленное в :root.</dd>
<dt>Font-size</dt><dd>Размер шрифта.</dd>
<dt>Line-height</dt><dd>Межстрочный интервал.</dd>
<dt>Letter-spacing</dt><dd>Межбуквенное расстояние.</dd>
<dt>Text-transform</dt><dd>Преобразование регистра: uppercase, capitalize.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему размеры в переменных? Меняешь одно значение, а не пятнадцать. Почему max-width: 65ch? Строка на 120 символов нечитаема: глаз теряет место. Почему заголовку плотность? Он короткий и воспринимается как блок, а абзац нужно прокручивать построчно.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>CSS-переменные — как шаблоны в Word. Задал «Заголовок 1» один раз — все главы документа одного размера. Захотел другой — поменял шаблон, документ перестроился. Без шаблонов каждый заголовок вручную, и документ выглядит неряшливо.</p></div>

<h3>Пример кода</h3>
<pre>:root {
  --fs-h1: 48px;  --fs-h2: 36px;  --fs-h3: 24px;
  --fs-body-lg: 20px;  --fs-body: 16px;  --fs-caption: 14px;
  --font-head: 'Manrope', sans-serif;
  --font-body: 'Inter', sans-serif;
}

body {
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: 1.6;
  color: var(--color-dark);
}

h1, h2, h3 {
  font-family: var(--font-head);
  line-height: 1.2;
  margin: 0 0 var(--space-4);
}

h1 { font-size: var(--fs-h1); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: var(--fs-h2); font-weight: 600; }
h3 { font-size: var(--fs-h3); font-weight: 600; }

p  { max-width: 65ch; margin: 0 0 var(--space-4); }
.text-muted { color: var(--color-muted); font-size: var(--fs-caption); }
.text-uppercase { text-transform: uppercase; letter-spacing: .05em; }</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Размеры «по месту»</strong> — через месяц 15 значений. <strong>line-height: 1 на абзацах</strong> — строки слипаются. <strong>Нет ограничения ширины</strong> — строка нечитаема. <strong>Фиксированный цвет</strong> — не сменить тему.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Реализовать шкалу в CSS</div>
<div class="task-why">Зачем: превратить дизайн-решение в рабочий код.</div>
<ol class="steps">
<li>Создай CSS-переменные для шести уровней.</li>
<li>Примени к заголовкам и абзацам.</li>
<li>Сверстай страницу-шпаргалку со всеми уровнями.</li>
<li>Проверь max-width: 65ch на абзацах.</li>
<li>Сравни с макетом: совпадают размеры?</li>
</ol>
<div class="task-r">Результат: типографическая система в коде.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Размеры «по месту».</strong> 15 значений.</li>
<li><strong>line-height: 1.</strong> Строки слипаются.</li>
<li><strong>Нет ограничения ширины.</strong> Нечитаемо.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Какой line-height у заголовка и у текста?</li>
<li>Зачем max-width: 65ch?</li>
<li>Где хранят размеры шрифтов?</li>
<li>Что делает text-transform: uppercase?</li></ol></div>
`},

{t:"Flexbox: основа",g:"Уверенно выстраивать элементы в ряд.",c:`
<h3>Зачем этот урок</h3>
<p>Flexbox работает с <strong>одной осью</strong>: горизонтальной или вертикальной. Включается на <strong>контейнере</strong>, настраиваются <strong>дети</strong>. Это основной инструмент раскладки в вебе — шапки, меню, строки карточек, центрирование.</p>

<h3>Простым языком</h3>
<p>Две оси: <strong>главная</strong> (по направлению flex-direction) и <strong>поперечная</strong>. <code>justify-content</code> двигает по главной, <code>align-items</code> — по поперечной.</p>
<p>Значения justify-content: flex-start, flex-end, center, space-between, space-around.</p>
<p>Как сделать три равные колонки: <code>flex: 1</code> у каждой. Почему gap лучше margin? gap удаляется одним свойством и не схлопывается.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Flex-контейнер</dt><dd>Элемент с display: flex.</dd>
<dt>Flex-элемент</dt><dd>Дочерний элемент контейнера.</dd>
<dt>Главная ось</dt><dd>Направление flex-direction.</dd>
<dt>Поперечная ось</dt><dd>Перпендикулярное направление.</dd>
<dt>Flex: 1</dt><dd>Растянуть элемент на доступное пространство.</dd>
<dt>Gap</dt><dd>Отступ между flex-элементами.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему на контейнере, а не на детях? Потому что flex определяет, как дети располагаются внутри родителя. Почему две оси? Потому что элементы нужно выравнивать и по направлению, и поперёк. Почему gap? margin схлопывается и его надо сбрасывать у крайних элементов, а gap нет.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Flexbox — как расстановка стульев в ряду. justify-content — как вы выравниваете ряд: слева, по центру, с равными промежутками, прижав к краям. align-items — на какой высоте стулья: все на полу, все на возвышении. gap — расстояние между стульями, одинаковое для всех, и когда уберёшь ряд — расстояние исчезнет вместе с ним.</p></div>

<h3>Пример кода</h3>
<pre>.container {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

/* Шапка: лого слева, меню в центре, кнопка справа */
.site-header { display: flex; align-items: center; justify-content: space-between; }

/* Три равные колонки */
.col { flex: 1; }

/* Отодвинуть элемент вправо */
.push-right { margin-left: auto; }</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Забыли flex: 1 у детей</strong> — карточки не растягиваются. <strong>justify-content вместо align-items</strong> — выравнивание не туда. <strong>Margin вместо gap</strong> — схлопывается. <strong>flex-direction не указан</strong> — по умолчанию row, и вертикальное меню не работает.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Пройти Flexbox Froggy</div>
<div class="task-why">Зачем: Flexbox плохо понимается из текста — это про визуальные переходы.</div>
<ol class="steps">
<li>Открой flexboxfroggy.com.</li>
<li>Пройди первые 12 уровней.</li>
<li>На каждом читай подсказку.</li>
<li>Вернись к уровню 1 и пройди заново.</li>
</ol>
<div class="task-r">Результат: понимание Flexbox на опыте.</div></div>

<div class="task"><div class="task-h">Задание 2. Сверстать шапку и строку карточек</div>
<div class="task-why">Зачем: два самых частых паттерна в вебе.</div>
<ol class="steps">
<li>Шапка: лого слева, меню в центре, кнопка справа.</li>
<li>Меню — flex с gap: 32px, list-style: none.</li>
<li>Строка из 4 карточек: flex + gap + flex: 1 у каждой.</li>
<li>Проверь на 320 px: ничего не вылезает?</li>
</ol>
<div class="task-r">Результат: два рабочих блока для каждого проекта.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Забыли flex: 1.</strong> Карточки не растягиваются.</li>
<li><strong>Перепутал оси.</strong> Выравнивание не туда.</li>
<li><strong>Margin вместо gap.</strong> Схлопывается.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>На чём включается display: flex?</li>
<li>Чем justify-content отличается от align-items?</li>
<li>Как сделать три равные колонки?</li>
<li>Зачем gap вместо margin?</li></ol></div>
`},

{t:"Flexbox: сложные случаи",g:"Решать задачи, на которых спотыкаются новички.",c:`
<h3>Зачем этот урок</h3>
<p>Четыре ситуации, которые новичок гуглит по десять раз: отодвинуть элемент вправо, идеальное центрирование, карточки равной высоты с кнопками по низу, вертикальное меню.</p>

<h3>Простым языком</h3>
<p><strong>Отодвинуть вправо:</strong> <code>margin-left: auto</code> — съест свободное место слева.</p>
<p><strong>Идеальное центрирование:</strong> <code>display: flex</code> + <code>justify-content: center</code> + <code>align-items: center</code> + <code>min-height: 100vh</code>.</p>
<p><strong>Кнопка по низу карточки:</strong> <code>margin-top: auto</code> у кнопки при <code>flex-direction: column</code>. Самый полезный трюк.</p>
<p><strong>Вертикальное меню:</strong> <code>flex-direction: column</code> + <code>gap</code>.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Auto margins</dt><dd>margin: auto — распределение свободного пространства.</dd>
<dt>Min-height</dt><dd>Минимальная высота, не обрезает контент.</dd>
<dt>Push-паттерн</dt><dd>margin-top: auto для прижатия к низу.</dd>
<dt>Perfect centering</dt><dd>Центрирование по двум осям через flex.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему margin: auto? Оно поглощает свободное пространство в своём направлении, толкая элемент в противоположную сторону. Почему min-height, а не height? height обрежет контент, если он не влезет, а min-height нет. Почему margin-top: auto работает только при column? Потому что auto поглощает пространство вдоль главной оси, а при row это горизонталь.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>margin-left: auto — как человек в очереди, который отодвигается к стене, оставляя место между собой и остальными. margin-top: auto — как книга на полке, которая падает вниз, оставляя пустое место над собой. min-height: 100vh — как шкаф до потолка: если вещей больше, шкаф не давит их, а просто растянется.</p></div>

<h3>Пример кода</h3>
<pre>/* Отодвинуть элемент вправо */
.push-right { margin-left: auto; }

/* Идеальное центрирование */
.center-screen {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* Карточки равной высоты, кнопки по низу */
.cards { display: flex; gap: 24px; }
.card { flex: 1; display: flex; flex-direction: column; }
.card .btn { margin-top: auto; }

/* Вертикальное меню */
.mobile-menu { display: flex; flex-direction: column; gap: 12px; }</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>margin: auto везде</strong> — работает, но неочевидно, лучше justify-content. <strong>Забыл flex-direction: column</strong> — margin-top: auto не сработает. <strong>height вместо min-height</strong> — контент обрежется. <strong>position: absolute для центрирования</strong> — ломает адаптив.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Собрать четыре задачи в одном проекте</div>
<div class="task-why">Зачем: отработать все четыре приёма на реальных блоках.</div>
<ol class="steps">
<li>Сделай шапку, где кнопка прижата вправо через margin-left: auto.</li>
<li>Сделай 3 карточки с текстом разной длины и кнопками по низу.</li>
<li>Сделай мобильное меню столбиком.</li>
<li>Сделай блок, отцентрованный по двум осям на весь экран.</li>
<li>Проверь всё на 320 px.</li>
</ol>
<div class="task-r">Результат: четыре рабочих паттерна в арсенале.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>margin: auto везде.</strong> Неочевидно.</li>
<li><strong>Забыл column.</strong> auto не сработает.</li>
<li><strong>height вместо min-height.</strong> Обрежет.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Как прижать элемент вправо?</li>
<li>Зачем margin-top: auto и при каком условии?</li>
<li>Как отцентровать блок по двум осям?</li>
<li>Чем min-height отличается от height?</li></ol></div>
`},

{t:"CSS Grid: основа",g:"Строить двумерные сетки.",c:`
<h3>Зачем этот урок</h3>
<p>Flexbox — одна ось. <strong>Grid — две сразу</strong>: строки и колонки одновременно. Идеален для макетов страниц, галерей, каталогов. Там, где Flexbox требует вложенных контейнеров, Grid решает задачу одним блоком.</p>

<h3>Простым языком</h3>
<p><code>grid-template-columns: repeat(3, 1fr)</code> — три равные доли свободного пространства. <code>gap</code> — расстояние между строками и колонками.</p>
<p>Разные пропорции: <code>2fr 1fr</code> — контент + сайдбар. Адаптив без медиазапросов: <code>repeat(auto-fit, minmax(280px, 1fr))</code>.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Grid-контейнер</dt><dd>Элемент с display: grid.</dd>
<dt>Fr</dt><dd>Доля свободного пространства.</dd>
<dt>Grid-column</dt><dd>Размещение по колонкам.</dd>
<dt>Grid-row</dt><dd>Размещение по строкам.</dd>
<dt>Auto-fit</dt><dd>Создание колонок по содержимому.</dd>
<dt>Minmax</dt><dd>Минимальный и максимальный размер.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему Grid для макета страницы? Он управляет двумя измерениями сразу, и не нужны вложенные flex-контейнеры для строк и колонок. Почему 1fr, а не проценты? fr распределяет оставшееся пространство после учёта gap, а проценты могут дать переполнение. Почему auto-fit для каталога? Он сам создаёт нужное число колонок под ширину экрана.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Grid — как шахматная доска: сразу видно, сколько клеток по горизонтали и вертикали. Flexbox — как очередь людей: выстраиваешь в ряд, но чтобы сделать шахматную доску, нужны отдельные очереди. fr — как деление пирога на равные доли: кому сколько достанется, зависит от того, сколько просителей.</p></div>

<h3>Пример кода</h3>
<pre>.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

/* Разные пропорции: контент + сайдбар */
.layout { grid-template-columns: 2fr 1fr; }

/* Адаптив без медиазапросов */
.catalog { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

/* Элемент на две колонки */
.wide { grid-column: span 2; }

/* Макет через areas */
.page {
  display: grid;
  min-height: 100vh;
  grid-template-columns: 240px 1fr;
  grid-template-areas:
    "header header"
    "sidebar main"
    "footer footer";
}</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Grid для простой строки</strong> — избыточно. <strong>Забыл gap</strong> — элементы слипаются. <strong>Фиксированные px вместо fr</strong> — сетка не адаптируется. <strong>Слишком маленький minmax</strong> — на 320 px контент не влезет.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Пройти Grid Garden</div>
<div class="task-why">Зачем: Grid — визуальная тема, текст объясняет плохо.</div>
<ol class="steps">
<li>Открой cssgridgarden.com.</li>
<li>Пройди первые 10 уровней.</li>
<li>Обрати внимание на grid-column и grid-row.</li>
<li>Вернись к сложным уровням повторно.</li>
</ol>
<div class="task-r">Результат: практическое понимание Grid.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Grid для простой строки.</strong> Избыточно.</li>
<li><strong>Забыл gap.</strong> Слипаются.</li>
<li><strong>px вместо fr.</strong> Не адаптируется.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем Grid отличается от Flexbox?</li>
<li>Что значит 1fr?</li>
<li>Как сделать элемент на две колонки?</li>
<li>Когда Grid избыточен?</li></ol></div>
`},

{t:"Grid: сложные сетки",g:"Строить сетки, которые адаптируются сами.",c:`
<h3>Зачем этот урок</h3>
<p><code>grid-template-areas</code> — самый читаемый способ задать макет. Ты рисуешь сетку словами, и сразу видно, что где лежит. Через полгода вернёшься к коду и поймёшь его с первого взгляда.</p>
<p><code>auto-fit</code> создаёт адаптивный каталог без единого медиазапроса.</p>

<h3>Простым языком</h3>
<p>Areas — макет словами: <code>"header header" "sidebar main" "footer footer"</code>. Каждому слову соответствует <code>grid-area</code> у элемента.</p>
<p>auto-fit vs auto-fill: auto-fill создаёт колонки, даже пустые; auto-fit сворачивает пустые. В 95% случаев нужен auto-fit.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Template-areas</dt><dd>Задание макета именами областей.</dd>
<dt>Grid-area</dt><dd>Привязка элемента к именованной области.</dd>
<dt>Auto-fill</dt><dd>Создание колонок, включая пустые.</dd>
<dt>Auto-fit</dt><dd>Создание колонок со свёрткой пустых.</dd>
<dt>Span</dt><dd>Занятие нескольких дорожек.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему areas лучше цифр? Слова читаются как план, а цифры надо каждый раз пересчитывать. Почему auto-fit? Он удаляет пустые колонки, не оставляя лишних отступов. Почему не слишком маленький minmax? На узких экранах контент не влезет и появится горизонтальная прокрутка.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Template-areas — как план квартиры с подписями: «кухня», «гостиная», «спальня». Видно расположение без измерений. Auto-fit — как раскладка книг на полке по ширине: положил сколько влезло, осталось место — следующий ряд сам образуется.</p></div>

<h3>Пример кода</h3>
<pre>.page {
  display: grid;
  min-height: 100vh;
  grid-template-columns: 240px 1fr;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "header header"
    "sidebar main"
    "footer footer";
}
.site-header { grid-area: header; }
.sidebar     { grid-area: sidebar; }
.main        { grid-area: main; }
.site-footer { grid-area: footer; }

/* Каталог без медиазапросов */
.catalog {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
}

/* Первый элемент на две колонки */
.catalog > *:first-child { grid-column: span 2; }</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>auto-fill вместо auto-fit</strong> — появляются пустые колонки и лишние отступы. <strong>Слишком маленький minmax</strong> — на 320 px контент не влезет. <strong>areas без кавычек</strong> — синтаксическая ошибка. <strong>Нет grid-area у элемента</strong> — он не попадёт в область.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Сделать макет через areas</div>
<div class="task-why">Зачем: получить читаемый код, который поймёшь через полгода.</div>
<ol class="steps">
<li>Сверстай макет: шапка, сайдбар + контент, подвал.</li>
<li>Используй grid-template-areas.</li>
<li>Проверь на 768 px — сайдбар должен переехать.</li>
<li>Сравни читаемость с вариантом на flexbox.</li>
</ol>
<div class="task-r">Результат: макет, код которого читается как схема.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>auto-fill вместо auto-fit.</strong> Пустые колонки.</li>
<li><strong>Маленький minmax.</strong> Не влезет на 320.</li>
<li><strong>areas без кавычек.</strong> Ошибка.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Как задать макет через areas?</li>
<li>Чем auto-fit отличается от auto-fill?</li>
<li>Как сделать каталог без медиазапросов?</li>
<li>Как сделать первый элемент на две колонки?</li></ol></div>
`},

{t:"Позиционирование",g:"Управлять расположением элементов поверх остальных.",c:`
<h3>Зачем этот урок</h3>
<p>Пять режимов позиционирования. Без них невозможны липкая шапка, бейдж на карточке, выпадающее меню, модальное окно и кнопка «наверх».</p>

<h3>Простым языком</h3>
<p><strong>static</strong> — обычный поток. <strong>relative</strong> — сдвинут, но место осталось. <strong>absolute</strong> — выпал из потока, от ближайшего relative-родителя. <strong>fixed</strong> — прибит к окну. <strong>sticky</strong> — скроллится, потом прилипает.</p>
<p>z-index работает только с position, не равным static, и сравнивается в пределах одного контекста наложения.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Позиционирование</dt><dd>Способ размещения элемента на странице.</dd>
<dt>Точка отсчёта</dt><dd>Элемент, относительно которого positioned-потомок.</dd>
<dt>Контекст наложения</dt><dd>Область, в которой сравниваются z-index.</dd>
<dt>Sticky</dt><dd>Гибрид relative и fixed.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему relative родителю absolute? Без точки отсчёта абсолютный элемент позиционируется от всей страницы и уезжает. Почему z-index не всегда работает? Он действует только у positioned-элементов и в своём контексте наложения. Почему шкала 10–300, а не 9999? Иначе начинается война z-index, и код ломается.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>relative родитель — как комната, в которой ты расставляешь мебель. Без неё мебель ставят относительно улицы, и диван оказывается у соседей. z-index — как слои в фотошопе: верхний перекрывает нижний, но только в пределах одного документа. Sticky — как стикер на мониторе: едет вместе с ним, пока не упрётся в край.</p></div>

<h3>Пример кода</h3>
<pre>/* Липкая шапка */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff;
}

/* Бейдж на карточке */
.card   { position: relative; }
.badge  {
  position: absolute;
  top: 12px; left: 12px;
  background: #E04F4F; color: #fff;
  padding: 4px 8px; border-radius: 4px;
}

/* Модалка поверх всего */
.overlay { z-index: 200; }
.modal   { z-index: 300; }</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>absolute без relative у родителя</strong> — элемент уезжает в угол страницы. <strong>z-index: 9999 «чтобы точно было сверху»</strong> — начинается война z-index. <strong>fixed без проверки на мобиле</strong> — может перекрывать контент. <strong>Нет z-index у sticky-шапки</strong> — контент проезжает поверх.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Собрать четыре паттерна</div>
<div class="task-why">Зачем: элементы, без которых не обходится почти ни один сайт.</div>
<ol class="steps">
<li>Липкая шапка: position: sticky, top: 0, фон + тень.</li>
<li>Бейдж -20% в углу карточки (relative родителю).</li>
<li>Выпадающее меню, раскрывающееся поверх контента.</li>
<li>Кнопка «Наверх» с position: fixed.</li>
<li>Проверь z-index: модалка выше всего.</li>
</ol>
<div class="task-r">Результат: четыре рабочих блока позиционирования.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>absolute без relative.</strong> Уезжает в угол.</li>
<li><strong>z-index: 9999.</strong> Война z-index.</li>
<li><strong>fixed без проверки.</strong> Перекрывает.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Зачем relative родителю absolute?</li>
<li>Чем fixed отличается от sticky?</li>
<li>При каком условии z-index работает?</li>
<li>Почему не стоит z-index: 9999?</li></ol></div>
`},

{t:"Псевдоклассы и псевдоэлементы",g:"Добавлять интерактив и детали без лишней разметки.",c:`
<h3>Зачем этот урок</h3>
<p><strong>Псевдокласс</strong> — состояние элемента: hover, focus, first-child. <strong>Псевдоэлемент</strong> — виртуальный элемент внутри: before, after. Не существует в HTML, но стилизуется как настоящий.</p>

<h3>Простым языком</h3>
<p>Полезные: <code>:hover</code> (наведение), <code>:focus-visible</code> (фокус с клавиатуры — обязательно для доступности), <code>:nth-child(even)</code> (зебра), <code>:last-child</code> (последний без отступа), <code>:not()</code> (исключение), <code>::before</code>/<code>::after</code> (иконки, декоративные элементы).</p>
<p>Эффект «растущего» подчёркивания: <code>transform: scaleX(0) → scaleX(1)</code>.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Псевдокласс</dt><dd>Состояние элемента: hover, focus, active.</dd>
<dt>Псевдоэлемент</dt><dd>Виртуальный элемент: before, after.</dd>
<dt>Content</dt><dd>Свойство, обязательное для before/after.</dd>
<dt>Transform-origin</dt><dd>Точка отсчёта трансформации.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему :focus-visible, а не :focus? focus срабатывает и при клике мышью, создавая лишнюю подсветку, а focus-visible — только при навигации с клавиатурой. Почему анимируют transform, а не width? transform не вызывает пересчёт layout и работает на 60 fps. Почему content обязателен? Без него псевдоэлемент не отрисуется.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Псевдокласс — как лампочка, которая меняет цвет при наведении руки. Псевдоэлемент — как наклейка на стекле: она часть окна, но отдельный слой, и её можно стереть, не трогая стекло. Transform — как раздвижная дверь: двигается сама дверь, а не стена вокруг неё.</p></div>

<h3>Пример кода</h3>
<pre>/* Наведение */
.btn:hover { background: #4338CA; }

/* Фокус с клавиатуры */
