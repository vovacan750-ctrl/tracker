<h3>Зачем этот урок</h3>
<p>Каждый день ты открываешь десятки сайтов и ничего не знаешь о том, что при этом происходит. А между тем всё, что ты будешь делать дальше — вёрстка, настройка хостинга, подключение оплаты, ускорение, отладка — опирается на один процесс. Когда сайт не открывается, медленно грузится или не приходит письмо — в девяти случаях из десяти причина на одном из шагов, которые мы разберём. Поймёшь их один раз — будешь диагностировать за минуту.</p>
<p>Сразу уберём заблуждение. Сайт — не программа, которую скачивают, и не картинка, которая где-то хранится. Веб-сайт — <strong>набор ресурсов и программ</strong>: HTML, CSS, JavaScript, изображения, шрифты, видео, PDF и другие файлы. Часть ответа может генерироваться сервером, а часть — загружаться позже из API или CDN; браузер получает доступные ресурсы, обрабатывает их и рисует страницу.</p>

<h3>Простым языком</h3>
<p><strong>Браузер — клиент.</strong> Он обычно выполняет навигацию и HTTP-запросы, но может взять ресурс из HTTP-кэша, service worker, прокси или другого локального хранилища. При нажатии Enter он формирует <strong>запрос</strong> (часто HTTP(S)): «дай мне главную страницу google.com».</p>
<p><strong>DNS — распределённая система имён.</strong> Она возвращает записи разных типов: A для IPv4, AAAA для IPv6, CNAME для псевдонимов и другие данные. Имя может разрешаться в несколько адресов, CDN или балансировщик. Ответы кэшируются по TTL, а задержка зависит от локального кэша, резолвера, DoH/DoT и сети — измеряй её, а не считай универсальным диапазоном.</p>
<p><strong>Сервер — часть инфраструктуры, которая отвечает на запросы.</strong> Это может быть облако, CDN, reverse proxy, serverless-функция или виртуальный сервер; HTML иногда генерируется на лету. Браузер загружает ресурсы в порядке, заданном HTML, подсказками загрузки и зависимостями, а не по фиксированному правилу. В ответе сервер указывает <strong>код статуса</strong>: 200 — успех, 404 — ресурс не найден, 500 — внутренняя ошибка сервера или приложения.</p>
<p><strong>Отрисовка.</strong> Браузер строит из HTML дерево страницы, накладывает CSS (красит, расставляет), запускает JS (реакции на клики). Результат — готовая страница, и это происходит заново при каждом обновлении.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>HTTP</dt><dd>HyperText Transfer Protocol — протокол, по которому браузер и сервер обмениваются сообщениями.</dd>
<dt>Запрос / ответ</dt><dd>Сообщение от браузера к серверу и обратно.</dd>
<dt>IP-адрес</dt><dd>Адрес интерфейса или узла в конкретной сети; он может быть общим, динамическим, NAT-адресом или одним из нескольких, например 142.250.185.78.</dd>
<dt>Домен</dt><dd>Человекочитаемое имя, заменяющее IP-адрес.</dd>
<dt>Код статуса</dt><dd>Трёхзначное число: 2xx успех, 3xx перенаправление, 4xx ошибка клиента, 5xx ошибка сервера.</dd>
<dt>Отрисовка (rendering)</dt><dd>Превращение кода в пиксели на экране.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему нельзя полагаться на один IP? Адреса могут меняться, быть общими для виртуального хостинга, CDN или балансировщика, а домен остаётся стабильной точкой входа. При навигации браузер проверяет, можно ли использовать кэш; свежесть задаётся HTTP Cache-Control и иногда проверяется условным запросом. Отдельные данные могут обновляться через fetch/XHR без полной пересборки страницы. Почему три технологии? У каждой одна задача: HTML — <em>что</em> есть, CSS — <em>как выглядит</em>, JS — <em>как ведёт себя</em>. Разделение позволяет менять внешний вид, не трогая структуру.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Заказ еды в ресторане — лишь приблизительная аналогия: DNS помогает найти адрес кухни, но не переносит HTTP-ответ. Ты (браузер) выбираешь блюдо, запрос идёт по сети к серверу, а ответ возвращается браузеру. Но на столе ещё нет сервировки — салфетка (CSS) и музыка (JS). Только когда всё сошлось, ты можешь есть. «Столик не найден» = 404. «Кухня сгорит» = 500.</p></div>

<h3>Как посмотреть это вживую</h3>
<p>Открой любой сайт, нажми <code>F12</code> и перейди на вкладку Network (Сеть). Обнови страницу <code>Ctrl+R</code>. Увидишь список файлов: первым идёт HTML, за ним стили, скрипты, шрифты, картинки. У каждого есть статус, размер и время загрузки. Хочешь убедиться, что сайт — просто текст? Нажми правой кнопкой → «Просмотр кода» — откроется обычный HTML.</p>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Сервер выключен</strong> — «Не удаётся получить доступ к сайту». <strong>DNS-запись неверная</strong> — браузер пойдёт не туда. <strong>HTML сломан</strong> — страница отрисуется криво. <strong>CSS не подключился</strong> — увидишь голый текст. <strong>JS с ошибкой</strong> — кнопки не нажимаются.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Проследить путь запроса в DevTools</div>
<div class="task-why">Зачем: ты впервые увидишь изнутри то, что происходит при каждом открытии сайта.</div>
<ol class="steps">
<li>Открой любой новостной сайт в Chrome.</li>
<li>Нажми <code>F12</code>, выбери вкладку Network.</li>
<li>Нажми <code>Ctrl+R</code> — список файлов начнёт заполняться.</li>
<li>Найди самую верхнюю строку — это HTML-документ, статус должен быть 200.</li>
<li>Отсортируй столбец Size по убыванию — найди самый тяжёлый файл.</li>
<li>Открой Waterfall/Timing и сравни DNS, соединение, TLS, ожидание ответа и передачу. Для грубой оценки серверной задержки смотри TTFB, понимая, что он зависит также от сети, прокси и кэша; времена запросов могут перекрываться.</li>
</ol>
<div class="task-r">Результат: знаешь, сколько файлов грузится и не было ли ошибок.</div></div>

<div class="task"><div class="task-h">Задание 2. Убедиться, что сайт — это просто текст</div>
<div class="task-why">Зачем: разрушить иллюзию, что сайты делаются магией.</div>
<ol class="steps">
<li>Нажми правой кнопкой на странице → «Просмотр кода».</li>
<li>Найди тег <code>&lt;h1&gt;</code> — главный заголовок.</li>
<li>Найди тег <code>&lt;p&gt;</code> — абзац текста.</li>
<li>Найди тег <code>&lt;img&gt;</code> — обрати внимание на атрибут <code>src</code> с путём к файлу.</li>
<li>Нажми <code>Ctrl+F</code>, введи <code>css</code> — найдёшь подключение стилей.</li>
</ol>
<div class="task-r">Результат: увидел структуру сайта — это тот же код, который будешь писать с Урока 21.</div></div>

<div class="task"><div class="task-h">Задание 3. Найти IP-адрес трёх сайтов</div>
<div class="task-why">Зачем: доказать, что домен — только имя, а за ним стоит конкретный компьютер.</div>
<ol class="steps">
<li>Открой командную строку (Windows: Win+R, cmd; Mac: Терминал).</li>
<li>Введи <code>nslookup google.com</code>.</li>
<li>Запиши полученный IP-адрес.</li>
<li>Повтори для ya.ru и youtube.com.</li>
<li>Не вводи IP вслепую: HTTPS-сертификат, SNI и HTTP Host нужны для выбора домена, а один IP может обслуживать много сайтов. Сравни DNS-ответы командой nslookup/dig или используй curl --resolve только на своём/разрешённом домене.</li>
</ol>
<div class="task-r">Результат: увидел, что домен может разрешаться в один или несколько адресов; домен и IP не являются взаимозаменяемыми идентификаторами виртуального хостинга.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Думать, что сайт хранится в интернете.</strong> Он лежит на конкретном сервере.</li>
<li><strong>Путать браузер с поисковиком.</strong> Chrome — программа, Google — сервис поиска.</li>
<li><strong>Считать, что правки не видны из-за кэша.</strong> Сначала проверь через Network.</li>
</ul></div>

<li>Назови три ингредиента сайта и что отвечает каждый.</li>
<li>Что означают коды 200, 404, 500?</li></ol></div>

{t:"Домен, DNS и хостинг",g:"Понять, из чего физически состоит адрес сайта и где он лежит. Без этого нельзя запустить сайт.",c:`
<h3>Зачем этот урок</h3>
<p>Через несколько месяцев ты будешь сдавать клиентам готовые сайты. На запуске всегда возникают вопросы: куда залить файлы, как привязать домен, почему сайт не открывается, куда направить почту. Всё это — про три вещи: домен, DNS и хостинг. Разберёшь сейчас — запуск перестанет быть стрессом.</p>
<p>Главная путаница новичка — смешать три понятия в одно. Давай разделим навсегда.</p><div class="note"><strong>Правовая оговорка.</strong> Это учебная модель, а не юридическая консультация. Условия регистрации, права на домен, платежи, персональные данные и договоры нужно сверять с актуальным провайдером и юристом в своей юрисдикции перед запуском.</div>

<h3>Простым языком</h3>
<p><strong>Домен — имя.</strong> Регистрацию/делегацию оформляют через регистратора на срок по правилам реестра и зоны. Цена, налоги, ограничения, перенос и права зависят от региона и провайдера: проверь документацию и условия на дату публикации. Ключевое свойство: домен можно перенаправить на другой сервер, поменяв одну DNS-запись. Поэтому «купить домен» и «купить хостинг» — независимые операции, лучше у разных провайдеров.</p>
<p><strong>DNS — диспетчерская.</strong> Записи зоны указывают, как разрешать имя: например, A/AAAA, CNAME, MX или TXT. Видимость изменений зависит от TTL, делегации NS/DS, отрицательного кэширования и локальных резолверов; проверяй авторитетные NS и несколько резолверов, не используй универсальный срок.</p>
<p><strong>Хостинг — среда размещения сайта.</strong> Это может быть shared-сервер, контейнер, CDN, VPS или облачная платформа; файлы и база могут находиться в разных сервисах. Доступность, резервные копии и защита зависят от провайдера и настроек. Захотел переехать — забрал вещи, снял другую квартиру.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Регистратор</dt><dd>Компания, через которую покупают домен и управляют DNS.</dd>
<dt>Хостинг-провайдер</dt><dd>Компания, предоставляющая сервер для файлов сайта.</dd>
<dt>DNS-зона</dt><dd>Набор записей, описывающих домен.</dd>
<dt>A-запись</dt><dd>Указывает IPv4-адрес; для IPv6 используется AAAA.</dd>
<dt>CNAME</dt><dd>Псевдоним одного имени для другого; для owner name обычно нельзя одновременно задавать другие записи, а корень зоны зависит от механизма провайдера.</dd>
<dt>MX</dt><dd>Указывает почтовый сервер домена.</dd>
<dt>TXT</dt><dd>Общий текстовый ресурсный тип, применяемый, например, для верификации, SPF, DKIM и DMARC; назначение задаёт конкретный стандарт.</dd>
<dt>TTL</dt><dd>Секунды, сколько запись может жить в кэше.</dd>
<dt>Shared / VPS</dt><dd>Общий сервер / виртуальный выделенный.</dd>
<dt>FTP</dt><dd>Протокол передачи без обязательного шифрования; для практики предпочитай SFTP/FTPS или безопасный deployment и проверь документацию версии/провайдера.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему домен и хостинг разделены? Это разные услуги с разными сроками: домен на годы, хостинг на месяцы. Разделил — сменил хостинг, не потеряв домен и посетителей. Почему DNS-изменения занимают до суток? Записи кэшируются на тысячах серверов мира, каждому нужно время узнать новое значение. Почему лучше у разных провайдеров? Если один заблокирует аккаунт или обанкротится, второй продолжит работать.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Домен — номер телефона: постоянный, его даёшь людям. Хостинг — офис: можешь переехать, но номер останется с тобой, если сам перенаправишь. DNS — телефонная станция: знает, что твой номер сейчас ведёт в новый офис. MX — «если звонят про письма, соединяй с почтовым отделением». CNAME — «если звонят на www, соединяй с основным номером».</p></div>

<h3>Как посмотреть это вживую</h3>
<pre>nslookup google.com
# или
ping google.com</pre>
<p>Увидишь IP-адрес — тот самый «номер дома». Введи его прямо в браузер: откроется тот же сайт. Это доказывает, что домен — просто удобное имя.</p>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>A-запись неверная</strong> — браузер пойдёт не туда. <strong>CNAME вместо A</strong> — многие хосты не поймут. <strong>MX не настроена</strong> — почта на домене не работает. <strong>Не продлить домен</strong> — через год сайт исчезнет. <strong>Shared с сотней соседей</strong> — один нагруженный сосед замедлит твой сайт.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Купить домен и изучить управление DNS</div>
<div class="task-why">Зачем: поработаешь с реальной панелью регистратора.</div>
<ol class="steps">
<li>Зайди на reg.ru или namecheap.com.</li>
<li>Введи желаемое имя — система покажет, свободно ли оно.</li>
<li>Выбери зону .ru, оформи покупку на 1 год.</li>
<li>В личном кабинете найди «DNS-серверы» или «Управление зоной».</li>
<li>Изучи автоматически созданные записи, найди A-запись.</li>
<li>Запиши в заметки, что означает каждая запись.</li>
</ol>
<div class="task-r">Результат: свой домен и понимание панели управления DNS.</div></div>

<div class="task"><div class="task-h">Задание 2. Сравнить три хостинга</div>
<div class="task-why">Зачем: через месяцы будешь выбирать хостинг для клиентских сайтов.</div>
<ol class="steps">
<li>Открой тарифные страницы Timeweb, Beget, Selectel.</li>
<li>Заведи таблицу: цена, диск, сайтов, БД, PHP, поддержка, бэкап.</li>
<li>Заполни для дешёвого и среднего тарифа каждого.</li>
<li>Отметь, где включён бесплатный SSL и автобэкап.</li>
<li>Выпиши, какой выберешь для лендинга, какой — для магазина на 5000 товаров.</li>
</ol>
<div class="task-r">Результат: таблица сравнения и понимание, за что платишь.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Домен и хостинг у одного провайдера.</strong> Заблокируют аккаунт — потеряешь всё.</li>
<li><strong>Ждать мгновенного применения DNS.</strong> Срок зависит от TTL и делегации; проверяй авторитетные NS и несколько резолверов.</li>
<li><strong>Путать A и CNAME.</strong> Часто прописывают CNAME вместо A — сайт не открывается.</li>
<li><strong>Забывать продлевать домен.</strong> Заведи напоминание за месяц.</li>
</ul></div>

{t:"Статический сайт, динамический сайт и CMS",g:"Понять три способа создания сайта и уметь выбрать правильный под задачу.",c:`
<h3>Зачем этот урок</h3>
<p>«Мне нужен сайт» — это не одна задача, а три разных проекта с разной ценой, сроками и инструментами. Твоя профессия — понять, какой тип нужен, ещё до того как назвал цену. Ошибка стоит дорого: можно взяться за сложный динамический сайт, когда клиенту хватило бы лендинга, или наоборот.</p>

<h3>Простым языком</h3>
<p><strong>Статика — как заранее напечатанная листовка.</strong> HTML и другие файлы обычно подготовлены заранее и могут быстро отдаваться, но браузер всё ещё может получать персонализированные данные из API. Изменение исходного контента обычно требует сборки или правки файлов; отдельный headless-редактор может дать админку.</p>
<p><strong>Динамика — как повар в ресторане.</strong> Сервер может формировать ответ с данными пользователя, но не обязан делать это на каждый запрос: применяются SSR, SSG, ISR, кэширование и API. Заходишь в кабинет — сервер понимает, что это ты, и показывает твои заказы. Нужна программа на сервере (PHP, Node.js) и база данных. Это банки, соцсети, магазины. Сложнее, дороже, требует программиста.</p>
<p><strong>CMS — готовая программа динамики.</strong> Закрывает сложную часть за тебя: программа уже написана, протестирована и бесплатно лежит в открытом доступе. Загрузил на хостинг, надел сверху свой дизайн — клиент сам добавляет товары и меняет тексты. Ты не повар, ты менеджер ресторана.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Статический сайт</dt><dd>Модель, где основной HTML/ресурсы подготовлены заранее; API, JS и персонализация могут добавляться отдельно.</dd>
<dt>Динамический сайт</dt><dd>Ответ зависит от данных/логики во время выполнения; генерация может сочетаться с кэшем, SSR, SSG, ISR и API.</dd>
<dt>CMS</dt><dd>Content Management System — система управления контентом.</dd>
<dt>База данных (БД)</dt><dd>Хранилище данных: товары, пользователи, заказы.</dd>
<dt>SQL</dt><dd>Structured Query Language — язык запросов к базе.</dd>
<dt>Бэкенд / Фронтенд</dt><dd>Серверная часть / клиентская часть.</dd>
<dt>Рендеринг</dt><dd>Формирование HTML из данных и шаблона.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему статика быстрее? Серверу не надо считать — он отдаёт готовый файл. Динамика на каждый запрос обращается к базе, собирает шаблон, подставляет данные — это время. Почему CMS бесплатна? Разработчики зарабатывают не на программе, а на плагинах, темах и поддержке вокруг неё. Доля WordPress зависит от методики и даты; любые проценты нужно сверять с актуальным источником и не превращать в аргумент выбора без анализа проекта. Потому что закрывает самый частый сценарий: «клиент хочет сам управлять контентом, а мне нужно быстро сдать».</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Статика — рекламный буклет: напечатали тираж, раздаёте одинаковый. Динамика — ресторан: каждый заказ индивидуальный. CMS — сеть фастфуда: есть готовое меню, стандартные процессы и касса, нужно только нанять кассира и открыть точку. Ты не придумываешь рецепты — берёшь проверенную систему.</p></div>

<p><strong>Магазин чистой статикой</strong> — клиент не добавит товар, будешь делать за него вечно. <strong>Динамика там, где хватит CMS</strong> — проект встанет в 3–5 раз дороже. <strong>CMS без учёта нагрузки</strong> — сайт ляжет под трафиком. <strong>Без кэша</strong> — динамика будет медленной.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Классифицировать три сайта</div>
<div class="task-why">Зачем: научишься определять тип с первого взгляда — навык для каждого брифа.</div>
<ol class="steps">
<li>Возьми три сайта: портфолио фотографа, Википедию, ВКонтакте.</li>
<li>Определи для каждого: статика, динамика или CMS.</li>
<li>Обоснуй одним признаком: «в подвале WordPress — значит CMS».</li>
<li>Проверь: открой код (Ctrl+U), поищи wp-content — маркер WordPress.</li>
<li>Ответь: сможет ли фотограф сам добавить фото, не трогая код?</li>
</ol>
<div class="task-r">Результат: умеешь сформировать гипотезу о стеке по нескольким признакам и подтвердить её документацией/инструментами; скрытые следы и сборка могут сделать определение ненадёжным.</div></div>

<div class="task"><div class="task-h">Задание 2. Определить тип под три задачи</div>
<div class="task-why">Зачем: подготовка к первому коммерческому разговору.</div>
<ol class="steps">
<li>Задача А: «страница для одной услуги, обновлять ничего не буду».</li>
<li>Задача Б: «магазин, сам добавлю 50 товаров в месяц, меняю цены».</li>
<li>Задача В: «личный кабинет с историей заказов и статусом доставки».</li>
<li>Для каждой выбери тип и инструмент (ручная вёрстка / WordPress / WooCommerce / Bitrix).</li>
<li>Напиши план, если клиент скажет: «хочу как у Apple, но чтобы самому цены менять».</li>
</ol>
<div class="task-r">Результат: алгоритм выбора инструмента под задачу.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Магазин чистой статикой.</strong> Клиент не сможет добавить товар.</li>
<li><strong>Динамика там, где хватит CMS.</strong> В 3–5 раз дороже.</li>
<li><strong>Считать WordPress несерьёзным.</strong> доля WordPress меняется по методике и дате; проверяй актуальный источник. Серьёзность — в качестве работы.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем статика отличается от динамики по способу отдачи?</li>
<li>Когда CMS бессмысленна, а нужна своя программа?</li>
<li>Клиент может менять текст на статике? А на WordPress?</li>
<li>Какой тип нужен магазину на 500 товаров и почему?</li></ol></div>
`},

{t:"Типы сайтов и их отличия",g:"Знать четыре основных типа сайтов, их назначение, инструменты и бюджеты.",c:`
<h3>Зачем этот урок</h3>
<p>«Сделайте сайт» — не одна задача, а четыре разные профессии. Лендинг за 60 000 ₽ и магазин за 400 000 ₽ — разные проекты, путать нельзя ни в разговоре, ни в обучении. Поймёшь различия — назовёшь цену правильно и не возьмёшься за невозможное.</p>

<h3>Простым языком</h3>
<p><strong>Лендинг — одна страница, одна цель.</strong> Ведёт по одному сценарию: зацепить → показать проблему → решение → доказать → продать. Никакой навигации, всё, что не ведёт к целевому действию, удаляется.</p>
<p><strong>Корпоративный — информация и доверие.</strong> 5–15 страниц с меню. Задача не «продать сейчас», а «выглядеть надёжно».</p>
<p><strong>Магазин — многократные продажи.</strong> Каталог, карточки, корзина, оплата, доставка, кабинет. Самый сложный: надо связать десяток сервисов.</p>
<p><strong>Продвинутый — впечатление как продукт.</strong> Анимации, 3D, нестандартная типографика, звук. Для брендов, фильмов, запусков.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Лендинг</dt><dd>Landing page — посадочная страница с одним целевым действием.</dd>
<dt>Корпоративный сайт</dt><dd>Многостраничник компании для представления.</dd>
<dt>CTA</dt><dd>Call To Action — призыв к действию; это может быть кнопка, ссылка или другой элемент.</dd>
<dt>Витрина</dt><dd>Страница каталога с товарами.</dd>
<dt>Чекаут</dt><dd>Процесс/этап оформления заказа, который может состоять из нескольких экранов или компонентов.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему у лендинга нет меню? Любая ссылка — возможность уйти, задача — удержать до целевого действия. Почему у корпоративного есть меню? Люди приходят за разной информацией. Почему магазин дороже всего? Нужно связать платёжку, доставку, чеки, CRM, email — каждый элемент может сломаться. Почему продвинутые стоят миллионы? Редкие навыки: WebGL, шейдеры, сложные анимации.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Лендинг — продавец-консультант: подходит, ведёт по одной дорожке, доводит до покупки. Корпоративный — витрина офиса: заходишь, смотришь таблички, выбираешь кабинет. Магазин — супермаркет: тележки, кассы, склад, логистика. Продвинутый — шоу на стадионе: делают не чтобы продать билет, а чтобы впечатлить.</p></div>

{t:"Рабочее место разработчика",g:"Настроить VS Code, расширения и структуру проекта так, чтобы работать удобно с первого дня.",c:`
<h3>Зачем этот урок</h3>
<p>Плохо настроенный редактор крадёт часы: ищешь файл, вручную выравниваешь отступы, перезагружаешь страницу после каждой правки. Хорошо настроенный редактор может сократить рутинные операции, но эффект зависит от проекта и измеряется на своей задаче, а настраивается один раз — и работает годами.</p>

<h3>Простым языком</h3>
<p>Твой инструмент — <strong>VS Code</strong>. Это не Word: он подсвечивает, подсказывает, проверяет. Расширения делают его умнее:</p>
<table><tr><th>Расширение</th><th>Зачем</th></tr>
<tr><td>Prettier</td><td>форматирует код по правилам и конфигурации проекта</td></tr>
<tr><td>Live Server</td><td>локальный HTTP-сервер; автообновление зависит от расширения и настроек</td></tr>
<tr><td>Auto Rename Tag</td><td>меняешь открывающий тег — закрытый исправляется сам</td></tr>
<tr><td>Emmet</td><td>встроен: <code>ul&gt;li*3</code> → готовый список</td></tr></table>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>IDE / редактор кода</dt><dd>Программа для написания кода с подсветкой и подсказками.</dd>
<dt>Расширение</dt><dd>Плагин, добавляющий редактору возможности.</dd>
<dt>Локальный сервер</dt><dd>Программа на твоём компьютере, отдающая файлы как настоящий сайт.</dd>
<dt>DevTools</dt><dd>Инструменты разработчика в браузере для отладки.</dd>
<dt>Emmet</dt><dd>Инструмент сокращённой записи HTML и CSS.</dd>
<dt>Format On Save</dt><dd>Автоформатирование файла при сохранении.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему не Блокнот? Без подсветки и автодополнения потратишь втрое больше времени и будешь чаще ошибаться. Почему Live Server, а не просто открыть файл? При открытии файла напрямую браузер блокирует часть функций (модули, fetch) из-за правил безопасности. Почему Prettier? Ручное выравнивание отвлекает от главного — мысли о задаче.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Настройка редактора — организация рабочего места мастера. Можно класть инструмент куда попало и каждый раз искать молоток. А можно повесить каждый инструмент на своё место. Первые полчаса организации экономят годы.</p></div>

<h3>Структура папки проекта</h3>
<pre>my-first-site/
├── index.html          ← главная страница
├── about.html          ← вторая страница
├── css/
│   └── style.css       ← все стили
├── js/
│   └── main.js         ← весь код
├── img/
│   ├── logo.svg
│   └── hero.webp
└── favicon.ico         ← иконка во вкладке</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Файлы свалены в кучу</strong> — через месяц 30 файлов превратятся в свалку. <strong>Не включить Format On Save</strong> — код станет нечитаемым. <strong>Открывать HTML двойным щелчком</strong> — часть функций не заработает, будешь искать несуществующий баг. <strong>Не поставить Auto Rename Tag</strong> — будешь вручную чинить парные теги.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Установить VS Code и четыре расширения</div>
<div class="task-why">Зачем: основной инструмент на ближайшие годы.</div>
<ol class="steps">
<li>Скачай VS Code с официального сайта и проверь издателя/права каждого расширения перед установкой.</li>
<li>Открой панель расширений: Ctrl+Shift+X.</li>
<li>Найди и установи Prettier.</li>
<li>Установи Live Server.</li>
<li>Установи Auto Rename Tag.</li>
<li>Нажми Ctrl+Shift+P, набери Format Document — проверь, что код выравнивается.</li>
<li>В настройках (Ctrl+,) включи Format On Save.</li>
</ol>
<div class="task-r">Результат: редактор сам форматирует код, обновляет страницу, чинит теги.</div></div>

<div class="task"><div class="task-h">Задание 2. Создать проект по правильной структуре</div>
<div class="task-why">Зачем: заложить привычку. Проекты, начатые с бардака, редко из него вылезают.</div>
<ol class="steps">
<li>Создай папку my-first-site.</li>
<li>Внутри создай папки: css, js, img.</li>
<li>В VS Code открой папку: File → Open Folder.</li>
<li>Создай index.html и вставь каркас.</li>
<li>Создай пустые css/style.css и js/main.js.</li>
<li>Подключи их в HTML через &lt;link&gt; и &lt;script&gt;.</li>
<li>Правый клик по index.html → Open with Live Server.</li>
<li>Измени текст в &lt;h1&gt;, сохрани — страница обновится сама.</li>
</ol>
<div class="task-r">Результат: рабочий проект с живым обновлением.</div></div>

<div class="task"><div class="task-h">Задание 3. Отработать пять сокращений Emmet</div>
<div class="task-why">Зачем: набор тегов — 20% времени. Emmet возвращает большую часть.</div>
<ol class="steps">
<li>Создай файл emmet-trenirovka.html.</li>
<li>Набери ul.list&gt;li.item*5, нажми Tab.</li>
<li>Набери nav&gt;ul&gt;li*4&gt;a, нажми Tab.</li>
<li>Набери table&gt;tr*3&gt;td*2, нажми Tab.</li>
<li>Набери form&gt;input:t+button:s, нажми Tab.</li>
<li>Набери .card&gt;img+h3+p+button, нажми Tab.</li>
<li>Выпиши пять сокращений в шпаргалку.</li>
</ol>
<div class="task-r">Результат: пять сокращений в мышечной памяти.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Открывать HTML двойным щелчком.</strong> Часть функций не заработает.</li>
<li><strong>Не включать Format On Save.</strong> Код станет нечитаемым.</li>
<li><strong>Файлы в корень «пока удобнее».</strong> Удобство длится до 30 файлов.</li>
<li><strong>Игнорировать консоль.</strong> Красная строка объясняет лучше форума.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Зачем нужен Format On Save в VS Code?</li>
<li>Чем Live Server удобнее открытия файла двойным щелчком?</li>
<li>Зачем проект разбивают на папки css/, js/, img/?</li>
<li>Назови три расширения VS Code, экономящих время.</li>
<li>Что делает сокращение ul&gt;li*3?</li></ol></div>
`},

{t:"Git и GitHub с первого дня",g:"Научиться сохранять историю проекта, откатываться назад и не потерять работу.",c:`
<h3>Зачем этот урок</h3>
<p>Ты целый день делаешь сайт, всё работает, и в 22:00 случайно удаляешь нужную папку. Без системы сохранений день исчезает. С ней — одна команда, и ты вернулся к состоянию «час назад». Git — <strong>машина времени для кода</strong>, нужна не «когда-нибудь», а с первой недели.</p>
<p>Второе применение: GitHub — портфолио. Через год работодатель увидит историю всех проектов. «500 коммитов за год» убедительнее резюме.</p>

<h3>Простым языком</h3>
<p><strong>Коммит</strong> — снимок всех файлов в конкретный момент: что изменилось, кто, когда, с каким сообщением. Это не «сохранение файла» (это Ctrl+S), а «сохранение состояния всего проекта». Коммит идентифицируется хешем, поэтому изменение содержимого создаёт другой коммит; историю технически можно переписать через amend/rebase/filter-repo и force-push. Опубликованную историю не переписывай без согласования.</p>
<p><strong>Ветка</strong> — отдельная линия разработки. Без веток работаешь на одной линии: захотел попробовать фичу — сломаешь рабочий сайт. С ветками: создал линию, экспериментируешь, а когда работает — вливаешь в main. Не удался эксперимент — удалил ветку, main не тронут.</p>
<p><strong>Локально и на GitHub.</strong> Git работает локально, без интернета. GitHub — удалённый Git-хостинг, но не гарантированная резервная копия: возможны удаление репозитория, потеря доступа, force-push и публичная утечка. Нужны второй remote/регулярный экспорт, защита веток и отдельный backup-план.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Репозиторий</dt><dd>Хранилище проекта с историей изменений.</dd>
<dt>Коммит</dt><dd>Фиксация состояния файлов с сообщением.</dd>
<dt>Ветка (branch)</dt><dd>Независимая линия разработки.</dd>
<dt>main</dt><dd>Распространённое имя основной ветки; стабильность задаётся правилами проекта, review и защитой ветки, а не Git автоматически.</dd>
<dt>Merge</dt><dd>Слияние одной ветки в другую.</dd>
<dt>Clone</dt><dd>Копирование удалённого репозитория.</dd>
<dt>Push / Pull</dt><dd>Отправка на сервер / получение с сервера.</dd>
<dt>.gitignore</dt><dd>Файл со списком того, что не отслеживать.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему опубликованную историю не следует переписывать без согласования? Переписывание меняет хеши и может нарушить работу коллег; технически amend/rebase/force-push возможны, поэтому нужны правила проекта. Почему ветки? Эксперименты и стабильность — разные задачи. Почему node_modules обычно не коммитят: размер зависит от проекта. Для воспроизводимости нужны package.json, lockfile и совместимые версии Node/npm; в CI часто используют npm ci, а не обещают идентичность от одного npm install. Почему сообщение важно? Через полгода не помнишь, что делал, а git log — твоя память.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Git — система сохранений в видеоигре. Каждый коммит — точка сохранения, сломались на боссе — загрузились с прошлой. Ветка — «новое прохождение другим персонажем»: экспериментируешь, основное не трогаешь. GitHub — удалённая копия, но не единственный backup: доступ, удаление и force-push требуют отдельного плана восстановления.</p></div>

<h3>Основные команды</h3>
<pre>git init                          # создать репозиторий

git status                         # сначала проверить изменения

git push                          # залить изменения

git pull                          # fetch + merge/rebase по настройкам; возможны конфликты</pre>

<table><tr><th>Плохое сообщение</th><th>Хорошее</th><th>Почему</th></tr>
<tr><td>«файлы»</td><td>«свёрстал шапку с лого и меню»</td><td>через полгода поймёшь, что делал</td></tr>
<tr><td>«фикс»</td><td>«исправил отступ в тарифах на мобиле»</td><td>можно найти поиском</td></tr>
<tr><td>«обновление»</td><td>«добавил страницу „О нас“ и шрифт»</td><td>сообщение = мини-документация</td></tr></table>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Коммит раз в неделю один «большой»</strong> — не найти, когда сломалось. <strong>Закоммитить .env с секретами</strong> — .gitignore не удаляет уже отслеживаемый файл; немедленно revoke/rotate ключи, затем по процедуре чисть историю и предупреди получателей. <strong>Нет .gitignore</strong> — закоммитишь node_modules на сотни МБ. <strong>Путаешь push и pull</strong> — ошибка и потеря времени.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Пройти интерактивный курс по веткам</div>
<div class="task-why">Зачем: Git тяжело понять из текста — это про наглядные переходы.</div>
<ol class="steps">
<li>Открой learngitbranching.js.org.</li>
<li>Выбери Introduction, пройди первые 4 уровня: коммиты, ветки, merge.</li>
<li>На каждом уровне читай подсказку.</li>
<li>Дойди до уровня с rebase.</li>
<li>Вернись к уровню 1 и пройди заново.</li>
</ol>
<div class="task-r">Результат: прошёл создание коммитов, переключение ветвей и слияние на опыте.</div></div>

<div class="task"><div class="task-h">Задание 2. Создать репозиторий и три коммита</div>
<div class="task-why">Зачем: первый реальный коммит. После него Git перестаёт быть страшным.</div>
<ol class="steps">
<li>Установи Git с git-scm.com.</li>
<li>Открой командную строку в папке my-first-site.</li>
<li>Выполни git init.</li>
<li>Выполни git config user.name "Твоё Имя" и git config user.email "почта@mail.ru".</li>
<li>Создай .gitignore с таким содержимым:<br>node_modules/<br>.env<br>.DS_Store<br>*.log<br>.vscode/</li>
<li>Проверь git status и git diff --cached, добавь только нужные файлы, затем выполни git commit -m "начало проекта + gitignore". Реальные ключи не используй — только placeholders.</li>
<li>Измени текст в index.html, повтори add и commit с сообщением «поменял заголовок».</li>
<li>Добавь правило в style.css, сделай третий коммит.</li>
<li>Выполни git log --oneline — увидишь историю.</li>
</ol>
<div class="task-r">Результат: три коммита с осмысленными сообщениями.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Коммит раз в неделю.</strong> Не найти, когда сломалось.</li>
<li><strong>Сообщение «asdf».</strong> Через месяц не поймёшь историю.</li>
<li><strong>.env с паролями в коммите.</strong> Ключи утекли.</li>
<li><strong>Путать pull и push.</strong> pull — забрать, push — отправить.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем коммит отличается от сохранения файла?</li>
<li>Что будет с main, если эксперимент в ветке провалится?</li>
<li>Чем git add . отличается от git commit?</li>
<li>Как восстановить удалённый файл из последнего коммита?</li>
<li>Почему node_modules не кладут в репозиторий?</li></ol></div>
`},

{t:"Бриф: как вытащить задачу у заказчика",g:"Уметь превратить «хочу сайт» в чёткое задание, которое можно выполнить и оценить.",c:`
<h3>Зачем этот урок</h3>
<p>Заказчик почти никогда не знает, чего хочет. Он говорит «сделай красиво и современно» — и этим говорит всё и ничего. Если примешь эту фразу за задание, через месяц получишь бесконечные правки. И никто не будет виноват, потому что <strong>задача так и не была сформулирована</strong>.</p>
<p>Бриф решает три задачи. Показывает, понимает ли заказчик собственный бизнес. Даёт материал для структуры страницы — каждый ответ становится блоком. И, главное, <strong>защищает тебя</strong>: через полгода откроете бриф и сверитесь с тем, что договаривались.</p>

<h3>Простым языком</h3>
<p>Бриф — перевод с языка «хочу» на язык «сделай вот это, тогда получится вот то». Без него вы оба говорите о разных вещах, не замечая этого.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Бриф</dt><dd>Анкета с вопросами для сбора требований.</dd>
<dt>Стейкхолдер</dt><dd>Человек, чьё мнение влияет на проект.</dd>
<dt>Целевая аудитория (ЦА)</dt><dd>Группа людей, для которых делается продукт.</dd>
<dt>Целевое действие</dt><dd>Действие, которое пользователь должен совершить.</dd>
<dt>Боли клиента</dt><dd>Проблемы, которые продукт решает.</dd>
<dt>УТП</dt><dd>Уникальное торговое предложение.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему спрашивать «какую одну цель», а не «что вы хотите»? «Всё сразу» — это ни одной цели. Почему спрашивать о конкурентах? Рынок уже проверил, что работает, а что нет. Почему спрашивать про фото и тексты? Сроки часто срываются, когда контент не подготовлен заранее; это нужно фиксировать в брифе и плане работ. Почему спрашивать бюджет? Можно месяц делать сайт, который не по карману.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Бриф — как заполнение медицинской карты. Можно сказать врачу «мне плохо», но он спросит: где болит, когда началось, что ели. Чем точнее ответы, тем точнее диагноз. Если поболтаете о погоде — лечение не начнётся.</p></div>

<tr><td>Какую одну цель должен решать сайт?</td><td>Без этого непонятно, что считать успехом</td></tr>
<tr><td>Как сейчас приходят клиенты?</td><td>Стоит ли сайт этих денег</td></tr>
<tr><td>Какие конкуренты нравятся и почему?</td><td>Визуальная цель</td></tr>
<tr><td>Что обязательно? Что запрещено?</td><td>Рамки проекта</td></tr>
<tr><td>Есть ли логотип, цвета, шрифты?</td><td>Объём дизайн-работы</td></tr>
<tr><td>Есть ли фото/видео? Кто делает?</td><td>Частая причина срыва сроков</td></tr>
<tr><td>Кто пишет тексты?</td><td>Тексты — значимая часть работы</td></tr>
<tr><td>Какие функции нужны?</td><td>Цена и выбор инструмента</td></tr>
<tr><td>На каких устройствах важнее?</td><td>Приоритеты в дизайне</td></tr>
<tr><td>Бюджет и срок запуска?</td><td>Без этого нельзя начать</td></tr></table>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Не спросить цель</strong> — сделаешь сайт, который не продаёт. <strong>Не спросить про контент</strong> — потратишь время впустую. <strong>Не спросить бюджет</strong> — месяц работы впустую. <strong>Не зафиксировать рамки</strong> — «а давайте ещё вот это» будет бесконечным.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Создать шаблон брифа</div>
<div class="task-why">Зачем: один раз сделаешь — будешь использовать годы.</div>
<ol class="steps">
<li>Создай документ «Бриф на сайт».</li>
<li>Добавь 12 вопросов из таблицы + 8 своих.</li>
<li>Разбей на блоки: «О бизнесе», «О клиентах», «О сайте», «О содержании», «О бюджете».</li>
<li>Добавь поля «Дата заполнения» и «Кто заполнял».</li>
<li>Сохрани как шаблон.</li>
</ol>
<div class="task-r">Результат: бланк на 20 вопросов для каждого клиента.</div></div>

<div class="task"><div class="task-h">Задание 2. Провести бриф для выдуманного клиента</div>
<div class="task-why">Зачем: отработать технику. В первом реальном брифе будешь нервничать.</div>
<ol class="steps">
<li>Придумай клиента: сеть из трёх кофеен.</li>
<li>Заполни бриф за него правдоподобно, не идеально.</li>
<li>На вопрос «какая цель» напиши сначала плохой вариант, потом хороший.</li>
<li>Назови двух реальных конкурентов и объясни, чем нравятся.</li>
<li>Выпиши одной строкой: главную цель сайта и главное действие.</li>
<li>Отдельно выпиши, что осталось непонятным.</li>
</ol>
<div class="task-r">Результат: заполненный бриф + список вопросов на уточнение.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Отправлять бриф и ждать ответа.</strong> Лучше созвониться и заполнить вместе.</li>
<li><strong>Спрашивать «какой цвет нравится?».</strong> Это вопрос клиента к себе, не к тебе.</li>
<li><strong>Не спрашивать про фото и тексты.</strong> Контент может стать причиной задержки, поэтому зафиксируй владельца и дату передачи.</li>
<li><strong>Браться без ответа про бюджет.</strong> Можно месяц делать сайт не по карману.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Почему «кто ваш клиент» важнее «какой цвет нравится»?</li>
<li>Что делать, если заказчик не знает бюджета?</li>
<li>Зачем спрашивать о конкурентах?</li>
<li>Как отличить хорошую цель от плохой?</li></ol></div>
`},

{t:"Целевая аудитория и конкурентный анализ",g:"Принимать дизайн-решения на основе конкретных людей и рынка, а не личного вкуса.",c:`
<h3>Зачем этот урок</h3>
<p>Самый дорогой способ делать сайты — на основе собственного вкуса. Ты любишь минимализм и тёмные темы, а клиенту нужен яркий сайт для женщин 45+, ищущих детские товары. Сайт получится «красивым» — и не будет продавать. Потому что ты делал его для себя.</p>
<p>Правильный способ — представлять <strong>конкретного человека</strong> и принимать решения от его имени. Когда такой человек перед глазами, вопросы решаются сами: какие слова писать, какие возражения снимать, на какие кнопки давить, какие фото выбирать.</p>

<h3>Простым языком</h3>
<p>Портрет ЦА — не абстрактная «женщина 25–45», а конкретная Анна, 34 года, руководитель отдела из Москвы, которая ищет стоматологию с планом лечения и боится, что её «втянут в лишнее лечение». Когда держишь её в голове, понимаешь: ей нужен крупный телефон в первом экране, честная цена «от», отзывы с фото реальных людей и блок «почему не больно».</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Персона</dt><dd>Вымышленный представитель целевой аудитории.</dd>
<dt>Сегментация</dt><dd>Деление аудитории на группы по признакам.</dd>
<dt>Возражение</dt><dd>Причина, по которой клиент отказывается покупать.</dd>
<dt>Триггер</dt><dd>Стимул, побуждающий к действию.</dd>
<dt>CustDev</dt><dd>Исследование через разговоры с клиентами.</dd>
<dt>JTBD</dt><dd>Jobs To Be Done — «работа», для выполнения которой «нанимают» продукт.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему «все от 18 до 55» — плохой портрет? Решения получаются неточными: не поймёшь тон, фото, размер кнопок. Почему в анализе конкурентов искать сходства? Там, где у всех одинаково, рынок отработал необходимость. Почему искать пробелы? Там, где у всех слабо, — твоя возможность выделиться. Почему возвращаться к портрету при спорном решении? Иначе решение будет случайным, а случайные не масштабируются.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Ты пригласил друга в ресторан. Знаешь, что он вегетарианец, — вечер получится. Выбрал стейк-хаус «потому что сам люблю мясо» — друг останется голодным. Знание конкретного человека меняет все решения: куда идти, что заказать.</p></div>

<h3>Зачем этот урок</h3>
<p>Посетитель часто сначала сканирует первый экран, но скорость и решение зависят от устройства, задачи, аудитории и контента; 3–5 секунд можно использовать лишь как гипотезу для теста, а не как закон. Поэтому порядок блоков — вопрос выживания сайта.</p>
<p>Последовательность блоков — рабочая гипотеза, а не закон: аудитория, тип продукта, длина страницы и сценарий могут менять порядок. Проверяй иерархию аналитикой, интервью и тестированием.</p>

<h3>Простым языком</h3>
<pre>ВНИМАНИЕ → ПРОБЛЕМА → РЕШЕНИЕ → ДОКАЗАТЕЛЬСТВО → ОФФЕР → CTA</pre>
<p>Каждый блок должен заканчиваться микро-решением: «дальше», «интересно», «верю». Пропустил «проблему» — человек не узнал себя и ушёл. Пропустил «доказательство» — не поверил и не купил.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Воронка</dt><dd>Путь пользователя от первого контакта до целевого действия.</dd>
<dt>Герой</dt><dd>Первый экран с главным заголовком и CTA.</dd>
<dt>Микро-конверсия</dt><dd>Маленькое действие, приближающее к главному.</dd>
<dt>Отскок</dt><dd>Уход со страницы без действий.</dd>
<dt>Скроллинг</dt><dd>Прокрутка контента.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему не начинать с «о компании»? Посетителю всё равно, сколько лет компании — он хочет решить задачу. Два CTA могут быть уместны при ясной иерархии (например, основное действие и безопасная альтернатива); проверь выбор по сценарию и аналитике. Почему у блока должен быть заголовок? Без заголовка блок не несёт сообщения, значит, он лишний.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Структура лендинга — разговор с продавцом. Сначала цепляет внимание («красивая улыбка»), потом называет проблему («но тут кариес»), потом решение («поставим пломбу»), потом доказательство («400 довольных пациентов»), цена («от 3000 ₽») и финал: «записаться?». Если начнёт с «я работаю здесь с 2015 года» — вы уйдёте.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Составить 10 блоков с назначением</div>
<div class="task-why">Зачем: это скелет лендинга. С ним верстка идёт втрое быстрее.</div>
<ol class="steps">

<li>Напротив каждого напиши задачу одним предложением.</li>
<li>Отметь главный элемент каждого блока: заголовок, картинка, цифра, кнопка.</li>
<li>Отметь, в каких блоках стоит CTA. Обычно 2-й и 10-й.</li>

<h3>Зачем этот урок</h3>
<p>Прототип — <strong>черновик из серых прямоугольников</strong>. Никаких цветов, шрифтов, картинок. Только блоки и расположение кнопок. Звучит скучно, но это самый выгодный инструмент: переделать серый прямоугольник — 2 минуты, красивый макет — 2 часа, свёрстанный сайт — день.</p>

<h3>Простым языком</h3>
<p>Правило профессионалов: не тратить минуты на красоту, пока не проверена логика. Новички делают наоборот — сразу рисуют красивый герой, вкладываются эмоционально, а потом выясняется, что структура не работает, и всё это надо выбрасывать.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Прототип</dt><dd>Упрощённая модель интерфейса для проверки логики.</dd>
<dt>Вайрфрейм</dt><dd>Каркас страницы без оформления.</dd>
<dt>Фрейм</dt><dd>Рабочая область под конкретный экран.</dd>
<dt>Макет</dt><dd>Оформленный дизайн страницы.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему ошибка на прототипе дешевле? На прототипе меняешь положение прямоугольника, а на макете — ещё и перекрашивать, переставлять текст, пересчитывать отступы. Почему рисуют все кнопки? Расположение кнопок определяет поведение. Начни с 3–5 представителей ЦА для качественного выявления очевидных проблем, но не считай это автоматически устойчивой статистикой; повторяй тесты по мере итераций.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Прототип — планировка квартиры до ремонта. Можно сразу клеить обои, а потом узнать, что дверь открывается в стену. А можно на бумаге переставить перегородки десять раз за вечер — бесплатно. Профессиональный архитектор никогда не начнёт с обоев.</p></div>

<h3>Зачем этот урок</h3>
<p>Два сайта с одинаковым текстом — один выглядит «дорого», другой «дёшево». Разница не в бюджете, а в <strong>композиции</strong>: как элементы выровнены, какой размер, сколько воздуха вокруг.</p>
<p>Глаз читает страницу за доли секунды и ищет подсказки: «что здесь важнее всего?». Если подсказок нет — глаз устаёт и уходит. Если есть — человек за 3 секунды понимает суть.</p>

<h3>Простым языком</h3>
<p>Сетка — невидимые линии для выравнивания. Без сетки элементы стоят «примерно»: один отступ 24 px, соседний 27, третий 19. Глаз этого не измеряет, но <strong>чувствует</strong> — и воспринимает макет как неряшливый.</p>
<p>12 колонок — часто используемый шаблон, а не обязательный стандарт; сетку и шаг подбирай под контент, платформу и реальные брейкпоинты., потому что делится на 2, 3, 4 и 6 равных частей. Отсюда раскладки: 6+6, 4+4+4, 3+3+3+3, 8+4.</p>
<p>Три инструмента иерархии: <strong>размер</strong> (больше = важнее), <strong>контраст</strong> (ярче = заметнее), <strong>пространство</strong> (больше воздуха вокруг = важнее).</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Композиция</dt><dd>Построение элементов на плоскости по законам гармонии.</dd>
<dt>Сетка</dt><dd>Система невидимых линий для выравнивания.</dd>
<dt>Визуальная иерархия</dt><dd>Порядок важности, заданный оформлением.</dd>
<dt>Контраст</dt><dd>Различие элементов по размеру, цвету, весу.</dd>
<dt>8-pt grid</dt><dd>Система отступов, кратная 8 пикселям.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему 12 колонок? Делится на 2, 3, 4, 6 — все типовые раскладки. Почему отступы кратны 8? 8 делится на 2 и 4 — типовые шаги раскладки, и даёт ровный ритм при масштабировании. Почему воздуха вокруг важного больше? Изолированный элемент притягивает внимание сильнее зажатого.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Сетка — расстановка мебели в комнате. Если диван, стол и стул стоят «примерно» вдоль стен, комната выглядит неряшливо. Если всё выровнено по линиям пола — продуманной. Воздух — расстояние между мебелью: если диван придвинут вплотную к стене, комната кажется тесной, хотя площадь та же.</p></div>

<h3>Зачем этот урок</h3>
<p>Правило третей, золотое сечение и воздух — композиционные эвристики, которые можно попробовать. Они не универсальны для всех культур и задач и не заменяют проверку иерархии на конкретной аудитории.</p>
<p>Три инструмента: правило третей (куда ставить важное), золотое сечение (как делить пространство) и воздух (чего НЕ рисовать). Третий самый важный — потому что ошибка новичка всегда в одном: ему кажется, что на странице слишком мало элементов.</p>

<h3>Простым языком</h3>
<p><strong>Правило третей.</strong> Раздели кадр на девять равных частей двумя вертикальными и двумя горизонтальными линиями. Четыре точки пересечения можно использовать как ориентиры композиции, но взгляд не обязан задерживаться там; проверь результат на реальном контенте. Поставь туда заголовок, кнопку или главный объект — композиция оживает. Если важное в центре или в углу — картинка статичная.</p>
<p><strong>Золотое сечение.</strong> Соотношение 1 : 1,618 — известная композиционная эвристика; воспринимаемый эффект зависит от контекста, культуры и задачи. Если ширина контента 1200 px, деление даёт 741 и 459 px: основной блок заметно больше второстепенного, но не в два раза — выглядит естественно.</p>
<p><strong>Воздух.</strong> Расстояние между блоками важнее самих блоков. Ошибка новичка: «тут мало информации, добавим блок». Ошибка профи: «не хватило воздуха».</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Правило третей</dt><dd>Кадр делится на 9 частей, важное ставится на пересечения линий.</dd>
<dt>Золотое сечение</dt><dd>Пропорция 1:1,618, воспринимается как гармоничная.</dd>
<dt>Точка интереса</dt><dd>Место, куда глаз смотрит первым.</dd>
<dt>White space</dt><dd>Свободное пространство между элементами.</dd>
<dt>Композиционный баланс</dt><dd>Равновесие визуального веса элементов.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему точки пересечения линий сильнее центра кадра? Центр — точка покоя, а пересечения создают динамику: глаз двигается от точки к точке. Почему попробовать 1:1,618, а не 1:2? Это один из вариантов пропорции; «гармоничность» нужно проверять на задаче и аудитории, а не выводить из универсального закона. Почему воздух важнее контента? Воздух направляет внимание: изолированный элемент притягивает взгляд сильнее зажатого.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Правило третей — расставить картину на стене. Ровно по центру — комната скучна. Сместить чуть влево и повесить на уровне глаз — комната оживает. Золотое сечение — пропорции человека: отношение расстояния от макушки до плеч к расстоянию от плеч до пояса. Воздух — расстояние между мебелью: придвинуть всё к стенам — квартира кажется тесной, хотя метры те же.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Применить правило третей</div>
<div class="task-why">Зачем: первый экран — самое дорогое место.</div>
<ol class="steps">
<li>Возьми макет первого экрана.</li>
<li>Наложи сетку: 3 столбца × 3 строки.</li>
<li>Найди четыре точки пересечения.</li>
<li>Перенеси заголовок к верхней линии.</li>
<li>Поставь кнопку рядом с точкой пересечения слева.</li>
<li>Помести центр фото в правую верхнюю точку.</li>
<li>Сравни с исходным — куда теперь идёт взгляд первым?</li>
</ol>
<div class="task-r">Результат: первый экран, где взгляд движется по предначертанному пути.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Бояться пустоты.</strong> Пустое место — инструмент, не дефект.</li>
<li><strong>Ставить всё в центре.</strong> Центральная композиция статична.</li>
<li><strong>Равное деление 50/50.</strong> Симметрия утомляет.</li>
<li><strong>«Красиво» = много элементов.</strong> Красиво = пропорции и воздух.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Где четыре «точки интереса» по правилу третей?</li>
<li>Чему равно золотое сечение?</li>
<li>Почему воздух важнее контента?</li>
<li>Что делать, когда кажется, что мало элементов?</li></ol></div>
`},

{t:"Типографика: основа",g:"Управлять чтением с помощью шрифта. Типографика занимает значительную часть интерфейса и сильно влияет на читаемость и иерархию.",c:`
<h3>Зачем этот урок</h3>
<p>Сайт — это в основном текст. Люди приходят читать: что за услуга, сколько стоит, как заказать. Если текст плохо читается — не важно, какой классный фон ты сделал, человек за 10 секунд закроет вкладку. Поэтому типографика существенно влияет на восприятие интерфейса, но её вклад нельзя честно свести к универсальному проценту.</p>
<p>Новички тратят на типографику меньше всего времени: ставят «какой-то размер» и идут дальше. Профессионал наоборот — сначала выстраивает шкалу из 6 уровней, и потом решения принимаются мгновенно.</p>

<h3>Простым языком</h3>
<p>Четыре параметра управляют всем: <strong>кегль</strong> (размер), <strong>интерлиньяж</strong> (расстояние между строками), <strong>трекинг</strong> (расстояние между буквами), <strong>начертание</strong> (толщина линий).</p>
<p>Интерлиньяж важен больше, чем кажется. При <code>line-height: 1</code> строки слипаются, и глаз цепляется за соседнюю строку. На абзаце из пяти строк начинаешь терять место. Для заголовков плотность допустима (1.1–1.2), для основного текста нужен воздух (1.5–1.7).</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Кегль</dt><dd>Размер шрифта, в px или pt.</dd>
<dt>Интерлиньяж</dt><dd>Расстояние между базовыми линиями строк.</dd>
<dt>Трекинг</dt><dd>Межбуквенное расстояние.</dd>
<dt>Кернинг</dt><dd>Подгонка расстояния между парами букв.</dd>
<dt>Начертание</dt><dd>Толщина линий: Regular, Medium, Bold.</dd>
<dt>Гарнитура</dt><dd>Семейство шрифтов одного рисунка (например, Inter).</dd>
<dt>Шкала</dt><dd>Система размеров для разных уровней текста.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему размеры шрифтов в переменных? Если нужно поменять базовый размер, меняешь одно значение, а не пятнадцать. Почему ограничивают ширину абзаца? Строка на 120 символов нечитаема: глаз теряет место при переносе. Почему заголовку можно плотный интерлиньяж? Он короткий и воспринимается как единый блок, а абзац нужно прокручивать построчно.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Типографика — расположение текста на визитке. Если всё одним кеглем и вплотную, визитку не читают. Если имя крупно, должность мелко, телефон чуть крупнее должности — взгляд находит нужное. Интерлиньяж — расстояние между строками в конспекте: писать вплотную — через месяц ничего не разберёшь.</p></div>

</svg><figcaption><b>Рис. 13.1.</b> Разница между уровнями кратна: 48 → 36 → 24 → 20 → 16 → 14. Такая шкала даёт ровный ритм.</figcaption></figure>

<h3>Пример кода</h3>
<pre>:root {
  --fs-h1: 48px;  --fs-h2: 36px;  --fs-h3: 24px;
  --fs-body-lg: 20px;  --fs-body: 16px;  --fs-caption: 14px;
}
body { font-size: var(--fs-body); line-height: 1.6; }
h1 { font-size: var(--fs-h1); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: var(--fs-h2); font-weight: 600; }
p  { max-width: 65ch; }</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Весь текст одного размера</strong> — нет иерархии. <strong>Строка на 120+ символов</strong> — читатель теряет место. <strong>Заголовок в три строки</strong> — обещание слишком размытое. <strong>Серый текст #999</strong> — не проходит норму контраста.</p></div>

<h3>Зачем этот урок</h3>
<p>Шрифт несёт характер. Один и тот же текст в Playfair и Roboto читается по-разному — не из-за букв, а из-за настроения, которое они задают. Выбрал шрифт «не тот» — и премиальный продукт выглядит как контора.</p>
<p>Google Fonts бесплатный и огромный, но <strong>не все шрифты поддерживают кириллицу</strong>. Новичок выбирает красивый шрифт, подключает — и русский текст показывается системным шрифтом. Выглядит как поломка, хотя шрифт просто не содержит русских букв.</p>

<h3>Простым языком</h3>
<p><strong>Гротеск</strong> (Inter, Roboto, Manrope) — нейтральный, технологичный. <strong>Антиква</strong> (Playfair, Cormorant) — с засечками, «дорогая». <strong>Геометрическая</strong> (Montserrat, Poppins) — ровная, дружелюбная. <strong>Акцидентная</strong> — с характером, только для заголовков.</p>
<p>Правило пары: один шрифт «с характером» для заголовков + один нейтральный для текста. Две антиквы рядом выглядят как случайный набор, а антиква + гротеск — как гармония.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Гарнитура</dt><dd>Семейство шрифтов, например Inter.</dd>
<dt>Начертание</dt><dd>Вариант: Regular, Medium, Bold, Italic.</dd>
<dt>Засечки (serif)</dt><dd>Короткие штрихи на концах букв.</dd>
<dt>Гротеск (sans-serif)</dt><dd>Шрифт без засечек.</dd>
<dt>font-display: swap</dt><dd>Показывать системный шрифт, пока грузится свой.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему в паре один шрифт с характером? Два «характерных» конкурируют, и взгляд не знает, на чём остановиться. Почему не подключать восемь начертаний? Каждый вес — отдельный файл, сайт грузится дольше. Почему важно проверять кириллицу? Без неё русский текст отобразится системным шрифтом. Почему font-display: swap? font-display управляет стратегией отображения во время загрузки; swap обычно быстрее показывает fallback, но возможны FOUT и layout shift.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Шрифтовая пара — наряд на свидание. Нельзя надеть два ярких платья: они будут спорить. Но яркий шарф к нейтральному платью — гармония. Кириллица — проверка, есть ли в магазине твой размер: картинка на витрине красивая, а на тебе не налезет.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Подобрать пару под нишу</div>
<div class="task-why">Зачем: шрифт живёт только в связке с контентом.</div>
<ol class="steps">
<li>Определи нишу проекта.</li>
<li>В Google Fonts включи фильтр «Cyrillic».</li>

<div class="task-r">Результат: проверенная на людях пара с кириллицей.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Выбирать шрифт по превью.</strong> Главная ошибка новичка.</li>
<li><strong>Подключать восемь начертаний.</strong> Каждый вес — отдельный файл.</li>
<li><strong>Две антиквы в паре.</strong> Случайный набор.</li>

{t:"Цвет: теория и палитра",g:"Начинать палитру с эвристики 60/30/10 и проверять контраст, состояния и иерархию.",c:`
<h3>Зачем этот урок</h3>
<p>Цвет делает две вещи: создаёт эмоцию и направляет внимание. Когда он сделан неправильно, страдает обычно второе: акцентный цвет стоит на десяти элементах, и глаз не понимает, куда жать. Кнопка «Купить» выглядит так же важно, как заголовок раздела.</p>
<p>60/30/10 и ограничение числа основных цветов — стартовые эвристики, а не стандарт и не гарантия. Роли текста, ссылок, границ, состояний, ошибок и иллюстраций могут потребовать дополнительных оттенков; проверяй контраст и иерархию.</p>

<h3>Простым языком</h3>
<p>60/30/10 — только эвристика визуального веса, а не обязательная арифметика; проверь роли цветов на конкретном макете и контраст.</p>
<p>Почему акцент редко? Если он везде, он перестаёт быть акцентом. Синие кнопки, ссылки, рамки, фон — акцент не работает. Акцент должен быть там, где должно произойти действие.</p>
<p>Если у бренда один цвет — построй шкалу оттенков (от почти белого до почти чёрного) и бери 4 ступени: 50 / 100 / 500 / 900.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Палитра</dt><dd>Набор цветов проекта.</dd>
<dt>Акцентный цвет</dt><dd>Цвет целевых действий.</dd>
<dt>Оттенок (tint)</dt><dd>Цвет, смешанный с белым.</dd>
<dt>Тень (shade)</dt><dd>Цвет, смешанный с чёрным.</dd>
<dt>Насыщенность</dt><dd>Интенсивность цвета.</dd>
<dt>Ядовитые сочетания</dt><dd>Пары, вызывающие усталость глаз.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему не больше трёх цветов? Палитра превращается в шум, взгляд не находит главного. Почему акцент на 10%? Редкий цвет притягивает внимание сильнее частого. Почему проверять контраст? Палитра может быть красивой, но текст на её фоне нечитаемым. Почему монохром с одним акцентом работает для коммерции? Он спокоен и предсказуем, а значит, не мешает продавать.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Палитра — интерьер комнаты. Стены — 60% (нейтральный фон). Мебель — 30% (тёмное, основательное). 10% — акцент: яркая подушка или лампа. Если все стены, мебель и лампы яркие — невозможно находиться. Если всё серое — скучно. Один яркий элемент на нейтральном фоне — идеально.</p></div>

<h3>Пример кода</h3>

{t:"Контраст и доступность (WCAG)",g:"Делать сайты, которыми могут пользоваться все — и не терять клиентов.",c:`
<h3>Зачем этот урок</h3>
<p>Представь посетителя на солнце — экран бликует, и светло-серый текст на белом фоне для него просто не существует. Или человека в метро — смотрит на минимуме яркости. Или человека 60 лет со зрением не 100%. Все они уйдут с сайта, где контраст плохой, и никто не скажет тебе почему.</p>
<p>Плюс доступность напрямую влияет на SEO: Google учитывает удобство использования. И отдельный плюс: соблюдение контраста — то, что проверяют при сдаче проекта. Lighthouse даёт небольшой автоматизированный набор сигналов и не заменяет ручную проверку клавиатурой, скринридером, фокусом, контентом и реальными сценариями.</p>

<h3>Простым языком</h3>
<p>Нормы WCAG: <strong>обычный текст 4.5:1</strong>, <strong>крупный текст 3:1</strong> (18 pt/24 CSS px обычного начертания или 14 pt/примерно 18,67 CSS px bold), максимальный уровень AAA 7:1.</p>
<p>Проверить — ввести фактическую пару текста и фона в контрастный анализатор; результат зависит от размера/начертания и не заменяет ручной аудит.</p>
<p>Что ещё важно: все картинки с осмысленным alt, все поля формы связаны с label, кнопки имеют текст (не только иконку), сайтом можно управлять с клавиатуры, target size AA — минимум 24×24 CSS px при применимых условиях и исключениях; 44×44 px можно рекомендовать как более удобную цель, но это не универсальный минимум WCAG AA.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>WCAG</dt><dd>Web Content Accessibility Guidelines — стандарт доступности веб-контента.</dd>
<dt>Контраст</dt><dd>Разница яркости между текстом и фоном.</dd>
<dt>AA / AAA</dt><dd>Уровни соответствия стандарту доступности.</dd>
<dt>Скринридер</dt><dd>Программа, читающая страницу вслух для незрячих.</dd>
<dt>ARIA</dt><dd>Набор атрибутов для описания элементов доступности.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему 4.5:1, а не 3:1 для текста? При 3:1 люди с ослабленным зрением теряют часть символов, особенно на мелком кегле. Почему крупному можно 3:1? У крупных букв больше площадь и форма проще, они различимы при меньшем контрасте. Почему placeholder вместо label — плохо? Он исчезает при вводе, и пользователь забывает, что заполнял.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Контраст — как читать книгу в метро при ярком солнце. Тонкий серый шрифт на белой бумаге — ты напрягаешь глаза и быстро устаёшь. Чёрный на белом — читаешь свободно. Поля формы с label — как подписанные полки на кухне: всегда знаешь, где сахар, а не выдвигаешь все ящики.</p></div>

<text x="50" y="284" fill="#cbd5e1" font-size="10.5" font-family="Arial">☐ управление с клавиатуры   ☐ видимый focus-visible   ☐ focus order   ☐ смысл не только цветом   ☐ target size AA 24×24 CSS px; 44×44 — рекомендация</text>
<text x="50" y="302" fill="#7dd3fc" font-size="10.5" font-weight="700" font-family="Arial">Правило: контраст текста ≥ 4.5:1, крупного ≥ 3:1</text>
</svg><figcaption><b>Рис. 16.1.</b> Четыре варианта одной подписи. Коэффициент рядом — то, что покажет WebAIM Contrast Checker.</figcaption></figure>

<h3>Пример кода</h3>
<pre>/* ✗ Плохо: серый на белом */
.muted { color: #D0D5DD; }   /* значение проверяйте для фактической пары */

/* ✓ Хорошо: тёмно-серый */
.muted { color: #667085; }   /* около 4.97:1 на белом; перепроверьте фактическую пару */</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Серый текст «для элегантности»</strong> — часть посетителей уходит. <strong>Белый текст на жёлтом</strong> — контраст около 1.5:1. <strong>Placeholder вместо label</strong> — ломает доступность и удобство. <strong>Ссылка-иконка 16×16</strong> — по такой цели легко промахнуться.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Проверить все цветовые пары макета</div>
<div class="task-why">Зачем: найти нечитаемые места до того, как их заметят клиенты.</div>
<ol class="steps">
<li>Выпиши 8–10 пар «цвет текста / цвет фона» из макета.</li>
<li>Проверь каждую в WebAIM Contrast Checker.</li>
<li>Отметь те, что ниже 4.5:1.</li>
<li>Исправь, заменив цвет текста на более тёмный.</li>
<li>Для крупного текста допустимо 3:1, но лучше держать 4.5.</li>
<li>Перепроверь все пары после исправления.</li>
</ol>
<div class="task-r">Результат: макет, где весь текст проходит норму AA.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Серый текст «для элегантности».</strong> #999 и светлее обычно не проходит.</li>
<li><strong>Белый текст на жёлтом.</strong> Контраст около 1.5:1.</li>
<li><strong>Placeholder вместо label.</strong> Ломает удобство.</li>
<li><strong>Маленькие кликабельные зоны.</strong> Ссылка 16×16 — промах.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Какой минимальный контраст для обычного текста?</li>
<li>Чем placeholder отличается от label?</li>
<li>Назови три вещи из чек-листа доступности.</li>
<li>Почему доступность влияет на деньги?</li></ol></div>
`}
