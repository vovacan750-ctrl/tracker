{t:"TypeScript: основы",g:"Писать JavaScript так, чтобы ошибки ловились до запуска.",c:`
<h3>Зачем этот урок</h3>
<p><strong>TypeScript</strong> — это JavaScript с типами. Вы заранее описываете, какие данные бывают, и компилятор ловит ошибки <strong>до запуска</strong> кода. В 2025 году TS — стандарт для любого серьёзного проекта: на нём пишут React, Next.js, Vue, Node.js.</p>
<p>Главная выгода: редактор подсказывает методы, ругается на опечатки в именах свойств, не даёт передать строку туда, где ждём число. Ошибки ловятся за секунды, а не за часы отладки.</p>

<h3>Простым языком</h3>
<p>TypeScript — как договор на работе: вы заранее договорились, что функция принимает <code>number</code> и возвращает <code>string</code>. Если кто-то передаст строку — компилятор скажет «нет, по договору число». Это и есть типизация.</p>
<p>TS компилируется в обычный JS — браузер и Node.js не понимают TS напрямую. Компилятор (<code>tsc</code>) переводит TS → JS, попутно проверяя типы. На выходе — чистый JS, который работает везде.</p>

<h3>Базовые типы</h3>
<pre>// Переменные
const name: string = "Анна";
const age: number = 30;
const isActive: boolean = true;
const ids: number[] = [1, 2, 3];
const tuple: [string, number] = ["Анна", 30];

// Функция — типы аргументов и возвращаемого значения
function greet(name: string): string {
  return "Привет, " + name;
}

// Стрелочная функция
const add = (a: number, b: number): number => a + b;

// void — функция ничего не возвращает
function log(message: string): void {
  console.log(message);
}</pre>

<h3>Объекты и интерфейсы</h3>
<pre>// Описываем форму объекта
interface User {
  id: number;
  name: string;
  email?: string;        // ? — необязательное поле
  readonly createdAt: Date;  // readonly — нельзя менять
}

// Используем
const user: User = {
  id: 1,
  name: "Анна",
  createdAt: new Date()
};

// user.id = 2;  ← ошибка: readonly
// user.email → undefined (необязательное)</pre>

<h3>Полезные типы</h3>
<pre>// Union — один из вариантов
type Status = "active" | "inactive" | "banned";
const s: Status = "active";   // только эти 3 значения

// Type vs Interface — почти одинаковое, type гибче
type Point = { x: number; y: number };

// Generic — обобщение
function first&lt;T&gt;(arr: T[]): T | undefined {
  return arr[0];
}
first([1, 2, 3]);        // number
first(["a", "b"]);       // string

// Record — словарь
const prices: Record&lt;string, number&gt; = {
  apple: 50,
  banana: 30
};

// Pick / Omit — выбрать или убрать поля
type UserPreview = Pick&lt;User, "id" | "name"&gt;;
type UserWithoutEmail = Omit&lt;User, "email"&gt;;</pre>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Тип (type)</dt><dd>Описание формы данных: string, number, User.</dd>
<dt>Интерфейс (interface)</dt><dd>Описание формы объекта, можно расширять.</dd>
<dt>Generic</dt><dd>Обобщение: функция работает с любым типом, но согласованно.</dd>
<dt>Union</dt><dd>Объединение типов: <code>"a" | "b" | "c"</code>.</dd>
<dt>Аннотация типа</dt><dd>Явное указание: <code>let x: number</code>.</dd>
<dt>Выведение (inference)</dt><dd>TS сам понял тип из значения: <code>let x = 5</code> → number.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему TS, а не JSDoc? JSDoc в комментариях работает, но TS надёжнее: типы нельзя «забыть обновить». Почему <code>interface</code>, а не <code>type</code>? Interface расширяется (<code>extends</code>) и отображается в подсказках красивее. Почему не указывать типы везде? TS сам выведет многие — пишите типы там, где неоднозначно (аргументы функций, возвращаемые значения).</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>TypeScript — как паспортный контроль в аэропорту: проверяет всё заранее, не пускает с проблемными документами. Дольше на старте — зато внутри страны (в продакшене) нет сюрпризов. JavaScript — как переход границы по удостоверению: быстро, но если ошиблись — выяснится уже в пути.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>any везде</strong> — теряете всю пользу TS. <strong>Не запускать tsc в CI</strong> — типы есть в коде, но никто не проверяет. <strong>Сложные generic ради красоты</strong> — код невозможно читать. <strong>Забыли tsconfig.json</strong> — строгий режим (strict) не включён, типы работают вполсилы.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Перевести функцию на TypeScript</div>
<div class="task-why">Зачем: первый реальный опыт типизации.</div>
<ol class="steps">
<li>Возьми функцию groupByCategory из урока 49 (массивы).</li>
<li>Создай тип Product: { id: number; name: string; price: number; category: string }.</li>
<li>Типизируй функцию: аргумент <code>Product[]</code>, возврат <code>Record&lt;string, Product[]&gt;</code>.</li>
<li>Запусти <code>npx tsc --noEmit</code> — должны быть 0 ошибок.</li>
<li>Попробуй передать строку вместо массива — убедись, что TS ругается.</li>
<li>Включи strict в tsconfig.json, исправь ошибки.</li>
</ol>
<div class="task-r">Результат: первая типизированная функция.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>any как «не знаю тип».</strong> Лучше unknown или правильно типизировать.</li>
<li><strong>Не включать strict.</strong> Половина проверок отключена.</li>
<li><strong>Игнорировать ошибки tsc.</strong> Их можно подавить, но не нужно.</li>
<li><strong>Типы ради типов.</strong> Если тип очевиден — не пишите его.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем TypeScript отличается от JavaScript?</li>
<li>Что такое interface и чем он отличается от type?</li>
<li>Зачем generic?</li>
<li>Что такое union-тип?</li>
<li>Почему any — плохая практика?</li></ol></div>
`},

{t:"TypeScript в React",g:"Типизировать компоненты, props и хуки.",c:`
<h3>Зачем этот урок</h3>
<p>React + TypeScript — стандарт 2025 года. Без типов в React легко передать не тот prop, забыть поле в объекте, перепутать строку и число. С TS редактор подсказывает имена props, аIDE автоматически дополняет. Любой код из документации React сейчас — на TS.</p>

<h3>Простым языком</h3>
<p>Когда вы пишете компонент <code>&lt;Button /&gt;</code>, вы договариваетесь, какие props он принимает: <code>label: string</code>, <code>onClick: () =&gt; void</code>, <code>variant?: "primary" | "ghost"</code>. Если кто-то передаст <code>variant="purple"</code> — TS скажет «такого варианта нет». Это и есть типизация React-компонентов.</p>

<h3>Типизация функционального компонента</h3>
<pre>// Самый частый способ — типизировать props напрямую
function Button({ label, onClick, variant }: ButtonProps) {
  return (
    &lt;button className={variant} onClick={onClick}&gt;
      {label}
    &lt;/button&gt;
  );
}

// Описание props
type ButtonProps = {
  label: string;
  onClick: () =&gt; void;
  variant?: "primary" | "secondary" | "ghost";  // optional
  disabled?: boolean;
};

// Использование
&lt;Button label="Отправить" onClick={handleClick} variant="primary" /&gt;
&lt;Button label="Отмена" onClick={handleCancel} /&gt;  // variant = undefined</pre>

<h3>Children и события</h3>
<pre>import { ReactNode, MouseEvent } from "react";

type CardProps = {
  children: ReactNode;          // любой JSX-контент
  onClick?: (e: MouseEvent&lt;HTMLDivElement&gt;) =&gt; void;
};

function Card({ children, onClick }: CardProps) {
  return &lt;div onClick={onClick}&gt;{children}&lt;/div&gt;;
}</pre>

<h3>Хуки с типами</h3>
<pre>// useState — тип выводится из начального значения
const [count, setCount] = useState(0);           // number
const [name, setName] = useState("");            // string

// Явно, если начальное значение null/undefined
const [user, setUser] = useState&lt;User | null&gt;(null);

// useReducer — типизируем state и action
type State = { count: number };
type Action = { type: "inc" } | { type: "dec" };

function reducer(state: State, action: Action): State {
  switch (action.type) {
    case "inc": return { count: state.count + 1 };
    case "dec": return { count: state.count - 1 };
  }
}</pre>

<h3>Server Components + типы</h3>
<pre>// app/products/page.tsx — серверный компонент
import { Product } from "@/types";

export default async function ProductsPage(): Promise&lt;JSX.Element&gt; {
  const products: Product[] = await getProducts();
  return &lt;ProductList items={products} /&gt;;
}

// types/index.ts — общие типы на проект
export interface Product {
  id: number;
  name: string;
  price: number;
  category: string;
}</pre>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Props-тип</dt><dd>Описание props компонента: type или interface.</dd>
<dt>ReactNode</dt><dd>Любой контент, который можно отрендерить: строка, число, JSX, массив.</dd>
<dt>FC (FunctionComponent)</dt><dd>Устаревший тип для компонентов — сейчас пишут просто функцию.</dd>
<dt>Generic-компонент</dt><dd>Компонент, тип которого зависит от prop: &lt;T,&gt;.</dd>
<dt>Utility-типы React</dt><dd>ComponentProps, PropsWithChildren, FC — встроенные помощники.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему <code>type</code>, а не <code>interface</code> для props? Type компактнее, можно использовать Union. Почему <code>ReactNode</code>, а не <code>any</code> для children? ReactNode даёт автодополнение и проверку. Почему не <code>React.FC</code>? Этот тип раньше добавлял children автоматически — теперь это не нужно, пишут обычную функцию. Почему общие типы в <code>types/index.ts</code>? Переиспользование между компонентами и API.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Типизированный компонент — как товар на полке с ценником и составом: видно, что внутри, сколько стоит, кому подходит. Нетипизированный — как товар без упаковки: попробуй разберись, что это и как использовать. Команда из 5 человек без TS тратит 30% времени на «почему это свойство не существует?».</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Props без типа</strong> — нет автодополнения, опечатки не ловятся. <strong>any в props</strong> — теряете всю пользу TS. <strong>Не типизировать useState с null</strong> — потом <code>user.name</code> ругается, что user может быть null. <strong>Event без типа</strong> — <code>e.target.value</code> не подсказывается. <strong>Смешивать type и interface хаотично</strong> — команда путается.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Типизировать ProductCard</div>
<div class="task-why">Зачем: реальный кейс, который вы будете делать в каждом проекте.</div>
<ol class="steps">
<li>Создай тип Product: id, name, price, oldPrice?, image, category.</li>
<li>Создай компонент ProductCard с props: product: Product, onAddToCart: (id: number) =&gt; void.</li>
<li>Добавь скидку: если oldPrice есть, показывай зачёркнутым.</li>
<li>Создай массив продуктов, отрисуй через map.</li>
<li>Проверь: передай product без image — TS должен ругаться.</li>
<li>Попробуй вызвать onAddToCart("строка") — TS не даст.</li>
</ol>
<div class="task-r">Результат: типизированный каталог на React.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>useState без типа с null.</strong> Всегда указывайте useState&lt;T | null&gt;.</li>
<li><strong>Event без типа.</strong> Используйте MouseEvent, ChangeEvent.</li>
<li><strong>Props без детей.</strong> Если children — типизируйте как ReactNode.</li>
<li><strong>API-ответ без типа.</strong> Создайте тип под ответ сервера.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем type отличается от interface для props?</li>
<li>Что такое ReactNode и зачем?</li>
<li>Как типизировать useState с null?</li>
<li>Почему React.FC устарел?</li>
<li>Где хранить общие типы на проекте?</li></ol></div>
`},

{t:"Vitest: unit-тесты для JS и React",g:"Проверять функции и компоненты автоматически, без ручной работы.",c:`
<h3>Зачем этот урок</h3>
<p>Тесты — это страховка. Каждый раз, когда вы меняете код, тесты прогоняются и говорят: «ты сломал вот это». Без тестов вы ловите баги в продакшене, с тестами — за 5 секунд на своём компьютере. В коммерческой разработке без тестов не берут на работу.</p>
<p><strong>Vitest</strong> — современный фреймворк тестов от создателей Vite. Быстрее Jest, работает с TypeScript из коробки, API почти такой же.</p>

<h3>Простым языком</h3>
<p>Unit-тест — это маленькая проверка одной функции. «Если передать 2 и 3 в <code>add</code>, должно получиться 5». Если получилось — тест зелёный, нет — красный. Когда вы меняете <code>add</code>, тест прогоняется автоматически и сразу показывает, не сломали ли вы.</p>

<h3>Базовый пример</h3>
<pre>// math.ts — функция, которую тестируем
export function add(a: number, b: number): number {
  return a + b;
}

// math.test.ts — тест
import { describe, it, expect } from "vitest";
import { add } from "./math";

describe("add", () =&gt; {
  it("складывает два числа", () =&gt; {
    expect(add(2, 3)).toBe(5);
  });

  it("работает с отрицательными", () =&gt; {
    expect(add(-1, -1)).toBe(-2);
  });

  it("возвращает 0 для 0+0", () =&gt; {
    expect(add(0, 0)).toBe(0);
  });
});</pre>

<h3>Запуск</h3>
<pre># Установка
npm install -D vitest

# Запуск всех тестов
npx vitest

# Запуск в режиме watch (перезапуск при изменениях)
npx vitest --watch</pre>

<h3>Тестирование React-компонентов</h3>
<pre>// Button.test.tsx
import { render, screen } from "@testing-library/react";
import userEvent from "@testing-library/user-event";
import { Button } from "./Button";

it("вызывает onClick при клике", async () =&gt; {
  const onClick = vi.fn();   // mock-функция
  render(&lt;Button label="Отправить" onClick={onClick} /&gt;);

  await userEvent.click(screen.getByText("Отправить"));

  expect(onClick).toHaveBeenCalledTimes(1);
});

it("показывает label", () =&gt; {
  render(&lt;Button label="Сохранить" onClick={() =&gt; {}} /&gt;);
  expect(screen.getByText("Сохранить")).toBeInTheDocument();
});</pre>

<h3>Что проверять тестами</h3>
<table><tr><th>Что</th><th>Пример</th><th>Зачем</th></tr>
<tr><td>Чистые функции</td><td>add, formatPrice, validateEmail</td><td>Просто и быстро</td></tr>
<tr><td>Краевые случаи</td><td>Пустой массив, null, деление на 0</td><td>Где бывают баги</td></tr>
<tr><td>UI компоненты</td><td>Клик по кнопке вызывает callback</td><td>Контракт компонента</td></tr>
<tr><td>Валидацию форм</td><td>Неверный email → ошибка</td><td>Критично для бизнеса</td></tr>
</table>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Unit-тест</dt><dd>Проверка одной функции или компонента изолированно.</dd>
<dt>Integration-тест</dt><dd>Проверка нескольких функций вместе.</dd>
<dt>Mock</dt><dd>Подмена функции фейком для изоляции.</dd>
<dt>Coverage</dt><dd>Покрытие — процент кода, покрытого тестами.</dd>
<dt>Snapshot-тест</dt><dd>Запоминает JSX/HTML и сравнивает при изменениях.</dd>
<dt>describe/it/expect</dt><dd>Блоки организации тестов в Vitest/Jest.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему Vitest, а не Jest? Vitest быстрее, работает с Vite/ESM без настройки, API совместим с Jest. Почему тестируем через <code>screen.getByText</code>, а не через DOM напрямую? Это имитирует поведение пользователя — он ищет по тексту, не по классам. Почему мокаем колбэк, а не вызываем реальный? Изоляция: тестируем только кнопку, а не то, что произойдёт в обработчике.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Тесты — как ремень безопасности: не помогают ехать быстрее, но спасают при аварии. Сначала кажется лишним — потом, когда одна правка ломает 5 мест и тест ловит это за секунду, понимаешь ценность. Опытные разработчики без тестов вообще не работают: «как ты знаешь, что ничего не сломал?».</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Тесты ради coverage</strong> — покрывают 90%, но не проверяют важное. <strong>Тесты с реальным API</strong> — медленные и ломаются, когда сервер недоступен. <strong>Тестируют реализацию, а не поведение</strong> — при рефакторинге все тесты падают. <strong>Один тест на 200 строк</strong> — сложно понять, что сломалось.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Написать 5 тестов для готовой функции</div>
<div class="task-why">Зачем: первый реальный опыт unit-тестирования.</div>
<ol class="steps">
<li>Возьми функцию isValidPhone из урока 53.</li>
<li>Установи Vitest: npm install -D vitest.</li>
<li>Создай isValidPhone.test.ts.</li>
<li>Напиши 5 тестов: корректный номер, без 7 в начале, слишком короткий, с пробелами, пустой.</li>
<li>Запусти npx vitest — все зелёные?</li>
<li>Сломай функцию (измени regex) — убедись, что тесты падают.</li>
</ol>
<div class="task-r">Результат: первая функция с автотестами.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Тесты ради галочки.</strong> Покрытие ≠ качество.</li>
<li><strong>Реальные API в тестах.</strong> Мокайте всё внешнее.</li>
<li><strong>Слишком умные тесты.</strong> Один тест — одно поведение.</li>
<li><strong>Не запускать в CI.</strong> Тесты должны идти автоматически.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем Vitest лучше Jest?</li>
<li>Что такое mock и зачем?</li>
<li>Чем unit отличается от integration-теста?</li>
<li>Почему не стоит вызывать реальный API в тестах?</li>
<li>Что показывает coverage?</li></ol></div>
`},

{t:"Playwright: e2e-тесты для сайта",g:"Проверять ключевые сценарии пользователя автоматически.",c:`
<h3>Зачем этот урок</h3>
<p><strong>End-to-end (e2e) тесты</strong> — это симуляция реального пользователя. Браузер открывается, «кликает» по кнопкам, заполняет формы, переходит между страницами. Если что-то сломалось — вы узнаёте до того, как клиент позвонит с жалобой.</p>
<p><strong>Playwright</strong> — современный фреймворк от Microsoft. Запускает Chrome, Firefox, Safari одновременно, параллельные тесты, отличные ошибки. Vitest проверяет функции, Playwright — весь сайт целиком.</p>

<h3>Простым языком</h3>
<p>Unit-тест проверяет: «функция add(2,3) вернёт 5». E2e-тест проверяет: «пользователь открыл корзину, нажал "Оформить заказ", заполнил форму, нажал "Оплатить" — увидел "Спасибо за заказ"». Это полный сценарий, как делает живой человек.</p>

<h3>Установка и первый тест</h3>
<pre># Установка
npm init playwright@latest

# Создаст playwright.config.ts, tests/, примеры

# Запуск всех тестов
npx playwright test

# Запуск с UI (визуально)
npx playwright test --ui

# Запуск конкретного файла
npx playwright test tests/checkout.spec.ts</pre>

<h3>Пример: тест формы заявки</h3>
<pre>// tests/contact.spec.ts
import { test, expect } from "@playwright/test";

test("пользователь отправляет заявку", async ({ page }) =&gt; {
  // 1. Открываем страницу
  await page.goto("http://localhost:3000/contacts");

  // 2. Заполняем форму
  await page.fill("[name=name]", "Анна");
  await page.fill("[name=phone]", "+79991234567");
  await page.fill("[name=message]", "Хочу заказать сайт");

  // 3. Нажимаем «Отправить»
  await page.click("button[type=submit]");

  // 4. Проверяем, что появился успех
  await expect(page.locator(".success")).toHaveText("Заявка отправлена");
});</pre>

<h3>Пример: тест оформления заказа</h3>
<pre>test("полный цикл покупки", async ({ page }) =&gt; {
  await page.goto("/");

  // Добавляем товар в корзину
  await page.click(".product:first-child .add-to-cart");

  // Переходим в корзину
  await page.click(".go-to-cart");
  await expect(page).toHaveURL(/\/cart/);

  // Оформляем
  await page.click(".checkout-button");

  // Заполняем данные
  await page.fill("[name=email]", "test@example.com");
  await page.fill("[name=address]", "Москва, ул. Тверская, 1");

  // Подтверждаем
  await page.click(".place-order");

  // Проверяем страницу успеха
  await expect(page.locator("h1")).toHaveText("Заказ оформлен");
});</pre>

<h3>Что тестировать e2e</h3>
<table><tr><th>Сценарий</th><th>Зачем</th></tr>
<tr><td>Регистрация и вход</td><td>Без этого ничего не работает</td></tr>
<tr><td>Поиск товара и покупка</td><td>Главный путь пользователя</td></tr>
<tr><td>Оформление заявки с формы</td><td>Лиды — деньги бизнеса</td></tr>
<tr><td>Оплата тестовой картой</td><td>Критичный сценарий</td></tr>
<tr><td>Адаптив на мобиле</td><td>50%+ трафика</td></tr>
</table>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>E2e-тест</dt><dd>End-to-end — проверка всего сценария от начала до конца.</dd>
<dt>Selector</dt><dd>Селектор — как найти элемент: по тексту, role, data-testid.</dd>
<dt>Locator</dt><dd>Playwright-объект для поиска элемента, ленивый.</dd>
<dt>Fixture</dt><dd>Подготовленное окружение: страница, контекст, моки.</dd>
<dt>Trace</dt><dd>Запись всех действий для отладки упавшего теста.</dd>
<dt>Visual regression</dt><dd>Сравнение скриншотов: изменился ли UI.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему Playwright, а не Cypress? Playwright быстрее, поддерживает все браузеры, лучше работает с параллельными тестами. Почему <code>data-testid</code>, а не классы? Классы меняются при рефакторинге CSS — тесты ломаются. Почему <code>page.goto</code> и <code>page.click</code> выглядят синхронно? Playwright сам делает await под капотом — код читаемый.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>E2e-тесты — как охранник, который раз в час обходит здание и проверяет все двери. Не заменяет программиста, но если кто-то оставил открытой дверь — сообщит. Unit-тесты проверяют замки на дверях, e2e — что вся система безопасности работает вместе.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Тестировать каждый чих</strong> — тесты идут 30 минут, никто не запускает. <strong>CSS-селекторы вместо data-testid</strong> — сломалось при ребрендинге. <strong>Реальная база данных в тестах</strong> — тесты мутируют продакшен. <strong>Не закрывать браузеры</strong> — утечка памяти, тесты падают. <strong>Один тест = много шагов</strong> — непонятно, где упало.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Написать e2e-тест для формы</div>
<div class="task-why">Зачем: первый реальный опыт e2e-тестирования.</div>
<ol class="steps">
<li>Установи Playwright: npm init playwright@latest.</li>
<li>Открой свой проект лендинга из урока 62 локально.</li>
<li>Создай tests/contact.spec.ts.</li>
<li>Напиши тест: открытие → заполнение формы → отправка → проверка успеха.</li>
<li>Запусти npx playwright test --ui — посмотри визуально.</li>
<li>Сломай форму (удали поле) — убедись, что тест падает.</li>
</ol>
<div class="task-r">Результат: первый e2e-тест на реальном проекте.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>CSS-селекторы.</strong> Используйте data-testid.</li>
<li><strong>Тесты без await.</strong> Playwright требует await.</li>
<li><strong>Реальные данные.</strong> Используйте тестовую базу.</li>
<li><strong>Длинные тесты.</strong> Один тест = один сценарий.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем e2e отличается от unit-теста?</li>
<li>Почему Playwright, а не Cypress?</li>
<li>Зачем data-testid вместо классов?</li>
<li>Что такое trace и когда использовать?</li>
<li>Какие сценарии обязательно покрывать e2e?</li></ol></div>
`},

{t:"Telegram Mini Apps: веб-приложения в Telegram",g:"Создавать полноценные веб-приложения внутри Telegram.",c:`
<h3>Зачем этот урок</h3>
<p><strong>Telegram Mini Apps (TMA)</strong> — это веб-страницы, которые открываются прямо внутри Telegram. Пользователь не уходит из мессенджера, не устанавливает приложение. Один клик по кнопке бота — открылся ваш сайт в виде «приложения».</p>
<p>В 2025 году TMA — огромный тренд в РФ: после блокировок западных сервисов аудитория Telegram выросла до 90 млн человек в России. Мини-аппы делают магазины, каталоги, CRM, игры, сервисы записи.</p>

<h3>Простым языком</h3>
<p>TMA — это обычный ваш сайт, который Telegram открывает в WebView (встроенном браузере). Сайту доступны данные пользователя (имя, username), тема Telegram (тёмная/светлая), кнопка «Назад», оплата. Похоже на PWA, но внутри Telegram.</p>

<h3>Что нужно для TMA</h3>
<ol>
<li><strong>Бот в BotFather</strong> — создаёте бота, получаете токен.</li>
<li><strong>Веб-приложение</strong> — обычный сайт (React/Vue/vanilla JS), где-то хостится.</li>
<li><strong>Web App URL</strong> — в BotFather указываете URL вашего сайта.</li>
<li><strong>Кнопка запуска</strong> — пользователь жмёт кнопку в боте → открывается ваш сайт.</li>
</ol>

<h3>Доступ к данным пользователя</h3>
<pre>// Подключаем SDK
&lt;script src="https://telegram.org/js/telegram-web-app.js"&gt;&lt;/script&gt;

&lt;script&gt;
const tg = window.Telegram.WebApp;

// Данные пользователя (после init)
const user = tg.initDataUnsafe?.user;
console.log(user?.first_name);   // "Анна"
console.log(user?.username);     // "anna_dev"
console.log(user?.id);           // 123456789

// Тема Telegram — подстраиваемся автоматически
console.log(tg.colorScheme);     // "light" | "dark"

// Главная кнопка внизу экрана
tg.MainButton.setText("Отправить заявку");
tg.MainButton.show();
tg.MainButton.onClick(() =&gt; {
  tg.sendData(JSON.stringify({ name: "Анна", phone: "+79991234567" }));
});

// Кнопка «Назад» (мобильные)
tg.BackButton.show();
tg.BackButton.onClick(() =&gt; history.back());

// Закрыть приложение
tg.close();
&lt;/script&gt;</pre>

<h3>Пример: мини-апп каталога товаров</h3>
<pre>// React-компонент
import { useEffect } from "react";
import WebApp from "@twa-dev/sdk";

export default function Catalog() {
  useEffect(() =&gt; {
    WebApp.MainButton.setText("Купить");
    WebApp.MainButton.show();
    WebApp.MainButton.onClick(() =&gt; {
      WebApp.sendData(JSON.stringify({
        productId: 42,
        userId: WebApp.initDataUnsafe?.user?.id
      }));
    });
  }, []);

  return (
    &lt;div&gt;
      &lt;h1&gt;Каталог&lt;/h1&gt;
      &lt;ProductCard /&gt;
    &lt;/div&gt;
  );
}</pre>

<h3>Когда TMA подходит, а когда нет</h3>
<table><tr><th>Подходит</th><th>Не подходит</th></tr>
<tr><td>Каталоги, заказы, запись</td><td>Сложные приложения с heavy-графикой</td></tr>
<tr><td>CRM и формы для менеджеров</td><td>Сайты с большим контентом для чтения</td></tr>
<tr><td>Промо-акции, игры</td><td>Когда нужна SEO-видимость</td></tr>
<tr><td>Допродажа внутри Telegram-канала</td><td>Когда важна аутентификация вне Telegram</td></tr>
</table>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Mini App / TMA</dt><dd>Telegram Mini App — веб-приложение внутри Telegram.</dd>
<dt>BotFather</dt><dd>Официальный бот Telegram для создания других ботов.</dd>
<dt>WebApp</dt><dd>Объект window.Telegram.WebApp — мост между сайтом и Telegram.</dd>
<dt>initData</dt><dd>Подписанные данные пользователя — нельзя подделать.</dd>
<dt>MainButton</dt><dd>Главная кнопка внизу экрана — главная CTA.</dd>
<dt>BackButton</dt><dd>Кнопка «Назад» в шапке Telegram на мобильных.</dd>
<dt>TMA SDK</dt><dd>Библиотека @twa-dev/sdk для удобной работы с WebApp.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему TMA, а не отдельный сайт? Аудитория уже в Telegram, не нужно регистрировать — пользователь авторизован в мессенджере. Почему <code>sendData</code>, а не fetch? <code>sendData</code> отправляет данные боту в подписанном виде, нельзя подделать. Почему MainButton, а не своя кнопка на странице? MainButton — нативная, всегда видна, нажимается удобно на мобиле.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>TMA — как киоск в торговом центре: не нужно вести клиента в свой магазин через весь город. Клиент уже в Telegram — открыл ваш мини-апп в 2 клика, сделал заказ, закрыл. Без установки, без регистрации, без перехода в браузер. Идеально для импульсивных покупок и B2C-сервисов.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>

<h3>Зачем этот урок</h3>
<p><strong>PWA (Progressive Web App)</strong> — это сайт, который пользователь может «установить» как приложение. На телефоне появляется иконка на рабочем столе, открывается без адресной строки, работает офлайн. Без App Store и Google Play — без проверок и комиссии 30%.</p>
<p>В 2025 году PWA — стандарт для лендингов, магазинов, CRM. Twitter Lite, Pinterest, Starbucks, Telegram Web — все это PWA. Особенно актуально для РФ: после блокировок Google Play многие российские приложения уходят в PWA.</p>

<h3>Простым языком</h3>
<p>PWA — это ваш сайт + два файла: <code>manifest.json</code> (описание приложения) и <code>service-worker.js</code> (офлайн-кэш). Когда пользователь заходит на сайт, браузер предлагает «Установить». После установки — открывается как обычное приложение, без адресной строки, с иконкой на рабочем столе.</p>

<h3>manifest.json — описание приложения</h3>
<pre>{
  "name": "Школа веб-разработки",
  "short_name": "Школа",
  "description": "Обучение созданию сайтов с нуля",
  "start_url": "/",
  "display": "standalone",          // без адресной строки
  "background_color": "#1a1d23",
  "theme_color": "#6b73e8",
  "orientation": "portrait-primary",
  "icons": [
    {
      "src": "/icons/icon-192.png",
      "sizes": "192x192",
      "type": "image/png",
      "purpose": "any maskable"
    },
    {
      "src": "/icons/icon-512.png",
      "sizes": "512x512",
      "type": "image/png"
    }
  ]
}</pre>

<h3>Подключение в HTML</h3>
<pre>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;link rel="manifest" href="/manifest.json"&gt;
  &lt;meta name="theme-color" content="#6b73e8"&gt;
  &lt;link rel="apple-touch-icon" href="/icons/icon-192.png"&gt;
  &lt;meta name="apple-mobile-web-app-capable" content="yes"&gt;
  &lt;meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"&gt;
&lt;/head&gt;
&lt;body&gt;...&lt;/body&gt;
&lt;/html&gt;</pre>

<h3>Service Worker — офлайн-кэш</h3>
<pre>// sw.js — регистрируется в основном JS
const CACHE = "v1";
const ASSETS = [
  "/",
  "/index.html",
  "/assets/styles.css",
  "/assets/app.js",
  "/data/lessons.json",
  "/icons/icon-192.png"
];

// Установка — кэшируем базовые файлы
self.addEventListener("install", (e) =&gt; {
  e.waitUntil(
    caches.open(CACHE).then(c =&gt; c.addAll(ASSETS))
  );
});

// Активация — чистим старый кэш
self.addEventListener("activate", (e) =&gt; {
  e.waitUntil(
    caches.keys().then(keys =&gt;
      Promise.all(keys.filter(k =&gt; k !== CACHE).map(k =&gt; caches.delete(k)))
    )
  );
});

// Запрос — сначала кэш, потом сеть
self.addEventListener("fetch", (e) =&gt; {
  e.respondWith(
    caches.match(e.request).then(cached =&gt;
      cached || fetch(e.request).then(res =&gt; {
        // кэшируем новые запросы
        const clone = res.clone();
        caches.open(CACHE).then(c =&gt; c.put(e.request, clone));
        return res;
      }).catch(() =&gt; caches.match("/offline.html"))
    )
  );
});</pre>

<h3>Регистрация SW в основном JS</h3>
<pre>// app.js
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () =&gt; {
    navigator.serviceWorker.register("/sw.js")
      .then(reg =&gt; console.log("SW зарегистрирован", reg))
      .catch(err =&gt; console.error("SW не зарегистрирован", err));
  });
}</pre>

<h3>Что даёт PWA пользователю</h3>
<table><tr><th>Фича</th><th>Без PWA</th><th>С PWA</th></tr>
<tr><td>Иконка на рабочем столе</td><td>Нет</td><td>Есть</td></tr>
<tr><td>Запуск без браузера</td><td>Нет</td><td>Да (отдельное окно)</td></tr>
<tr><td>Работа офлайн</td><td>Нет</td><td>Да (кэш)</td></tr>
<tr><td>Push-уведомления</td><td>Нет</td><td>Да</td></tr>
<tr><td>Установка без App Store</td><td>—</td><td>Да</td></tr>
</table>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Manifest</dt><dd>JSON-файл с описанием приложения: иконки, имя, цвет.</dd>
<dt>Service Worker</dt><dd>JS-файл, который работает в фоне, управляет кэшем и push.</dd>
<dt>Installable</dt><dd>Сайт, который браузер предлагает установить.</dd>
<dt>Standalone</dt><dd>Режим без адресной строки — выглядит как приложение.</dd>
<dt>Maskable icon</dt><dd>Иконка, которую Android обрезает под любую форму.</dd>
<dt>Lighthouse PWA</dt><dd>Аудит PWA-готовности в Chrome DevTools.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему PWA, а не нативное приложение? Не нужно проходить проверку App Store (недели), нет комиссии 30%, один код для всех платформ. Почему <code>display: standalone</code>? Без адресной строки сайт выглядит как приложение. Почему кэш «сначала кэш, потом сеть»? Для офлайн — мгновенная отдача. Почему версия кэша <code>v1</code>? При обновлении CSS/JS — повышаете версию, старый кэш чистится автоматически.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>PWA — как визитка, которую можно превратить в бейдж: одна сторона — сайт в браузере, перевернули — приложение на рабочем столе. Для пользователя — меньше возни с установкой. Для бизнеса — меньше барьер: не нужно идти в App Store, платить 30%, ждать проверку.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Забыть maskable icon</strong> — на Android иконка обрезается непредсказуемо. <strong>Не обновлять версию кэша</strong> — пользователи видят старую версию после деплоя. <strong>Кэшировать всё подряд</strong> — раздувается размер, нет места. <strong>Не делать offline.html</strong> — при офлайме белая страница. <strong>SW на localhost, не на https</strong> — не работает в продакшене.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Превратить свой сайт в PWA</div>
<div class="task-why">Зачем: реальный кейс, который можно показать в портфолио.</div>
<ol class="steps">
<li>Возьми свой сайт-портфолио или лендинг.</li>
<li>Создай manifest.json с именем, иконками, цветом.</li>
<li>Подключи &lt;link rel="manifest"&gt; в index.html.</li>
<li>Создай sw.js с кэшированием базовых файлов.</li>
<li>Зарегистрируй SW в основном JS.</li>

<li>Протестируй в Chrome DevTools → Application → Manifest.</li>
<li>Открой на телефоне, нажми «Установить».</li>
</ol>
<div class="task-r">Результат: устанавливаемое веб-приложение.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Без maskable icon.</strong> На Android иконка кривая.</li>
<li><strong>Не повышать версию кэша.</strong> Старая версия у пользователей.</li>
<li><strong>SW без https.</strong> В продакшене не работает.</li>
<li><strong>Кэшировать API-ответы.</strong> Данные станут устаревшими.</li>
</ul></div>

<li>Чем PWA лучше нативного приложения?</li></ol></div>
