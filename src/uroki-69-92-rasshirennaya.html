<p><strong>Купон без лимита использований</strong> — viral-утечка прибыли. <strong>Скидка поверх скидки</strong> — продаёте в минус. <strong>Купон без минимальной суммы</strong> — скидка на заказ 200 ₽. <strong>Не отключили истёкший промокод</strong> — продолжает работать.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Создать три купона</div>
<div class="task-why">Зачем: понять механику, не потеряв деньги.</div>
<ol class="steps">
<li>Создай 3 купона: процентный, фиксированный, бесплатная доставка.</li>
<li>Каждому задай ограничения (сумма, срок, лимит).</li>
<li>Проверь: купон 10% работает, но не суммируется с распродажей?</li>
<li>Для категории «Зима» выбери sale price для товаров, массовое редактирование или расширение category-based discount; проверь формулу и период действия.</li>
<li>Проверь: ограничение суммы реализовано выбранным купоном/расширением и корректно проверяется?</li>
</ol>
<div class="task-r">Результат: рабочие акции с защитой прибыли.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Купон без лимита.</strong> Убыток.</li>
<li><strong>Суммирование с распродажами.</strong> Убыток.</li>
<li><strong>Нет срока.</strong> Годом позже всплывёт.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Назови три типа купонов.</li>
<li>Какие ограничения обязательны?</li>
<li>Зачем лимит использований?</li>
<li>Как сделать распродажу категории?</li></ol></div>
`},

{t:"Email-уведомления",g:"Настроить письма, которые не падают в спам.",c:`
<h3>Зачем этот урок</h3>
<p>WooCommerce отправляет письма клиенту и админу. WooCommerce использует <code>wp_mail()</code>, который работает через настроенный PHPMailer-транспорт; успешный возврат не означает доставку. SMTP/API, DNS-аутентификация, bounce и логи зависят от провайдера; проверь документацию версии на дату публикации. Решение — <strong>SMTP</strong>.</p>
<p>Потерянное письмо = потерянный заказ.</p>

<h3>Простым языком</h3>
<p>Состав уведомлений зависит от включённых email-настроек, статусов и расширений. Трекинг требует статуса/интеграции/расширения и не является универсальным стандартным письмом.</p>
<p>Настройка: WP Mail SMTP + Яндекс 360 / SendGrid.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>SMTP</dt><dd>Протокол отправки почты.</dd>
<dt>Уведомление</dt><dd>Письмо о событии.</dd>
<dt>Шаблон письма</dt><dd>Оформление письма.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему SMTP? Письма через mail() идут без подписи SPF/DKIM и попадают в спам. Почему трек в письме? Клиент пишет «где заказ?», если не получил трек. Почему шаблон по умолчанию плох? Выглядит как спам и вызывает недоверие.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>SMTP — как отправка письма через почтовую службу с подписью: доходит. mail() — как письмо без обратного адреса: часто теряется. Шаблон — как фирменный бланк: красиво и узнаваемо.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Письма через wp_mail</strong> — Gmail кладёт в спам. <strong>Не настроены SPF/DKIM/DMARC</strong> — письма подменяют. <strong>Один шаблон для всех статусов</strong> — клиент не понимает, что произошло. <strong>Не отправлено «заказ в обработке»</strong> — клиент пишет снова и снова.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Настроить SMTP и шаблоны</div>
<div class="task-why">Зачем: потерянное письмо = потерянный заказ.</div>
<ol class="steps">
<li>Установи WP Mail SMTP, подключи Яндекс 360 или SendGrid.</li>
<li>Отправь тестовое письмо — проверь, что не в спаме.</li>
<li>Кастомизируй шаблон: логотип, контакты, текст.</li>
<li>Если используется интеграция трекинга, настрой её и проверь передачу номера, ошибки и повторную отправку.</li>
<li>Сделай тестовый заказ и проверь все письма.</li>
</ol>
<div class="task-r">Результат: надёжная email-доставка.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Не настроен SMTP.</strong> Письма в спаме.</li>
<li><strong>Нет трека.</strong> «Где заказ?»</li>
<li><strong>Шаблон по умолчанию.</strong> Как спам.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Зачем SMTP?</li>
<li>Какие письма обязательны?</li>
<li>Что должно быть в письме «Отправлен»?</li>
<li>Как проверить, что письмо не в спаме?</li></ol></div>
`},

{t:"Личный кабинет пользователя",g:"Дать покупателю управление заказами и данными.",c:`
<h3>Зачем этот урок</h3>
<p>Личный кабинет — один из интерфейсов управления заказами, адресами и данными; часть действий зависит от гостевой покупки и настроек аккаунтов. Чем меньше он туда заходит, тем лучше, но кабинет должен быть удобным.</p>
<p>Гостевая покупка разрешена — обязательная регистрация отпугивает.</p>

<h3>Простым языком</h3>
<p>Шорткод: <code>[woocommerce_my_account]</code>.</p>
<p>Что проверить в первую очередь: восстановление пароля и смену пароля.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Личный кабинет</dt><dd>Раздел управления аккаунтом.</dd>
<dt>Заказ</dt><dd>Оформленная покупка.</dd>
<dt>Статус заказа</dt><dd>Этап выполнения.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему разрешать гостевую покупку? Обязательная регистрация отпугивает покупателей. Почему проверять восстановление пароля? Если оно не работает, пользователи не смогут войти. Почему адаптировать? Многие заходят с телефона.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Личный кабинет — как кабинет на почте: заходишь, проверяешь посылки, меняешь адрес. Гостевая покупка — как отправка без регистрации: быстро и без барьеров. Восстановление пароля — как забытый ключ: должен быть способ попасть внутрь.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Privacy/152-ФЗ</strong>: состав данных, основание, согласия, уведомления и хранение зависят от сценария; это не юридическая консультация — сверяй нормы с юристом и актуальным провайдером. <strong>Слабый пароль без лимита попыток</strong> — взлом перебором. <strong>История заказов недоступна</strong> — звонки в поддержку. <strong>Гость не может стать клиентом после оплаты</strong> — теряем данные для повторных продаж.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Пройти полный цикл</div>
<div class="task-why">Зачем: проверить кабинет глазами покупателя.</div>
<ol class="steps">
<li>Пройти цикл: регистрация → заказ → просмотр в кабинете.</li>
<li>Настрой «Забыли пароль» и смену пароля.</li>
<li>Добавь блок «Избранное».</li>
<li>Проверь кабинет на телефоне.</li>
<li>Сделай заказ гостем — убедись, что не требует регистрации.</li>
</ol>
<div class="task-r">Результат: удобный кабинет и работающая гостевая покупка.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Обязательная регистрация.</strong> Отпугивает.</li>
<li><strong>Нет статусов заказов.</strong> Непонятно.</li>
<li><strong>Кабинет не адаптирован.</strong> Неудобно.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Что должно быть в личном кабинете?</li>
<li>Зачем гостевую покупку?</li>
<li>Как проверить восстановление пароля?</li>
<li>Почему кабинет адаптируют?</li></ol></div>
`},

{t:"Чеки и фискализация (54-ФЗ)",g:"Выдавать чеки законно.",c:`
<h3>Зачем этот урок</h3>
<div class="note"><strong>Оговорка:</strong> это учебный материал, а не юридическая или налоговая консультация. Нормы 54-ФЗ, НДС, состав чека и обязанности участников нужно сверять с юристом/бухгалтером и актуальным провайдером на дату запуска.</div>
<p>Обязанность применять ККТ и выдавать чек зависит от вида расчёта, статуса продавца, исключений и актуальной редакции 54-ФЗ. Проверь модель бизнеса с юристом/бухгалтером и выбранным оператором/провайдером; этот материал не является юридической консультацией. Если ККТ нужна, потребуется согласованный кассовый контур и интеграция.</p>
<p>Отсутствие требуемой по конкретной модели фискализации может нарушать 54-ФЗ; применимость проверяется до запуска с юристом/бухгалтером.</p>

<h3>Простым языком</h3>
<p>Платёж проходит через онлайн-кассу, данные уходят в ОФД и ФНС, покупатель получает чек.</p>
<p>Настраивают фискальные признаки: ставка НДС, предмет расчёта, способ расчёта.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>54-ФЗ</dt><dd>Закон о кассовой технике.</dd>
<dt>ОФД</dt><dd>Оператор фискальных данных.</dd>
<dt>Фискальный признак</dt><dd>Данные чека.</dd>
<dt>Фискальный накопитель</dt><dd>Устройство в кассе.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Кто формирует чек, регистрирует ККТ, передаёт данные в ОФД и направляет электронный чек, зависит от выбранной схемы и провайдера; сверяй это с актуальной документацией и юристом/бухгалтером. Почему неверная ставка? Расхождение с учётом и проблемы с налоговой.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Онлайн-касса — как кассовый аппарат: бьёт чек. ОФД — как передача данных о продаже в налоговую: без неё чек не считается. Фискальный признак — как номер чека: по нему налоговая проверяет продажу.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Нарушение требований ККТ</strong> — санкции зависят от состава нарушения и статуса лица; одну фиксированную сумму использовать нельзя. <strong>Чек не отправлен в ОФД</strong> — повторный штраф. <strong>Неверный предмет расчёта</strong> — расхождение с отчётностью. <strong>Возврат без чека возврата</strong> — налоговая разбирается.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Подключить фискализацию</div>
<div class="task-why">Зачем: законность. Санкции зависят от состава нарушения и статуса лица; сумму и обязанность проверь по актуальной норме с юристом/бухгалтером.</div>
<ol class="steps">
<li>Изучи требования 54-ФЗ к онлайн-кассам.</li>
<li>Выбери сервис онлайн-кассы (ЮKassa Касса, CloudPayments, АТОЛ Онлайн) и ОФД (Эвотор ОФД, Такском).</li>
<li>Настрой фискальные признаки: ставка, предмет, способ расчёта.</li>
<li>Интегрируй с WooCommerce.</li>
<li>Сделай тестовый заказ — проверь, что чек пришёл на email.</li>
</ol>
<div class="task-r">Результат: легальная выдача чеков.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Магазин без фискализации.</strong> Штрафы.</li>
<li><strong>Неверная ставка НДС.</strong> Расхождение.</li>
<li><strong>Чек не приходит.</strong> Жалоба в налоговую.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Зачем онлайн-касса?</li>
<li>Что такое ОФД?</li>
<li>Какие фискальные признаки настраивают?</li>
<li>Кто отвечает за выдачу чека?</li></ol></div>
`},

{t:"Кастомизация шаблонов WooCommerce",g:"Менять карточку товара и чекаут под дизайн.",c:`
<h3>Зачем этот урок</h3>
<p>WooCommerce позволяет переопределить <strong>любой</strong> шаблон: скопируй файл из плагина в свою тему и правь. Хуки позволяют добавлять/убирать блоки без копирования файлов.</p>
<p>Хуки предпочтительнее копирования: обновление плагина не сломает правки.</p>

<h3>Простым языком</h3>
<p>Приоритет 35 лишь задаёт порядок относительно зарегистрированных callbacks; точное место зависит от темы, хуков и Blocks и не гарантирует «сразу после кнопки».</p>
<p>Своё поле чекаута в legacy shortcode: хук <code>woocommerce_after_order_notes</code>; Checkout Block использует отдельный API. Сохраняй через CRUD API заказа, а не устаревающее прямое обновление post meta.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Переопределение шаблона</dt><dd>Копирование файла из плагина в тему.</dd>
<dt>Хук</dt><dd>Точка вставки своего кода.</dd>
<dt>sanitize_text_field</dt><dd>Очистка текстовых данных.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему хук лучше копирования? Обновление плагина не удалит правки. Почему приоритет 35? Это только порядок относительно зарегистрированных callbacks, а точное место зависит от темы/хуков/Blocks. Для многострочного комментария используй sanitize_textarea_field(), валидируй смысл и экранируй при каждом выводе; nonce защищает отдельную форму, а Checkout Block требует отдельного API.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Хук — как крючок на стене: повесил что нужно, стену не трогал. Переопределение файла — как перекраска самой стены: обновление (ремонт) смоет твою работу. Sanitize — как проверка текста перед наклейкой: убедиться, что не спрятан вредоносный код.</p></div>

<h3>Пример кода</h3>
<pre>// Текст под ценой
add_action('woocommerce_single_product_summary', function () {
  echo '<p class="note">Доставка 1–3 дня</p>';
}, 35);

// Убрать вкладку «Отзывы»
add_filter('woocommerce_product_tabs', function ($tabs) {
  unset($tabs['reviews']);
  return $tabs;
});

// Своё поле в чекауте
add_action('woocommerce_after_order_notes', function () {
  wp_nonce_field('save_order_comment', 'order_comment_nonce');
  echo '<p><label for="order_comment">Комментарий</label><textarea id="order_comment" name="order_comment"></textarea></p>';
});

// Сохранить через CRUD API legacy checkout
add_action('woocommerce_checkout_create_order', function ($order, $data) {
  if (empty($_POST['order_comment']) || empty($_POST['order_comment_nonce']) ||
      !wp_verify_nonce(wp_unslash($_POST['order_comment_nonce']), 'save_order_comment')) return;
  $comment = sanitize_textarea_field(wp_unslash($_POST['order_comment']));
  if ($comment !== '') $order->update_meta_data('_order_comment', $comment);
}, 10, 2);</pre>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Правка файлов плагина</strong> — обновление снесёт всё. <strong>Неверный приоритет</strong> — блок не там. <strong>Забыли sanitize</strong> — XSS.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Кастомизировать карточку и чекаут</div>
<div class="task-why">Зачем: стандартный WooCommerce выглядит шаблонно.</div>
<ol class="steps">
<li>Добавь блок «Доставка 1–3 дня» под цену через хук.</li>
<li>Добавь поле «Комментарий к заказу» и сохрани в мета заказа.</li>
<li>Убери вкладку «Отзывы», если не нужна.</li>
<li>Переопредели content-single-product.php в своей теме.</li>
<li>Проверь: всё работает после обновления WooCommerce?</li>
</ol>
<div class="task-r">Результат: магазин с индивидуальной карточкой.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Правка плагина.</strong> Обновление снесёт.</li>
<li><strong>Неверный приоритет.</strong> Не там.</li>
<li><strong>Забыли sanitize.</strong> XSS.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Чем хук лучше копирования файла?</li>
<li>Что означает приоритет 35?</li>
<li>Как сохранить своё поле чекаута?</li>
<li>Зачем sanitize_text_field?</li></ol></div>
`},

{t:"Импорт/экспорт товаров",g:"Залить каталог из CSV и выгрузить заказы.",c:`
<h3>Зачем этот урок</h3>
<p>Ручное добавление 500 товаров — дни работы. <strong>CSV-импорт</strong> делает это за минуты. Главное — правильно подготовить файл.</p>
<p>SKU может использоваться для сопоставления при включённой опции Update existing products; проверь уникальность SKU, режим импорта и отчёт. Без этой опции возможны пропуски/ошибки или иное поведение.</p>

<h3>Простым языком</h3>
<p>CSV в кодировке UTF-8 — иначе русский текст превратится в кракозябры.</p>
<p>Категории разделяются запятыми, иерархия — через &gt; (например «Одежда &gt; Футболки»). Картинки — через запятую с CSV-quoting/escaping; URL должны быть доступны для скачивания во время импорта.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>CSV</dt><dd>Формат табличных данных.</dd>
<dt>SKU</dt><dd>Артикул для сопоставления.</dd>
<dt>Импорт</dt><dd>Загрузка данных в магазин.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему SKU? По нему товары сопоставляются при повторном импорте и не дублируются. Почему UTF-8? Windows-1251 даёт кракозябры. Почему экспорт заказов? Для бухгалтерии и анализа.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>CSV — как прайс-лист в Excel: стандартный формат, понятный любой программе. SKU — как штрихкод: по нему находишь тот же товар. UTF-8 — как общий язык: без него сосед не поймёт твой текст.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>CSV не в UTF-8</strong> — кракозябры. <strong>Категории через / вместо &gt;</strong> — не создаются. <strong>Импорт без SKU</strong> — дубли при повторе. <strong>Не выгружены картинки</strong> — каталог без фото.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Импортировать каталог</div>
<div class="task-why">Зачем: навык, экономящий дни на реальных проектах.</div>
<ol class="steps">
<li>Подготовь CSV с 50 товарами (UTF-8).</li>
<li>Импортируй через Товары → Импорт.</li>
<li>Проверь: категории, цены, картинки, атрибуты подтянулись?</li>
<li>Экспортируй заказы за месяц в CSV для бухгалтерии.</li>
<li>Включи Update existing products, сделай бэкап, проверь уникальность SKU и прочитай import report после повторного импорта.</li>
</ol>
<div class="task-r">Результат: быстрый импорт и выгрузка данных.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>CSV в Windows-1251.</strong> Кракозябры.</li>
<li><strong>Нет колонки sku.</strong> Дубли.</li>
<li><strong>Картинки по относительным путям.</strong> Нужны URL.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Зачем колонка sku?</li>
<li>В какой кодировке сохранять CSV?</li>
<li>Как разделяются категории и картинки?</li>
<li>Как избежать дублей при повторном импорте?</li></ol></div>
`},

{t:"Проект: интернет-магазин под ключ",g:"Собрать всё из Главы 7 в работающий магазин.",c:`
<h3>Зачем этот урок</h3>
<p>Полноценный магазин: дизайн → тема → каталог → корзина → оплата → доставка → чеки → письма → выгрузка. После этого проекта вы можете брать заказы на магазины.</p>
<p>Это проект, за который платят больше всего.</p>

<h3>Полный цикл заказа</h3>
<ol>
<li>Товар → Купить</li>
<li>Корзина</li>
<li>Чекаут</li>
<li>Оплата</li>
<li>Чек</li>
<li>CRM + Доставка</li>
</ol>

<h3>Чек-лист проекта</h3>
<ul>
<li>Своя тема + WooCommerce, переопределённые шаблоны</li>
<li>Каталог: 4 категории, 40+ товаров, 5 вариативных</li>
<li>Фильтры: категория, цена, атрибут</li>
<li>Чекаут в 6 полей, гостевая покупка</li>
<li>Оплата: ЮKassa (тест) + наличные при получении</li>
<li>Фискализация чеков (54-ФЗ)</li>
<li>Доставка: 3 зоны + СДЭК с ПВЗ</li>
<li>Email через SMTP, кастомные шаблоны</li>
<li>Личный кабинет с заказами</li>
<li>Импорт каталога из CSV</li>
<li>Lighthouse/Core Web Vitals с зафиксированным протоколом измерения; без универсального порога</li>
</ul>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Проект</dt><dd>Полный цикл создания магазина.</dd>
<dt>Критерий приёмки</dt><dd>Условия сдачи проекта.</dd>
<dt>Деплой</dt><dd>Размещение на сервере.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему своя тема? Клиент должен управлять контентом, а магазин — быстро работать. Почему проверять полный цикл? Ошибка на любом шаге обнуляет все остальные. Почему тестовый режим оплаты? Проверить оплату до реальных денег.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Магазин — как супермаркет: каталог (полки), корзина (тележки), чекаут (кассы), оплата (терминал), доставка (курьер). Полный цикл — как покупка от входа до выхода: если хоть один шаг сломан, покупатель уйдёт.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Не протестировали цикл «корзина → оплата → чек → доставка»</strong> — первые клиенты встретят баг. <strong>Сдали без тестового режима оплаты</strong> — реальные деньги падают в никуда. <strong>Не настроили требуемую фискализацию</strong> — правовые и финансовые риски зависят от модели бизнеса и состава нарушения; проверь 54-ФЗ с юристом/бухгалтером и провайдером. <strong>Каталог без фильтров</strong> — покупатель не находит товар.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Собрать магазин по чек-листу</div>
<div class="task-why">Зачем: это проект, за который платят больше всего.</div>
<ol class="steps">
<li>Создай тему и переопредели шаблоны WooCommerce.</li>
<li>Наполни каталог: 40 товаров, 5 вариативных, фильтры.</li>
<li>Настрой чекаут в 6 полей + гостевая покупка.</li>
<li>Подключи ЮKassa в тестовом режиме.</li>
<li>Настрой фискализацию чеков.</li>
<li>Настрой 3 зоны доставки + СДЭК с ПВЗ.</li>
<li>Настрой SMTP и кастомные письма.</li>
<li>Настрой личный кабинет с заказами.</li>
<li>Импортируй каталог из CSV.</li>
<li>Зафиксируй Lighthouse/Core Web Vitals до и после с описанием устройства, региона и страницы; порог и критерии согласуй с проектом, не считай метрику гарантией.</li>
<li>Проверь весь цикл на телефоне.</li>
</ol>
<div class="task-r">Результат: работающий магазин — самый дорогой тип проекта в портфолио.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Не проверили оплату в тесте.</strong> Потеряете заказы.</li>
<li><strong>Нет фискализации.</strong> Штрафы клиенту.</li>
<li><strong>Каталог без фильтров.</strong> Покупатель не находит.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Назови core-критерии приёмки и выбранные интеграции; обязательность элементов зависит от бизнес-модели.</li>
<li>Какой цикл нужно проверить перед сдачей?</li>
<li>Зачем тестовый режим оплаты?</li>
<li>Что показывают критерии приёмки?</li></ol></div>
`}
