{t:"ТЗ, смета и оценка часов",g:"Превратить бриф в план работ и цену.",c:`
<h3>Зачем этот урок</h3>
<p><strong>ТЗ</strong> — что делаем. <strong>Смета</strong> — сколько стоит. <strong>Оценка часов</strong> — основа сметы. Без этого вы работаете бесплатно, потому что «ещё чуть-чуть» никогда не заканчивается.</p>
<p>Буфер 20–30% на правки — не жадность, а профессионализм.</p>

<h3>Пример сметы на лендинг</h3>
<table><tr><th>Этап</th><th>Часы</th><th>Ставка</th><th>Сумма</th></tr>
<tr><td>Аналитика и дизайн (4+8+16+8+4)</td><td>40</td><td>2000 ₽</td><td>80 000 ₽</td></tr>
<tr><td>Вёрстка (20+12+12)</td><td>44</td><td>2000 ₽</td><td>88 000 ₽</td></tr>
<tr><td>Интеграции</td><td>16</td><td>2000 ₽</td><td>32 000 ₽</td></tr>
<tr><td>Правки (буфер 22%)</td><td>22</td><td>2000 ₽</td><td>44 000 ₽</td></tr>
<tr><td><strong>Итого</strong></td><td><strong>122</strong></td><td></td><td><strong>244 000 ₽</strong></td></tr></table>

<h3>Правила оценки</h3>
<ul>
<li>Оценивайте диапазоном (36–48 ч), не «ровно 40»</li>
<li>Всегда буфер 20–30% на правки</li>
<li>Время ожидания клиента — тоже время</li>
<li>Фиксируйте: что входит, что НЕ входит</li>
</ul>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>ТЗ</dt><dd>Техническое задание.</dd>
<dt>Смета</dt><dd>Расчёт стоимости работ.</dd>
<dt>Ставка</dt><dd>Цена часа работы.</dd>
<dt>Буфер</dt><dd>Запас времени на правки.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему буфер? Правки всегда есть, иначе часть работы делается бесплатно. Почему диапазон? «Ровно 40 часов» почти никогда не сбывается. Почему фиксировать объём? Чтобы клиент не потребовал «ещё вот это» бесплатно.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Смета — как расчёт стоимости ремонта: материалы, работа, запас на непредвиденное. Буфер — как запас на «а тут ещё и потолок»: без него бюджет лопнет. Ставка — как цена часа мастера: чем опытнее, тем дороже.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Нет буфера</strong> — работаете бесплатно. <strong>Оценка «ровно»</strong> — сорвёте срок. <strong>Не зафиксирован объём</strong> — бесконечные доработки.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Составить ТЗ и смету</div>
<div class="task-why">Зачем: без этого невозможно работать с клиентами.</div>
<ol class="steps">
<li>Составь ТЗ на реальный лендинг (8 блоков, форма, выгрузка).</li>
<li>Разбей на этапы с часами, добавь буфер 20%.</li>
<li>Посчитай цену при ставке 1500, 2000 и 3000 ₽/час.</li>
<li>Выпиши отдельно: что НЕ входит в объём.</li>
<li>Проверь: можно ли по этому ТЗ принять работу?</li>
</ol>
<div class="task-r">Результат: рабочие ТЗ и смета.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Нет буфера.</strong> Бесплатная работа.</li>
<li><strong>Оценка «ровно».</strong> Сорвёте срок.</li>
<li><strong>Не зафиксирован объём.</strong> Бесконечные доработки.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Из чего состоит смета?</li>
<li>Зачем буфер 20%?</li>
<li>Почему оценка диапазоном?</li>
<li>Что фиксировать в ТЗ?</li></ol></div>
`},

{t:"Договор, предоплата, этапы",g:"Защитить себя юридически и финансово.",c:`
<h3>Зачем этот урок</h3>
<p>Договор нужен не «для галочки». Он защищает от главных рисков: <strong>клиент исчез</strong>, <strong>клиент требует бесконечных правок</strong>, <strong>клиент не платит</strong>.</p>
<p>Без предоплаты можно не получить оплату вообще; без финального платежа — после работы.</p>

<h3>Девять обязательных разделов</h3>
<ol>
<li>Предмет — что делаем (ссылка на ТЗ)</li>
<li>Стоимость и порядок оплаты (50/50)</li>
<li>Сроки — даты этапов</li>
<li>Приёмка — акт, срок ответа 5 дней</li>
<li>Правки — 2 круга бесплатно, далее платно</li>
<li>Интеллектуальная собственность</li>
<li>Конфиденциальность</li>
<li>Форс-мажор</li>
<li>Реквизиты и подписи</li>
</ol>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Предоплата</dt><dd>Платёж до начала работы.</dd>
<dt>Акт приёмки</dt><dd>Документ о сдаче работы.</dd>
<dt>Допсоглашение</dt><dd>Документ на дополнительные работы.</dd>
<dt>Штраф</dt><dd>Неустойка за просрочку.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему 50/50? Без предоплаты клиент может исчезнуть; без финального платежа — не заплатить после сдачи. Почему фиксировать круги правок? Иначе клиент потребует бесконечных бесплатных доработок. Почему штраф? Чтобы платили вовремя.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Договор — как брачный контракт: неприятно думать заранее, но спасает при расставании. Предоплата — как задаток при бронировании: подтверждает серьёзность намерений. Штраф — как пеня за просрочку аренды: без него платят когда захотят.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Работа без предоплаты</strong> — «работал месяц, клиент пропал». <strong>Не указаны круги правок</strong> — бесконечная бесплатная работа. <strong>Нет штрафа</strong> — платят когда захотят.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Составить пакет документов</div>
<div class="task-why">Зачем: защита денег и нервов.</div>
<ol class="steps">
<li>Составь шаблон договора на разработку сайта.</li>
<li>Внеси разделы: предмет, оплата 50/50, правки (2 круга), штраф 0.5%/день (но не более 10% от суммы договора).</li>
<li>Составь шаблон акта приёмки-передачи.</li>
<li>Составь шаблон допсоглашения на дополнительные работы.</li>
<li>Проверь: все ли риски закрыты?</li>
</ol>
<div class="task-r">Результат: юридическая защита проекта.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Без предоплаты.</strong> Клиент пропал.</li>
<li><strong>Не указаны круги.</strong> Бесконечные правки.</li>
<li><strong>Нет штрафа.</strong> Платят когда захотят.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Назови пять разделов договора.</li>
<li>Почему 50/50?</li>
<li>Зачем фиксировать круги правок?</li>
<li>Что такое допсоглашение?</li></ol></div>
`},

{t:"Переговоры и работа с правками",g:"Говорить о деньгах и держать границы.",c:`
<h3>Зачем этот урок</h3>
<p>Две ситуации, в которых новички теряют деньги: <strong>первый созвон</strong> (не могут назвать цену) и <strong>правки</strong> (делают бесконечно бесплатно).</p>
<p>Назвать цену диапазоном и сразу перевести разговор на бриф — работает лучше любой «точной» цифры.</p>

<h3>Как назвать цену</h3>
<pre>✗ «Ну… я не знаю… может быть… 50 тысяч?»
  → клиент слышит «цена обсуждаема, можно сбить»

✓ «По моему опыту проекты такого уровня —
   от 150 до 250 тысяч. Чтобы назвать точную
   цифру, нужно изучить задачу.»
  + «Пришлю бриф и смету в течение двух дней»</pre>

<h3>Правило «кругов правок»</h3>
<p>Круг 1 и 2 — бесплатно по ТЗ. Круг 3+ — новая функциональность, оценивается отдельно.</p>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Переговоры</dt><dd>Обсуждение условий.</dd>
<dt>Возражение</dt><dd>Причина отказа.</dd>
<dt>Круг правок</dt><dd>Цикл исправлений.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему диапазон? Точная цифра до изучения задачи — риск ошибиться. Почему не извиняться за цену? Клиент слышит «я сам не уверен в качестве». Почему фиксировать круги? Иначе правки бесконечны.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Назвать цену — как при покупке машины на рынке: колеблешься — торгуются. Круги правок — как гарантийный ремонт: первый раз бесплатно, за изменения платишь сам.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Назвать цену в первую минуту</strong> — ещё не знаете задачу. <strong>Извиняться за цену</strong> — теряете авторитет. <strong>Бесконечные бесплатные правки</strong> — теряете деньги.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Отработать три сценария</div>
<div class="task-why">Зачем: переговоры — навык, а не талант.</div>
<ol class="steps">
<li>Отыграй с ИИ: «сделай как у Apple за 30 тыс.».</li>
<li>Отыграй: «а можно ещё вот это?» (третий круг правок).</li>
<li>Отыграй: «цена высокая».</li>
<li>Напиши шаблон вежливого отказа от бесплатной доработки.</li>
<li>Напиши шаблон ответа на «а можно подешевле?».</li>
</ol>
<div class="task-r">Результат: готовые формулировки для сложных разговоров.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Цена в первую минуту.</strong> Не знаете задачу.</li>
<li><strong>Извинения за цену.</strong> Теряете авторитет.</li>
<li><strong>Бесплатные правки.</strong> Теряете деньги.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Как назвать цену?</li>
<li>Сколько кругов правок бесплатно?</li>
<li>Что делать с «а можно ещё вот это»?</li>
<li>Почему нельзя извиняться за цену?</li></ol></div>
`},

{t:"Ценообразование и защита цены",g:"Получать достойную оплату и не сдавать позиции.",c:`
<h3>Зачем этот урок</h3>
<p>Цена ≠ ваши затраты. Цена = <strong>ценность для клиента</strong>. Магазин, который приносит ему 500 000 ₽ в месяц, стоит дороже, чем 100 часов вашего времени.</p>
<p>Пакеты цен продают лучше одной цены.</p>

<h3>Три модели</h3>
<ul>
<li><strong>Почасовая</strong> — часы × ставка (поддержка, доработки)</li>
<li><strong>Проектная</strong> — ценность результата (чёткое ТЗ)</li>
<li><strong>Пакетная</strong> — 3 уровня (лендинги, типовые продукты)</li>
</ul>

<h3>Пример: три пакета на лендинг</h3>
<table><tr><th>Пакет</th><th>Цена</th><th>Что входит</th></tr>
<tr><td>СТАРТ</td><td>60 000 ₽</td><td>5 блоков, шаблонный дизайн, 2 раунда правок, 2 недели</td></tr>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Пакет</dt><dd>Готовое предложение с фиксированным объёмом.</dd>
<dt>Себестоимость</dt><dd>Затраты на проект.</dd>
<dt>Защита цены</dt><dd>Аргументация стоимости.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему пакеты? Средний пакет выглядит оптимальным и выбирается чаще. Почему не скидывать без уменьшения объёма? Обучаете клиента торговаться. Почему повышать цены? Через год работаете за те же деньги.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Пакеты — как комплекты в автосалоне: базовая, средняя, полная. Больше всего покупают среднюю. Защита цены — как объяснить, почему чашка кофе стоит 300 ₽: не за кружку, за атмосферу и место.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Скидка без уменьшения объёма</strong> — обучаете торговаться. <strong>Не повышаете цены</strong> — через год работаете за те же деньги. <strong>Один средний ценник</strong> — нет якоря для сравнения.</p></div>

<li>Напиши 3 аргумента в защиту своей цены.</li>
<li>Спланируй повышение: сейчас +20%, через 3 месяца +20%.</li>
</ol>
<div class="task-r">Результат: пакетная система продаж.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Скидка без объёма.</strong> Обучаете торгаться.</li>
<li><strong>Не повышаете.</strong> Те же деньги.</li>

{t:"Портфолио и кейсы",g:"Показывать результат, а не скриншоты.",c:`
<h3>Зачем этот урок</h3>
<p>Клиент покупает не «красивый сайт», а <strong>решение своей задачи</strong>. Поэтому кейс — не галерея скриншотов, а история: было → стало → сколько денег принесло.</p>
<p>Цифры результата — главное отличие кейса от портфолио.</p>

<h3>Пять блоков кейса</h3>
<ol>
<li>Клиент и задача (проблема в цифрах)</li>
<li>Что сделано (3–5 конкретных действий)</li>
<li>Результат в цифрах («Заявок +180%»)</li>
<li>Технологии (показывает экспертизу)</li>
<li>Ссылка на живой сайт + отзыв</li>
</ol>

<div class="term"><div class="term-t">Как это называется правильно</div>
<dl>
<dt>Кейс</dt><dd>История проекта с результатом.</dd>
<dt>Портфолио</dt><dd>Набор лучших работ.</dd>
<dt>Соцдоказательство</dt><dd>Доказательство результата.</dd>
</dl></div>

<div class="why"><div class="why-t">Почему именно так, а не иначе</div>
<p>Почему цифры? «Заявок +180%» доказывает ценность, фраза «сделал сайт» — нет. Почему живая ссылка? Доказательство, что работает. Почему технологии? Показывает экспертизу.</p></div>

<div class="life"><div class="life-t">Пример из жизни</div>
<p>Кейс — как история похудения: «было 90 кг, стало 70 за полгода» вместо «я занимался спортом». Цифры убеждают, слова — нет. Живая ссылка — как фото «до/после»: видно результат.</p></div>

<div class="risk"><div class="risk-t">Что пойдёт не так, если нарушить</div>
<p><strong>Кейс без цифр</strong> — ни о чём. <strong>Только скриншоты</strong> — нет процесса и результата. <strong>Нет отзывов</strong> — нет доверия.</p></div>

<h3>Что делать на практике</h3>
<div class="task"><div class="task-h">Задание 1. Оформить три кейса</div>
<div class="task-why">Зачем: кейс продаёт вас, а не скриншот.</div>
<ol class="steps">
<li>Оформи 3 кейса из своих проектов по схеме из пяти блоков.</li>
<li>В каждом укажи результат в цифрах.</li>
<li>Сделай личный сайт-портфолио (сетка + страница кейса).</li>
<li>Собери 2 отзыва от довольных клиентов.</li>
<li>Выложи на Behance визуальные проекты.</li>
</ol>
<div class="task-r">Результат: портфолио, которое продаёт.</div></div>

<div class="warn"><div class="warn-t">Частые ошибки</div><ul>
<li><strong>Кейс без цифр.</strong> Ни о чём.</li>
<li><strong>Только скриншоты.</strong> Нет процесса.</li>
<li><strong>Нет отзывов.</strong> Нет доверия.</li>
</ul></div>

<div class="check"><div class="check-t">Проверь себя</div>
<ol><li>Назови пять блоков кейса.</li>
<li>Почему цифры важнее слов?</li>
<li>Где показывать портфолио?</li>
<li>Что делает кейс продающим?</li></ol></div>
`},

<li><strong>Рефералы</strong> — «приведи клиента — 10% тебе» (лучший канал со временем)</li>
<li><strong>Холодные письма</strong> — цель 20 писем в день (начать с 5 качественных), конкретное предложение</li>
